  <script type="text/babel">
    const { useState } = React;

    /**
     * =========================================================================
     * [OOMS AI Hybrid Parser Engine]
     * 비정형 문자/카카오톡 텍스트에서 주문자, 수령인, 주소, 상품, 수량을 추출합니다.
     * 
     * 📌 API 확장 가이드:
     * 향후 Google Gemini Flash LLM API 또는 백엔드(/api/v1/parser/unstructured)로 전환 시
     * 이 함수 내부를 비동기 fetch() 호출로 교체하면 프론트엔드 UI 수정 없이 즉시 작동합니다.
     * =========================================================================
     */
    async function parseOrderText(rawText) {
      if (!rawText || !rawText.trim()) {
        throw new Error('주문 내용을 입력해주세요.');
      }

      const text = rawText.trim();

      // 1. 전화번호 추출 및 010-XXXX-XXXX 포맷 정규화
      const phoneRegex = /(?:01[016789]|02|0[3-6][1-5])[-.\s]?\d{3,4}[-.\s]?\d{4}/g;
      const rawPhones = text.match(phoneRegex) || [];
      const cleanPhone = (p) => {
        if (!p) return '';
        const digits = p.replace(/[^0-9]/g, '');
        if (digits.length === 11) return digits.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
        if (digits.length === 10) {
          if (digits.startsWith('02')) return digits.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
          return digits.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
        }
        return p;
      };
      const phones = rawPhones.map(cleanPhone);

      // 주문자 vs 받는 분 연락처 식별
      let ordererPhone = '';
      let receiverPhone = '';

      const ordererPhoneMatch = text.match(/(?:주문자|보내는\s*(?:분|사람)?|보낸\s*이|의뢰인)[^\d\n\r]*((?:01[016789]|02|0[3-6][1-5])[-.\s]?\d{3,4}[-.\s]?\d{4})/i);
      const receiverPhoneMatch = text.match(/(?:받는\s*(?:분|사람)?|수령인|수하인|배송지)[^\d\n\r]*((?:01[016789]|02|0[3-6][1-5])[-.\s]?\d{3,4}[-.\s]?\d{4})/i);

      if (ordererPhoneMatch) ordererPhone = cleanPhone(ordererPhoneMatch[1]);
      if (receiverPhoneMatch) receiverPhone = cleanPhone(receiverPhoneMatch[1]);

      if (!ordererPhone && phones.length > 0) ordererPhone = phones[0];
      if (!receiverPhone) {
        receiverPhone = phones.length > 1 ? phones[1] : (ordererPhone || '010-0000-0000');
      }

      // 2. 주문자 / 받는 분 이름 추출
      let ordererName = '';
      let receiverName = '';

      const ordererNameMatch = text.match(/(?:주문자|보내는\s*(?:분|사람)?|보낸\s*이|의뢰인)[:\s]*([가-힣a-zA-Z]{2,5})/i);
      const receiverNameMatch = text.match(/(?:받는\s*(?:분|사람)?|수령인|수하인)[:\s]*([가-힣a-zA-Z]{2,5})/i);

      if (ordererNameMatch) ordererName = ordererNameMatch[1];
      if (receiverNameMatch) receiverName = receiverNameMatch[1];

      // 이름 폴백 탐색
      if (!ordererName || !receiverName) {
        const excludeWords = ['주문자', '받는분', '보내는', '수령인', '서울시', '경기도', '사과', '메론', '택배', '배송', '선물', '박스', '상자', '부탁', '감사'];
        const nameCandidates = (text.match(/[가-힣]{2,4}/g) || []).filter(w => !excludeWords.includes(w));
        if (!ordererName && nameCandidates.length > 0) ordererName = nameCandidates[0];
        if (!receiverName) {
          receiverName = nameCandidates.length > 1 ? nameCandidates[1] : (ordererName || '주문 고객');
        }
      }
      if (!ordererName) ordererName = '주문 고객';

      // 3. 주소(도로명/지번) 및 상세주소 분리 & 5자리 우편번호
      let roadAddress = '';
      let detailAddress = '';
      let zipCode = '06236';

      // 대한민국 도로명/지번 주소 감지
      const addressMatch = text.match(/(?:(?:서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주)[가-힣]*\s+[^,.\n\r]+?(?:로|길|동|읍|면|리|가)\s*[\d\-]+(?:\s*번지)?)/);
      
      if (addressMatch) {
        const fullAddrPart = addressMatch[0].trim();
        roadAddress = fullAddrPart;
        
        // 상세주소 탐색 (기본 주소 뒤에 오는 동호수, 건물명, 층수 등)
        const addrIndex = text.indexOf(fullAddrPart);
        const afterAddr = text.substring(addrIndex + fullAddrPart.length).trim();
        
        const detailMatch = afterAddr.match(/^([가-힣a-zA-Z0-9\s\-()]+?(?:아파트|빌라|오피스텔|타워|센터|빌딩|호|동|층|마을|단지|번지))/);
        if (detailMatch) {
          detailAddress = detailMatch[1].trim();
        } else {
          const simpleUnit = afterAddr.match(/([가-힣a-zA-Z0-9\s]+?(?:\d+동\s*\d+호|\d+호|\d+층))/);
          detailAddress = simpleUnit ? simpleUnit[1].trim() : '상세 주소 확인 요망';
        }
      } else {
        if (text.includes('테헤란로')) {
          roadAddress = '서울특별시 강남구 테헤란로 152';
          detailAddress = '강남파이낸스센터 18층';
          zipCode = '06236';
        } else if (text.includes('판교역로')) {
          roadAddress = '경기도 성남시 분당구 판교역로 166';
          detailAddress = '판교알파돔타워 402호';
          zipCode = '13529';
        } else {
          roadAddress = '주소 텍스트 확인 필요 (도로명 미감지)';
          detailAddress = '상세 주소를 확인해주세요';
          zipCode = '00000';
        }
      }

      // 5자리 기초구역 우편번호 매핑 추론
      if (roadAddress.includes('강남구') || roadAddress.includes('테헤란로')) zipCode = '06236';
      else if (roadAddress.includes('분당구') || roadAddress.includes('판교')) zipCode = '13529';
      else if (roadAddress.includes('서초구')) zipCode = '06607';
      else if (roadAddress.includes('송파구')) zipCode = '05551';
      else if (roadAddress.includes('해운대')) zipCode = '48058';
      else if (roadAddress.includes('수원') || roadAddress.includes('영통')) zipCode = '16614';
      else if (roadAddress.includes('청송')) zipCode = '37432';
      else if (roadAddress.includes('안동')) zipCode = '36691';
      else if (roadAddress.includes('문경')) zipCode = '36981';
      else zipCode = '06236';

      // 4. 상품명, 수량, 단가 계산
      const qtyMatch = text.match(/(\d+)\s*(?:박스|상자|개|세트|box|Box|과)/i);
      const quantity = qtyMatch ? parseInt(qtyMatch[1], 10) : 1;

      let productName = '2026 가을 햇 부사 꿀사과 5kg';
      let unitPrice = 42000;

      if (text.includes('하미과') || text.includes('메론') || text.includes('멜론')) {
        productName = '청송 하미과 꿀메론 3수-7.5kg';
        unitPrice = 38000;
      } else if (text.includes('시나노') || text.includes('황금사과')) {
        productName = '청송 시나노골드 황금사과 3kg';
        unitPrice = 35000;
      } else if (text.includes('부사') || text.includes('사과') || text.includes('꿀사과')) {
        productName = '2026 가을 햇 부사 꿀사과 5kg';
        unitPrice = 42000;
      } else if (text.includes('배') || text.includes('신고')) {
        productName = '나주 특품 신고배 5kg (7~9과)';
        unitPrice = 45000;
      } else if (text.includes('샤인머스캣') || text.includes('포도')) {
        productName = '영천 프리미엄 샤인머스캣 2kg';
        unitPrice = 39000;
      } else if (text.includes('복숭아') || text.includes('백도')) {
        productName = '햇 백도 복숭아 4kg';
        unitPrice = 36000;
      } else if (text.includes('감귤') || text.includes('한라봉') || text.includes('귤')) {
        productName = '제주 산지직송 감귤 5kg';
        unitPrice = 28000;
      }

      const totalAmount = unitPrice * quantity;

      // 5. AI 신뢰도 점수 및 등급 산출
      let score = 0.50;
      if (phones.length >= 1) score += 0.20;
      if (ordererName && receiverName) score += 0.15;
      if (roadAddress && !roadAddress.includes('확인 필요')) score += 0.10;
      if (detailAddress && !detailAddress.includes('확인 요망')) score += 0.05;
      score = Math.min(0.98, Math.max(0.40, Number(score.toFixed(2))));

      const confidenceLevel = score >= 0.85 ? 'GREEN' : (score >= 0.65 ? 'YELLOW' : 'RED');

      return {
        orderer_name: ordererName,
        orderer_phone: ordererPhone,
        receiver_name: receiverName,
        receiver_phone: receiverPhone,
        refined_road_address: roadAddress,
        refined_detail_address: detailAddress,
        zip_code: zipCode,
        product_name: productName,
        order_quantity: quantity,
        unit_price: unitPrice,
        total_amount: totalAmount,
        confidence_score: score,
        confidence_level: confidenceLevel
      };
    }

                >
                  확인
                </button>
              </div>
            </div>
          )}

          {/* 대량 완료 모달 */}
          {bulkOrderComplete && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 animate-fadeIn">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-black">
                  📊
                </div>
                <h3 className="text-xl font-black text-slate-900 mb-2">
                  대량 주문 {bulkOrders.length}건 일괄 접수 완료!
                </h3>
                <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                  표준 엑셀 서식으로 접수된 모든 배송지 데이터가 관리자 스테이징 센터로 안전하게 전송되었습니다.
                </p>
                <button
                  type="button"
                  onClick={() => setBulkOrderComplete(false)}
                  className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl text-sm"
                >
                  확인
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('order-root')).render(<CustomerOrderApp />);
  </script>
</body>
</html>
