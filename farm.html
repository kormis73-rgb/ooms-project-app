    function FarmPortalApp() {
      // [멀티탭 격리] 농가 전용 세션 관리 (1순위: URL ?farm= 파라미터, 2순위: 탭 전용 sessionStorage: ooms_farm_session)
      const [currentMerchant, setCurrentMerchant] = useState(() => {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const farmParam = urlParams.get('farm') || urlParams.get('code') || urlParams.get('merchantCode');

          const allFarmsRaw = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
          let allFarms = [];
          if (allFarmsRaw) {
            try {
              const parsed = JSON.parse(allFarmsRaw);
              if (Array.isArray(parsed)) {
                allFarms = parsed.filter(f => {
                  const code = f.merchantCode || f.farmCode || f.code || '';
                  const name = f.farmName || '';
                  return code !== 'FARM-2026-001' && code !== 'FARM-2026-002' &&
                         !name.includes('청송 하늘아래') && !name.includes('나주 금천 배사랑');
                });
              }
            } catch (e) {}
          }

          // 1순위: URL ?farm= 쿼리 파라미터 최우선 바인딩 (이전 캐시나 하드코딩값으로 절대 덮어쓰지 않음)
          if (farmParam) {
            const cleanP = farmParam.trim().toLowerCase();

            // 1-0. 세션/로컬 스토리지에 저장된 실제 로그인 농가('current_user_farm')와 일치하는지 확인
            try {
              const curUserFarmRaw = sessionStorage.getItem('current_user_farm') || localStorage.getItem('current_user_farm');
              if (curUserFarmRaw) {
                const curUserFarm = JSON.parse(curUserFarmRaw);
                const curCode = (curUserFarm.farmCode || curUserFarm.merchantCode || curUserFarm.code || curUserFarm.loginId || '').trim().toLowerCase();
                if (curCode === cleanP || (curUserFarm.farmName && curUserFarm.farmName.toLowerCase().includes(cleanP))) {
                  const normalized = {
                    ...curUserFarm,
                    farmCode: curUserFarm.farmCode || curUserFarm.merchantCode || farmParam,
                    code: curUserFarm.merchantCode || curUserFarm.farmCode || farmParam,
                    approvalStatus: curUserFarm.approvalStatus || curUserFarm.status || 'APPROVED',
                    status: curUserFarm.approvalStatus || curUserFarm.status || 'APPROVED',
                    products: curUserFarm.products || []
                  };
                  try {
                    sessionStorage.setItem('ooms_farm_session', JSON.stringify(normalized));
                    localStorage.setItem('ooms_current_farm', JSON.stringify(normalized));
                    localStorage.setItem('ooms_farm_code', normalized.farmCode);
                    sessionStorage.setItem('ooms_farm_code', normalized.farmCode);
                  } catch(e){}
                  return normalized;
                }
              }
            } catch (e) {}

            // 1-1. 전체 농가 데이터베이스에서 매칭
            const matched = allFarms.find(f => 
              (f.merchantCode && f.merchantCode.toLowerCase() === cleanP) ||
              (f.farmCode && f.farmCode.toLowerCase() === cleanP) ||
              (f.code && f.code.toLowerCase() === cleanP) ||
              (f.id && f.id.toLowerCase() === cleanP) ||
              (f.loginId && f.loginId.toLowerCase() === cleanP) ||
              (f.farmName && f.farmName.toLowerCase().includes(cleanP)) ||
              (f.repName && f.repName.toLowerCase() === cleanP) ||
              (f.owner && f.owner.toLowerCase() === cleanP)
            );
            if (matched) {
              const normalized = {
                ...matched,
                farmCode: matched.merchantCode || matched.farmCode || farmParam,
                code: matched.merchantCode || matched.code || farmParam,
                approvalStatus: matched.approvalStatus || matched.status || 'APPROVED',
                status: matched.approvalStatus || matched.status || 'APPROVED',
                products: matched.products || []
              };
              try {
                sessionStorage.setItem('ooms_farm_session', JSON.stringify(normalized));
                localStorage.setItem('ooms_current_farm', JSON.stringify(normalized));
                localStorage.setItem('ooms_farm_code', normalized.farmCode);
                sessionStorage.setItem('ooms_farm_code', normalized.farmCode);
              } catch(e){}
              return normalized;
            }

            // 1-2. query param이 FARM-2026-224 또는 test일 때 DEFAULT_FARM (김혜진 대표 / 태안 사과농장)
            if (cleanP === 'farm-2026-224' || cleanP === 'test' || cleanP.includes('태안')) {
              try {
                sessionStorage.setItem('ooms_farm_session', JSON.stringify(DEFAULT_FARM));
                localStorage.setItem('ooms_current_farm', JSON.stringify(DEFAULT_FARM));
                localStorage.setItem('ooms_farm_code', DEFAULT_FARM.farmCode);
                sessionStorage.setItem('ooms_farm_code', DEFAULT_FARM.farmCode);
              } catch(e){}
              return DEFAULT_FARM;
            }

            // 1-3. query param이 FARM-2026-456일 때 CHEONGSONG_FARM (조국래 대표 / 청송 꿀사과 농원)
            if (cleanP === 'farm-2026-456' || cleanP === 'kakao_456' || cleanP.includes('청송')) {
              try {
                sessionStorage.setItem('ooms_farm_session', JSON.stringify(CHEONGSONG_FARM));
                localStorage.setItem('ooms_current_farm', JSON.stringify(CHEONGSONG_FARM));
                localStorage.setItem('ooms_farm_code', CHEONGSONG_FARM.farmCode);
                sessionStorage.setItem('ooms_farm_code', CHEONGSONG_FARM.farmCode);
              } catch(e){}
              return CHEONGSONG_FARM;
            }

            // 1-4. 신규/미등록 농가 코드의 경우, 다른 농가의 상품이나 주문이 섞이지 않는 독립된 클린 워크스페이스 생성 (심사대기 PENDING 상태)
            const dynamicFarm = {
              id: `m-${cleanP}`,
              merchantCode: farmParam,
              farmCode: farmParam,
              code: farmParam,
              loginId: cleanP,
              farmName: farmParam.startsWith('FARM-') ? `농가 (${farmParam})` : farmParam,
              repName: '신규 대표',

              status: 'PENDING',
              approvalStatus: 'PENDING',
              products: []
            };
            try {
              sessionStorage.setItem('ooms_farm_session', JSON.stringify(dynamicFarm));
              localStorage.setItem('ooms_current_farm', JSON.stringify(dynamicFarm));
              localStorage.setItem('ooms_farm_code', dynamicFarm.farmCode);
              sessionStorage.setItem('ooms_farm_code', dynamicFarm.farmCode);
            } catch(e){}
            return dynamicFarm;
          }

          // 2순위: 세션/로컬 스토리지에 저장된 실제 로그인 농가('current_user_farm') 확인
          const curUserFarmRaw = sessionStorage.getItem('current_user_farm') || localStorage.getItem('current_user_farm');
          if (curUserFarmRaw) {
            try {
              const curFarm = JSON.parse(curUserFarmRaw);
              if (curFarm && (curFarm.farmCode || curFarm.merchantCode || curFarm.farmName)) {
                return {
                  ...curFarm,
                  farmCode: curFarm.farmCode || curFarm.merchantCode || 'FARM-2026-224',
                  code: curFarm.merchantCode || curFarm.farmCode || 'FARM-2026-224',
                  approvalStatus: curFarm.approvalStatus || curFarm.status || 'APPROVED',
                  status: curFarm.approvalStatus || curFarm.status || 'APPROVED',
                  products: curFarm.products || []
                };
              }
            } catch(e) {}
          }

          // 2순위: localStorage: ooms_farmer_session 및 ooms_session 확인
          const farmerSessionRaw = localStorage.getItem('ooms_farmer_session') || localStorage.getItem('ooms_session');
          if (farmerSessionRaw) {
            try {
              const fSession = JSON.parse(farmerSessionRaw);
              if (fSession && fSession.farmCode) {
                const sCode = fSession.farmCode.trim().toLowerCase();
                const matchedSessionFarm = allFarms.find(f =>
                  (f.merchantCode && f.merchantCode.toLowerCase() === sCode) ||
                  (f.farmCode && f.farmCode.toLowerCase() === sCode) ||
                  (f.code && f.code.toLowerCase() === sCode) ||
                  (f.loginId && f.loginId.toLowerCase() === sCode)
                );
                if (matchedSessionFarm) {
                  const normalized = {
                    ...matchedSessionFarm,
                    farmCode: matchedSessionFarm.merchantCode || matchedSessionFarm.farmCode || fSession.farmCode,
                    code: matchedSessionFarm.merchantCode || matchedSessionFarm.code || fSession.farmCode,
                    approvalStatus: matchedSessionFarm.approvalStatus || matchedSessionFarm.status || fSession.approvalStatus || 'APPROVED',
                    status: matchedSessionFarm.approvalStatus || matchedSessionFarm.status || fSession.approvalStatus || 'APPROVED',
                    products: matchedSessionFarm.products || []
                  };
                  try { sessionStorage.setItem('ooms_farm_session', JSON.stringify(normalized)); } catch(e){}
                  return normalized;
                }
                // 세션에 저장된 정보로 반환
                const directFromSession = {
                  id: `m-${sCode}`,
                  merchantCode: fSession.farmCode,
                  farmCode: fSession.farmCode,
                  code: fSession.farmCode,
                  loginId: fSession.farmCode,
                  farmName: fSession.farmName || fSession.farmCode,
                  repName: fSession.repName || '대표',
                  phone: fSession.phone || '010-0000-0000',
                  address: fSession.address || '주소 등록',

                  approvalStatus: fSession.approvalStatus || 'APPROVED',
                  products: fSession.merchant?.products || []

          const tabSessionRaw = sessionStorage.getItem('ooms_farm_session');

            if (parsedTab && (parsedTab.merchantCode || parsedTab.farmName)) {
              return {

          if (allFarms.length > 0) {

              ...allFarms[0],

      // 2. 농가 주문 목록 상태 관리 (localStorage 'ooms_orders' 연동 및 DEFAULT_ORDERS(8건) 보증)
      const [orders, setOrdersState] = useState(() => {
        try {
          const saved = localStorage.getItem('ooms_orders') || localStorage.getItem('ooms_staging_orders');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
          // 저장된 주문이 없거나 비어있는 경우 8건 표준 주문 시딩
          try {
            localStorage.setItem('ooms_orders', JSON.stringify(DEFAULT_ORDERS));
            localStorage.setItem('ooms_staging_orders', JSON.stringify(DEFAULT_ORDERS));
          } catch(e){}
          return DEFAULT_ORDERS;
        } catch (e) {
          console.error('주문 데이터 로드 오류:', e);
        }
        return DEFAULT_ORDERS;
      });

      // orders 변경 시 localStorage 자동 동기화 헬퍼

          try {
            localStorage.setItem('ooms_orders', JSON.stringify(next));
            localStorage.setItem('ooms_staging_orders', JSON.stringify(next));

        const normalizePhone = (val) => {
          if (!val) return '010-0000-0000';
          let str = String(val).trim().replace(/[^0-9]/g, '');
          if (str.length === 11) return str.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
          if (str.length === 10) {
            if (str.startsWith('02')) return str.replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
            return str.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
          }
          return str || '010-0000-0000';
        };

        const processRows = (rows) => {
          if (!rows || rows.length === 0) {
            alert('파일에 데이터가 없습니다.');
            return;
          }

          let parsedRows = [];
          let headerIdx = -1;
          let colMap = { receiver: -1, phone: -1, address: -1, detailAddress: -1, zip: -1, product: -1, qty: -1, note: -1 };

          for (let r = 0; r < Math.min(rows.length, 5); r++) {
            const rowStr = rows[r].map(c => String(c || '').trim());
            const hasReceiver = rowStr.some(c => /수령인|받는\s*분|받는사람|성명|이름|고객명/.test(c));
            const hasAddress = rowStr.some(c => /주소|배송지|도로명|지번/.test(c));
            const hasPhone = rowStr.some(c => /전화|연락처|휴대폰|핸드폰|번호/.test(c));

            if (hasReceiver || hasAddress || hasPhone) {
              headerIdx = r;
              rowStr.forEach((colName, cIdx) => {
                if (/수령인|받는\s*분|받는사람|성명|이름|고객명/.test(colName) && colMap.receiver === -1) colMap.receiver = cIdx;
                else if (/전화|연락처|휴대폰|핸드폰|번호|tel|phone/i.test(colName) && colMap.phone === -1) colMap.phone = cIdx;
                else if (/상세주소|동호수|상세/i.test(colName) && colMap.detailAddress === -1) colMap.detailAddress = cIdx;
                else if (/도로명주소|배송지|주소|도로명/i.test(colName) && colMap.address === -1) colMap.address = cIdx;
                else if (/우편번호|우편|zonecode|zip/i.test(colName) && colMap.zip === -1) colMap.zip = cIdx;
                else if (/상품명|품목|상품|품종/i.test(colName) && colMap.product === -1) colMap.product = cIdx;
                else if (/수량|박스|상자|개수|qty/i.test(colName) && colMap.qty === -1) colMap.qty = cIdx;
                else if (/배송메모|요청사항|메모|비고|note/i.test(colName) && colMap.note === -1) colMap.note = cIdx;
              });
              break;
            }
          }

          if (headerIdx === -1) {
            colMap = { receiver: 0, phone: 1, address: 2, detailAddress: 3, zip: 4, product: 5, qty: 6, note: 7 };
          } else {
            if (colMap.receiver === -1) colMap.receiver = 0;
            if (colMap.phone === -1) colMap.phone = 1;
            if (colMap.address === -1) colMap.address = 2;
          }

          const startRow = headerIdx !== -1 ? headerIdx + 1 : 0;

          for (let i = startRow; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;

            const receiver = String(row[colMap.receiver] || '').trim();
            const phoneRaw = String(row[colMap.phone] || '').trim();
            const address = String(row[colMap.address] || '').trim();

            if (!receiver && !address) continue;

            const detailAddress = colMap.detailAddress !== -1 ? String(row[colMap.detailAddress] || '').trim() : '';
            const zip = colMap.zip !== -1 ? String(row[colMap.zip] || '').trim() : '32145';
            const product = colMap.product !== -1 && row[colMap.product] ? String(row[colMap.product]).trim() : defaultProdName;
            const qtyVal = colMap.qty !== -1 ? parseInt(String(row[colMap.qty]).replace(/[^0-9]/g, ''), 10) : 1;
            const note = colMap.note !== -1 ? String(row[colMap.note] || '').trim() : '부재 시 문 앞 보관';

            parsedRows.push({
              id: parsedRows.length + 1,
              receiver: receiver || `수령인${parsedRows.length + 1}`,
              phone: normalizePhone(phoneRaw),
              address: address || '도로명 주소 확인 필요',
              detailAddress: detailAddress,
              zip: zip || '32145',
              product: product || defaultProdName,
              qty: isNaN(qtyVal) || qtyVal <= 0 ? 1 : qtyVal,
              note: note || '부재 시 문 앞 보관'
            });
          }

          if (parsedRows.length === 0) {
            alert('유효한 주문 데이터를 찾을 수 없습니다.');
            return;
          }

          setOnsiteBulkRows(parsedRows);
          showToast(`📊 '${file.name}' 파싱 완료: 총 ${parsedRows.length}건 배송지 감지`);
        };

        const reader = new FileReader();
        if (window.XLSX && typeof window.XLSX.read === 'function') {
          reader.onload = (event) => {
            try {
              const data = new Uint8Array(event.target.result);
              const workbook = window.XLSX.read(data, { type: 'array', cellDates: true });
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              const jsonRows = window.XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
              processRows(jsonRows);
            } catch (err) {
              console.error('SheetJS 파싱 에러:', err);
              alert('엑셀 파일 파싱 중 오류가 발생했습니다: ' + (err.message || err));
            }
          };
          reader.readAsArrayBuffer(file);
        } else {
          reader.onload = (event) => {
            const text = event.target.result;
            const lines = text.split(/\r\n|\n/).filter(line => line.trim().length > 0);
            const jsonRows = lines.map(line => line.split(','));
            processRows(jsonRows);
          };
          reader.readAsText(file, 'euc-kr');
        }
      };

      // 현장 엑셀 대량 주문 일괄 등록 핸들러
      const handleSaveOnsiteBulkOrders = () => {
        if (!onsiteBulkRows || onsiteBulkRows.length === 0) {
          alert('등록할 엑셀 주문 내역이 없습니다.');
          return;
        }

        const curFarmCode = currentMerchant?.merchantCode || currentMerchant?.farmCode || currentMerchant?.code || 'FARM-2026-224';
        const defaultProd = (currentMerchant?.products && currentMerchant.products[0]) || {
          name: '맛있는 꿀사과 10kg',
          salePrice: 55000,
          price: 55000
        };
        const unitPrice = Number(defaultProd.salePrice || defaultProd.price || 55000);
        const batchTag = Date.now().toString().slice(-4);

        const newBulkOrders = onsiteBulkRows.map((item, idx) => {
          const newOrderId = `ORD-ONSITE-BULK-${batchTag}-${idx + 1}`;
          const q = Number(item.qty) || 1;
          const tot = unitPrice * q;

          return {
            orderId: newOrderId,
            farmCode: curFarmCode,
            farmName: currentMerchant?.farmName || '태안 사과농장',
            senderName: currentMerchant?.repName || '농가현장대량',
            senderPhone: currentMerchant?.phone || '010-3849-1234',
            receiverName: item.receiver,
            receiverPhone: item.phone,
            postcode: item.zip || '32145',
            address: item.address,
            detailAddress: item.detailAddress || '',
            productName: item.product || defaultProd.name,
            quantity: q,
            price: tot,
            memo: item.note || '부재 시 문 앞 보관',
            paymentStatus: onsiteBulkIsPaid ? '입금완료' : '미입금',
            shippingStatus: '준비중',
            channel: '엑셀(대량)',
            source: '엑셀(대량)',
            orderType: '대량주문(엑셀)',
            createdAt: new Date().toISOString(),
            id: newOrderId,
            rawText: `[현장엑셀] ${item.receiver} ${item.phone} ${item.address} ${item.product} ${q}박스`,
            orderer: { name: currentMerchant?.repName || '농가현장대량', tel: currentMerchant?.phone || '010-3849-1234' },
            receiver: { name: item.receiver, tel: item.phone },
            product: { name: item.product || defaultProd.name, qty: q, price: tot },
            status: { payment: onsiteBulkIsPaid ? 'PAID' : 'UNPAID', staging: 'APPROVED' },
            paid: onsiteBulkIsPaid,
            confidence: '100% (현장엑셀등록)',
            tracking: null
          };
        });

        setOrders(prev => [...newBulkOrders, ...prev]);
        setOnsiteBulkRows([]);
        setOnsiteBulkFile(null);

        showToast(`🎉 엑셀 ${newBulkOrders.length}건이 현장 대량주문으로 등록되었습니다!`);
        setMainTab('ORDERS');
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2500);
      };

      // 농가 신규 상품 추가 저장 처리
      const handleSaveNewProduct = (e) => {
        if (e) e.preventDefault();
        const { category, name, spec, price, brix } = addProductModal;

        if (!name.trim()) {
          alert('상품명을 입력해주세요.');
          return;
        }
        const numPrice = Number(String(price).replace(/[^0-9]/g, ''));
        if (!numPrice || numPrice <= 0) {
          alert('올바른 판매 가격을 입력해주세요.');
          return;
        }

        const farmCode = currentMerchant?.merchantCode || currentMerchant?.code || currentMerchant?.farmCode || 'FARM-2026-224';
        const farmName = currentMerchant?.farmName || '산지 농가';
        const newProdId = 'PROD-' + Date.now().toString().slice(-4);

        const newProduct = {
          id: newProdId,
          productId: newProdId,
          farmCode: farmCode,
          merchantCode: farmCode,
          farmName: farmName,
          category: category || '기타 농산물',
          name: name.trim(),
          variety: category || '대표 품종',
          spec: spec.trim() || '규격미기재',
          price: numPrice,
          salePrice: numPrice,
          originPrice: Math.round(numPrice * 1.15),
          brix: brix.trim() || '선별 기준 준수',
          desc: brix.trim() || '선별 기준 준수',
          status: '판매중',
          saleStatus: '판매중',
          createdAt: new Date().toISOString()
        };

        // 1. 현재 농가의 products 배열 갱신 (로컬 상태)
        const updatedProducts = [...(currentMerchant?.products || []), newProduct];
        const updatedMerchant = {
          ...currentMerchant,
          products: updatedProducts
        };
        setCurrentMerchant(updatedMerchant);

        // 2. localStorage: ooms_farms 및 OOMS_MERCHANTS_DATA 동기화
        try {
          const allFarmsRaw = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
          if (allFarmsRaw) {
            const allFarms = JSON.parse(allFarmsRaw);
            if (Array.isArray(allFarms)) {
              const updatedFarms = allFarms.map(f => {
                const c = (f.merchantCode || f.farmCode || f.code || '').toLowerCase();
                const cur = farmCode.toLowerCase();
                if (c === cur || (f.id && f.id === currentMerchant.id)) {
                  return {
                    ...f,
                    products: [...(f.products || []), newProduct]
                  };
                }
                return f;
              });
              localStorage.setItem('ooms_farms', JSON.stringify(updatedFarms));
              localStorage.setItem('OOMS_MERCHANTS_DATA', JSON.stringify(updatedFarms));
            }
          }
        } catch (err) {
          console.error('ooms_farms 저장 오류:', err);
        }

        // 3. localStorage: ooms_products 전체 통합 상품 저장소 동기화
        try {
          const existingProds = JSON.parse(localStorage.getItem('ooms_products') || '[]');
          const updatedProds = [...existingProds, newProduct];
          localStorage.setItem('ooms_products', JSON.stringify(updatedProds));
        } catch (err) {
          console.error('ooms_products 저장 오류:', err);
        }

        // 4. sessionStorage: ooms_farm_session 및 ooms_current_farm 동기화
        try {
          sessionStorage.setItem('ooms_farm_session', JSON.stringify(updatedMerchant));
          localStorage.setItem('ooms_current_farm', JSON.stringify(updatedMerchant));
          localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(updatedMerchant));
          window.dispatchEvent(new Event('storage'));
        } catch (err) {}

        // 모달 닫기 및 폼 초기화
        setAddProductModal({
          isOpen: false,
          category: '사과',
          name: '',
          spec: '',
          price: '',
          brix: ''
        });

        showToast(`🎉 신규 상품 '${newProduct.name}' 등록 완료!`);
      };

      // [정식/생산 관리] 출하예정일 자동 계산 헬퍼 (수박: 90일, 멜론: 100일, 사과: 150일, 기타: 90일)
      const calculateHarvestDate = (cropType, plantedDateStr) => {
        if (!plantedDateStr) return '';
        const d = new Date(plantedDateStr);
        if (isNaN(d.getTime())) return '';
        let days = 90;
        if (cropType === '수박') days = 90;
        else if (cropType === '멜론') days = 100;
        else if (cropType === '사과') days = 150;
        else if (cropType === '배') days = 160;
        else days = 90;

        d.setDate(d.getDate() + days);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      };

      // [정식/생산 관리] 신규 정식 데이터 저장 처리
      const handleSavePlanting = (e) => {
        e.preventDefault();
        const { cropType, cropName, plantedDate, harvestDate, plantedCount, yieldRate, safetyBuffer } = addPlantingModal;
        const curFarmCode = currentMerchant?.merchantCode || currentMerchant?.code || currentMerchant?.farmCode || 'FARM-2026-224';

        const finalHarvest = harvestDate || calculateHarvestDate(cropType, plantedDate);
        const pCount = Number(plantedCount) || 5000;
        const yRate = Number(yieldRate) || 85;
        const sBuffer = Number(safetyBuffer) || 80;
        const totalCap = Math.floor(pCount * (yRate / 100) * (sBuffer / 100));

        const newPlanting = {
          plantingId: `PLT-${curFarmCode.replace(/[^0-9]/g, '') || '224'}-${Date.now().toString().slice(-4)}`,
          farmCode: curFarmCode,
          cropType: cropType || '수박',
          cropName: cropName.trim() || `${cropType} (${curFarmCode})`,
          plantedDate: plantedDate || new Date().toISOString().slice(0, 10),
          harvestDate: finalHarvest,
          plantedCount: pCount,
          yieldRate: yRate,
          safetyBuffer: sBuffer,
          totalCap: totalCap,
          reservedCount: 0,
          status: "GROWING"
        };

        setPlantings(prev => [newPlanting, ...prev]);
        setAddPlantingModal({
          isOpen: false,
          cropType: '수박',
          cropName: '',
          plantedDate: new Date().toISOString().slice(0, 10),
          harvestDate: '',
          plantedCount: 5000,
          yieldRate: 85,
          safetyBuffer: 80
        });

        showToast(`🌱 [${newPlanting.cropType}] 정식 등록 완료! 예약 Cap: ${totalCap.toLocaleString()}박스`);
      };

      // [정식/생산 관리] 작기 상태 변경 처리 (생육중 ➔ 출하임박 ➔ 출하완료)
      const handleChangePlantingStatus = (plantingId, nextStatus) => {
        setPlantings(prev => prev.map(p => {
          if (p.plantingId === plantingId) {
            return { ...p, status: nextStatus };
          }
          return p;
        }));
        showToast(`작기 상태가 [${nextStatus === 'COMPLETED' ? '출하완료' : (nextStatus === 'READY' ? '출하임박 D-5' : '생육중')}]로 변경되었습니다.`);
      };

      // 고유 주문 식별 코드 (ref) 생성 함수: REF-YYMMDD-XXXX (예: REF-261015-8A2F)
      const generateNewRefCode = () => {
        const d = new Date();
        const yy = String(d.getFullYear()).slice(-2);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const chars = '0123456789ABCDEF';
        let rand = '';
        for (let i = 0; i < 4; i++) {
          rand += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return `REF-${yy}${mm}${dd}-${rand}`;
      };

      // 농가 주문 링크 고유 식별자 상태 (로드 시 1회 자동 발급)
      const [currentRefCode, setCurrentRefCode] = useState(generateNewRefCode);

      // 전용 주문 링크 URL 생성 헬퍼 (farmCode와 고유 ref 포함)
      const getFarmOrderUrl = (refCode = currentRefCode) => {
        const curCode = currentMerchant?.merchantCode || currentMerchant?.code || currentMerchant?.farmCode || 'FARM-2026-224';
        const origin = window.location.origin || '';
        let basePath = window.location.pathname || '';
        if (basePath.endsWith('farm.html')) {
          basePath = basePath.replace('farm.html', 'order.html');
        } else {
          basePath = 'order.html';
        }
        return `${origin}${basePath}?farm=${encodeURIComponent(curCode)}&ref=${encodeURIComponent(refCode)}`;
      };

      // 원터치 링크 복사 헬퍼 (복사 후 다음 고객을 위해 새 ref 자동 발급)
      const copyOrderLink = () => {
        const urlToCopy = getFarmOrderUrl(currentRefCode);
        const copiedRef = currentRefCode;
        const nextRef = generateNewRefCode();

        const doSuccess = () => {
          showToast(`📋 고객 식별코드 [${copiedRef}] 전용 링크가 복사되었습니다! (다음 링크 자동 생성됨)`);
          setCurrentRefCode(nextRef);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(urlToCopy).then(doSuccess).catch(() => {
            prompt('아래 전용 주문 링크를 복사하여 고객에게 전송하세요:', urlToCopy);
            setCurrentRefCode(nextRef);
          });
        } else {
          prompt('아래 전용 주문 링크를 복사하여 고객에게 전송하세요:', urlToCopy);
          setCurrentRefCode(nextRef);
        }
      };

      // 문자/카톡 전송용 전체 홍보문구 복사 헬퍼 (고유 ref 링크 삽입 및 다음 링크 자동 갱신)
      const copyFullShareText = () => {
        const urlToCopy = getFarmOrderUrl(currentRefCode);
        const farmName = currentMerchant?.farmName || '태안 사과농장';
        const copiedRef = currentRefCode;
        const nextRef = generateNewRefCode();

        const shareText = `[${farmName} 산지직송 직거래 간편주문]
신선하고 맛있는 꿀사과를 밭에서 바로 수확해 보내드립니다.
아래 전용 링크를 누르시면 로그인 없이 바로 간편 주문이 가능합니다.
▶ 전용 주문서: ${urlToCopy}`;

        const doSuccess = () => {
          showToast(`💬 고객 식별코드 [${copiedRef}] 카톡/문자 안내 문구가 복사되었습니다!`);
          setCurrentRefCode(nextRef);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareText).then(doSuccess).catch(() => {
            prompt('아래 안내 문구를 복사하여 고객에게 전송하세요:', shareText);
            setCurrentRefCode(nextRef);
          });
        } else {
          prompt('아래 안내 문구를 복사하여 고객에게 전송하세요:', shareText);
          setCurrentRefCode(nextRef);
        }
      };

      // 농가 직접 CS 답변 등록 핸들러
      const handleSaveFarmCsReply = (e) => {
        e.preventDefault();
        if (!farmCsReplyModal.item || !farmCsReplyModal.reply.trim()) return;
        const targetId = farmCsReplyModal.item.id;
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hour = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const dateStr = `${year}-${month}-${day} ${hour}:${min}`;

        setCsInquiries(prev => prev.map(item => {
          if (item.id === targetId) {
            return {
              ...item,
              reply: farmCsReplyModal.reply.trim(),
              response: farmCsReplyModal.reply.trim(),
              status: '처리완료',
              answeredAt: dateStr,
              resolvedAt: dateStr
            };
          }
          return item;
        }));
        setFarmCsReplyModal({ isOpen: false, item: null, reply: '' });
        showToast('고객 문의에 대한 농가 답변이 저장되었습니다.');
      };

      // 결제 완료 여부 판별 함수 (신규 paymentStatus 및 구 스키마 호환)
      const isPaid = (o) => {
        if (!o) return false;
        if (o.paymentStatus === '입금완료') return true;
        if (o.paymentStatus === '미입금') return false;
        if (o.status && typeof o.status === 'object') {
          return o.status.payment === 'PAID';
        }
        return o.status === 'PAID' || o.paid === true;
      };

      // 개별 운송장 번호 등록 및 수정 저장 (저장 즉시 배송중 자동 전환)
      const handleSaveFarmInvoice = (orderId) => {
        const inputState = farmInvoiceInputs[orderId] || {};
        const courier = inputState.courier || 'CJ대한통운';
        const num = (inputState.num || '').trim();

        if (!num) {
          alert('송장번호를 입력해주세요.');
          return;
        }

        const cleanNum = num.replace(/[^0-9]/g, '');
        if (cleanNum.length < 8) {
          alert('유효한 운송장 번호(숫자 8자리 이상)를 입력해주세요.');
          return;
        }

        setOrders(prev => {
          const next = prev.map(o => {
            const oId = o.orderId || o.id;
            if (oId === orderId) {
              return {
                ...o,
                tracking: num,
                invoiceNum: num,
                invoiceNumber: num,
                carrier: courier,
                courier: courier,
                shippingStatus: '배송중',
                status: {
                  ...(typeof o.status === 'object' ? o.status : {}),
                  staging: 'INVOICE_ISSUED',
                  shipping: 'SHIPPED'
                }
              };
            }
            return o;
          });

          try {
            const shipments = JSON.parse(localStorage.getItem('ooms_shipments') || '{}');
            shipments[orderId] = {
              orderId,
              tracking: num,
              status: 'SHIPPED',
              carrier: courier,
              issuedAt: new Date().toISOString()
            };
            localStorage.setItem('ooms_shipments', JSON.stringify(shipments));
          } catch (err) {}

          return next;
        });

        // 인라인 입력 상태 수정 모드 해제
        setFarmInvoiceInputs(prev => ({
          ...prev,
          [orderId]: { ...prev[orderId], isEditing: false }
        }));

        showToast(`[${courier}] 송장(${num}) 등록 완료 ➔ 배송중 자동 전환`);
      };

      // 농가 배송완료 확정 처리 (정산 대상으로 전환)
      const handleCompleteFarmDelivery = (orderId) => {
        const targetOrder = orders.find(o => (o.orderId === orderId || o.id === orderId));
        const currentTracking = targetOrder?.tracking || targetOrder?.invoiceNum || targetOrder?.invoiceNumber;
        if (!currentTracking) {
          alert('운송장(송장) 번호가 등록되지 않은 주문은 배송완료 처리할 수 없습니다.');
          return;
        }

        if (!confirm(`주문 [${orderId}]을 [배송완료] 처리하시겠습니까?\n정산 대상으로 등록됩니다.`)) {
          return;
        }

        setOrders(prev => prev.map(o => {
          const oId = o.orderId || o.id;
          if (oId === orderId) {
            return {
              ...o,
              shippingStatus: '배송완료',
              status: {
                ...(typeof o.status === 'object' ? o.status : {}),
                shipping: 'DELIVERED'
              }
            };
          }
          return o;
        }));

        try {
          const shipments = JSON.parse(localStorage.getItem('ooms_shipments') || '{}');
          if (shipments[orderId]) {
            shipments[orderId].status = 'DELIVERED';
            shipments[orderId].deliveredAt = new Date().toISOString();

      // 3. [🚚 택배사 송장] 엑셀 일괄 매칭 파싱 (SheetJS 기반)
      const handleCourierExcelUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setCourierInvoiceModal(prev => ({ ...prev, bulkFile: file, matchResults: [] }));

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            let rows = [];
            if (window.XLSX && typeof window.XLSX.read === 'function') {
              const data = new Uint8Array(event.target.result);
              const workbook = window.XLSX.read(data, { type: 'array', cellDates: true });
              const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
              rows = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
            } else {
              const text = event.target.result;
              rows = text.split(/\r\n|\n/).filter(Boolean).map(l => l.split(','));
            }

            if (!rows || rows.length === 0) {
              alert('파일에 데이터가 없습니다.');
              return;
            }

            let headerIdx = -1;
            let colMap = { invoice: -1, receiver: -1, phone: -1, orderId: -1 };

            for (let r = 0; r < Math.min(rows.length, 5); r++) {
              const rowStr = rows[r].map(c => String(c || '').trim());
              const hasInvoice = rowStr.some(c => /운송장|송장|등기|tracking|invoice/i.test(c));
              const hasReceiver = rowStr.some(c => /수령인|받는\s*분|성명|이름|고객명|receiver/i.test(c));
              if (hasInvoice || hasReceiver) {
                headerIdx = r;
                rowStr.forEach((colName, cIdx) => {
                  if (/운송장|송장|등기|tracking|invoice/i.test(colName) && colMap.invoice === -1) colMap.invoice = cIdx;
                  else if (/주문번호|주문ID|주문코드|orderid|orderno/i.test(colName) && colMap.orderId === -1) colMap.orderId = cIdx;
                  else if (/수령인|받는\s*분|성명|이름|고객명|receiver/i.test(colName) && colMap.receiver === -1) colMap.receiver = cIdx;
                  else if (/전화|연락처|휴대폰|핸드폰|tel|phone/i.test(colName) && colMap.phone === -1) colMap.phone = cIdx;
                });
                break;
              }
            }

            if (headerIdx === -1) {
              colMap = { invoice: 0, receiver: 1, phone: 2, orderId: 3 };
            } else {
              if (colMap.invoice === -1) colMap.invoice = 0;
              if (colMap.receiver === -1) colMap.receiver = 1;
            }

            const startRow = headerIdx !== -1 ? headerIdx + 1 : 0;
            const results = [];

            for (let i = startRow; i < rows.length; i++) {
              const row = rows[i];
              if (!row || row.length === 0) continue;

              const invRaw = colMap.invoice !== -1 ? String(row[colMap.invoice] || '').trim().replace(/[^0-9]/g, '') : '';
              const recRaw = colMap.receiver !== -1 ? String(row[colMap.receiver] || '').trim() : '';
              const phoneRaw = colMap.phone !== -1 ? String(row[colMap.phone] || '').trim().replace(/[^0-9]/g, '') : '';
              const orderIdRaw = colMap.orderId !== -1 ? String(row[colMap.orderId] || '').trim() : '';

              if (!invRaw && !recRaw && !orderIdRaw) continue;

              let matched = null;
              if (orderIdRaw) {
                matched = myFarmOrders.find(o => (o.orderId === orderIdRaw || o.id === orderIdRaw));

              if (!matched && recRaw) {
                matched = myFarmOrders.find(o => {
                  const oRec = o.receiverName || o.receiver?.name || o.senderName || '';
                  const oPhone = (o.receiverPhone || o.receiver?.tel || o.senderPhone || '').replace(/[^0-9]/g, '');
                  const nameMatch = oRec.includes(recRaw) || recRaw.includes(oRec);
                  if (phoneRaw && phoneRaw.length >= 4 && oPhone.length >= 4) {
                    return nameMatch && (oPhone.endsWith(phoneRaw.slice(-4)) || phoneRaw.endsWith(oPhone.slice(-4)));
                  }
                  return nameMatch;
                });
              }

              if (matched && invRaw.length >= 8) {
                results.push({
                  rowNo: i + 1,
                  receiver: recRaw || matched.receiverName || matched.senderName,
                  phone: phoneRaw,
                  extractedInvoice: invRaw,
                  matchedOrder: matched,
                  status: 'SUCCESS',
                  reason: '주문 매칭 완료'
                });
              } else {
                results.push({
                  rowNo: i + 1,
                  receiver: recRaw || '미확인',
                  phone: phoneRaw,
                  extractedInvoice: invRaw,
                  matchedOrder: null,
                  status: 'FAILED',

                });
              }

            setCourierInvoiceModal(prev => ({ ...prev, matchResults: results }));
            showToast(`📊 송장 엑셀 분석 완료: 성공 ${results.filter(r => r.status === 'SUCCESS').length}건, 실패 ${results.filter(r => r.status === 'FAILED').length}건`);
          } catch (err) {
            console.error('송장 엑셀 파싱 에러:', err);

      const handleSaveDirectInvoices = () => {
        const inputs = courierInvoiceModal.directInputs || {};
        const filledEntries = Object.entries(inputs).filter(([id, val]) => val && val.trim().length >= 8);
        if (filledEntries.length === 0) {

              ...o,

              invoiceNum: num,

              carrier: curCourier,
              courier: curCourier,
              shippingStatus: '배송중',
              status: {
                ...(typeof o.status === 'object' ? o.status : {}),
                staging: 'INVOICE_ISSUED',

              }

    class ErrorBoundary extends React.Component {

      }

      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: '40px 20px', textAlign: 'center', fontFamily: 'sans-serif', color: '#334155', maxWidth: '420px', margin: '0 auto' }}>

                </a>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function initApp() {
      const rootElem = document.getElementById('farm-root');
      if (rootElem) {
        try {
          ReactDOM.createRoot(rootElem).render(
            <ErrorBoundary>
              <FarmPortalApp />

          console.error('React 마운트 오류:', err);

            <div style="padding: 32px 20px; text-align: center; font-family: sans-serif; color: #334155; max-width: 420px; margin: 0 auto;">

              </div>
            </div>
          `;
        }
      }

  <script>
    // 전역 휴대전화 번호 실시간 자동 하이픈 및 최대 13자 제한 포매팅 (동적 렌더링 입력창 완벽 지원)
    document.addEventListener('input', function(e) {
      var target = e.target;
      if (!target || target.tagName !== 'INPUT') return;
      var type = target.getAttribute('type') || '';
      var id = target.id || '';
      var name = target.name || '';
      var placeholder = target.placeholder || '';

      var isPhone = type === 'tel' ||
                    /phone|tel/i.test(id) ||
                    /phone|tel/i.test(name) ||
                    /010|전화|연락처|휴대폰/i.test(placeholder);

      if (isPhone) {
        target.setAttribute('maxlength', '13');
        var val = target.value.replace(/[^0-9]/g, '');
        if (val.length > 11) val = val.slice(0, 11);

        if (val.length >= 11) {
          target.value = val.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
        } else if (val.length >= 7) {
          target.value = val.replace(/(\d{3})(\d{3,4})(\d+)/, '$1-$2-$3');
        } else if (val.length >= 4) {
          target.value = val.replace(/(\d{3})(\d+)/, '$1-$2');
        } else {
          target.value = val;
        }
      }
    }, true);
  </script>
