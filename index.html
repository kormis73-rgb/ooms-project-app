<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OOMS - 산지직송 비정형 주문 관리 & 농가 관리 플랫폼</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            farm: {
              50: '#f2f9f1',
              100: '#e1f3e0',
              500: '#34a853',
              600: '#2e9647',
              700: '#257838',
              900: '#154420',
            },
            harvest: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            },
            kakao: {
              yellow: '#FEE500',
              label: '#191919',
              bg: '#BACEE0',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 초기 농가 마스터 데이터
    const INITIAL_MERCHANTS = [
      {
        id: 'm-1',
        merchantCode: 'FARM-2026-001',
        farmName: '청송 하늘아래 꿀사과 농원',
        repName: '김만석',
        phone: '010-3849-1234',
        address: '경상북도 청송군 주왕산면 당마루길 45',
        postOfficeNum: '1092837465',
        status: 'APPROVED', // APPROVED, PENDING
        signupType: '간편가입(카카오)',
        createdAt: '2026-10-01',
        products: [
          {
            id: 'p-1',
            category: '사과',
            name: '2026 가을 햇 부사 꿀사과',
            variety: '부사(후지)',
            spec: '5kg(14~16과 특품)',
            originPrice: 48000,
            salePrice: 42000,
            desc: '청송 주왕산 해발 400m 당도 15.5 Brix 보증'
          },
          {
            id: 'p-2',
            category: '사과',
            name: '청송 시나노골드 황금사과',
            variety: '시나노골드',
            spec: '3kg(9~11과)',
            originPrice: 40000,
            salePrice: 35000,
            desc: '새콤달콤 황금빛 프리미엄 과육'
          }
        ]
      },
      {
        id: 'm-2',
        merchantCode: 'FARM-2026-002',
        farmName: '나주 금천 배사랑 과수원',
        repName: '박순자',
        phone: '010-9182-7364',
        address: '전라남도 나주시 금천면 영산포로 102',
        postOfficeNum: '1084729104',
        status: 'APPROVED',
        signupType: '일반가입',
        createdAt: '2026-10-03',
        products: [
          {
            id: 'p-3',
            category: '배',
            name: '나주 명품 신고배 선물세트',
            variety: '신고',
            spec: '7.5kg(7~9과 대과)',
            originPrice: 65000,
            salePrice: 58000,
            desc: '풍부한 과즙과 시원한 단맛의 제수용 대과'
          }
        ]
      }
    ];

    function MainApp() {
      // URL 쿼리 파라미터 확인 (?tab=staging 감지 시 관리자 센터 자동 활성화)
      const urlParams = new URLSearchParams(window.location.search);
      const isStagingParam = urlParams.get('tab') === 'staging';

      const [currentView, setCurrentView] = useState(isStagingParam ? 'ADMIN_CENTER' : 'MERCHANT_SIGNUP'); // MERCHANT_SIGNUP, ADMIN_CENTER
      
      // localStorage 영구 저장소 연동 (새로고침해도 보존)
      const [merchants, setMerchantsState] = useState(() => {
        try {
          const saved = localStorage.getItem('OOMS_MERCHANTS_DATA');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error('localStorage load error:', e);
        }
        return INITIAL_MERCHANTS;
      });

      // 농가 목록 변경 시 localStorage 자동 동기화
      const setMerchants = (updater) => {
        setMerchantsState(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          try {
            localStorage.setItem('OOMS_MERCHANTS_DATA', JSON.stringify(next));
          } catch (e) {
            console.error('localStorage save error:', e);
          }
          return next;
        });
      };

      const [activeMerchant, setActiveMerchant] = useState(() => merchants[0] || INITIAL_MERCHANTS[0]);

      // 로그인된 농가 세션 상태 (localStorage 연동)
      const [loggedInMerchant, setLoggedInMerchant] = useState(() => {
        try {
          const saved = localStorage.getItem('OOMS_LOGGED_IN_MERCHANT');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return null;
      });

      // 테스트 데이터 초기화 함수
      const handleResetMerchants = () => {
        if (confirm('등록된 농가 목록을 초기 샘플 데이터로 리셋하시겠습니까?')) {
          setMerchants(INITIAL_MERCHANTS);
          setActiveMerchant(INITIAL_MERCHANTS[0]);
          setLoggedInMerchant(null);
          localStorage.removeItem('OOMS_LOGGED_IN_MERCHANT');
          alert('농가 회원 목록이 초기화되었습니다.');
        }
      };

      // 농가 로그아웃 함수
      const handleLogout = () => {
        localStorage.removeItem('OOMS_LOGGED_IN_MERCHANT');
        setLoggedInMerchant(null);
        alert('로그아웃되었습니다.');
      };

      // 새 창으로 farm.html (농가 한손 모바일 포털) 열기 함수
      const openFarmPortalPage = (merchant = null) => {
        const target = merchant || loggedInMerchant || activeMerchant;
        if (target) {
          localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(target));
          setLoggedInMerchant(target);
        }
        window.open('farm.html', '_blank', 'noopener,noreferrer');
      };

      // 새 창으로 order.html 열기 함수
      const openCustomerOrderPage = () => {
        window.open('order.html', '_blank', 'noopener,noreferrer');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* 상단 글로벌 헤더 */}
          <header className="bg-slate-900 border-b border-slate-800 text-white px-4 py-3 sticky top-0 z-50 shadow-md">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <span className="text-2xl">🍏</span>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-black text-base text-farm-500 tracking-tight">OOMS</span>
                    <span className="text-[11px] bg-slate-800 border border-slate-700 text-emerald-400 px-2 py-0.5 rounded-full font-bold">
                      통합 플랫폼 매니저
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400">
                    농가 로그인 & 회원가입 • 관리자 스테이징 센터 • PWA 주문
                  </p>
                </div>
              </div>

              {/* 탭 네비게이션 & 새 창 열기 액션 버튼들 */}
              <div className="flex flex-wrap items-center gap-2">
                {/* 1 & 2 메인 뷰 전환 탭 */}
                <div className="flex bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs font-bold">
                  <button
                    onClick={() => setCurrentView('MERCHANT_SIGNUP')}
                    className={`px-3 py-1.5 rounded-lg transition-all ${currentView === 'MERCHANT_SIGNUP' ? 'bg-farm-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    1. 농가 로그인 & 회원가입
                  </button>
                  <button
                    onClick={() => setCurrentView('ADMIN_CENTER')}
                    className={`px-3 py-1.5 rounded-lg transition-all ${currentView === 'ADMIN_CENTER' ? 'bg-farm-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}
                  >
                    2. 관리자 통합 제어 센터 ({merchants.length})
                  </button>
                </div>

                {/* 로그인 상태 표시 (요청에 따라 index.html 내 로그아웃 버튼 제거, farm.html에 유지) */}
                {loggedInMerchant ? (
                  <div className="flex items-center gap-1.5 bg-slate-800 border border-farm-500/40 px-2.5 py-1.5 rounded-xl text-xs">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span className="text-emerald-300 font-extrabold max-w-[150px] truncate">
                      {loggedInMerchant.farmName} ({loggedInMerchant.repName})
                    </span>
                  </div>
                ) : null}

                {/* [신규 분리] 농가 모바일(farm.html) 새 창 열기 버튼 */}
                <button
                  onClick={() => openFarmPortalPage()}
                  className="bg-farm-600 hover:bg-farm-700 active:scale-95 text-white text-xs font-black px-3 py-2 rounded-xl shadow-md shadow-farm-600/30 transition-all flex items-center gap-1"
                  title="농가 현장 전용 모바일 포털(farm.html)을 새 창에서 엽니다"
                >
                  <span>🚜 농가 모바일</span>
                  <span className="text-[10px] bg-white/20 px-1 py-0.5 rounded">새 창 ↗</span>
                </button>

                {/* 고객 주문 폼(order.html) 새 창 띄우기 버튼 */}
                <button
                  onClick={openCustomerOrderPage}
                  className="bg-harvest-500 hover:bg-harvest-600 active:scale-95 text-white text-xs font-black px-3 py-2 rounded-xl shadow-md shadow-harvest-500/30 transition-all flex items-center gap-1"
                  title="고객이 주문하는 모바일 웹/PWA(order.html)를 새 창에서 엽니다"
                >
                  <span>📱 고객 주문 폼</span>
                  <span className="text-[10px] bg-white/20 px-1 py-0.5 rounded">새 창 ↗</span>
                </button>
              </div>
            </div>
          </header>

          {/* 메인 뷰 */}
          <main className="flex-1 py-4">
            {currentView === 'MERCHANT_SIGNUP' && (
              <MerchantSignupAndProductView
                merchants={merchants}
                setMerchants={setMerchants}
                activeMerchant={activeMerchant}
                setActiveMerchant={setActiveMerchant}
                loggedInMerchant={loggedInMerchant}
                setLoggedInMerchant={setLoggedInMerchant}
                onLogout={handleLogout}
                onOpenFarmPortal={openFarmPortalPage}
                onGoToAdmin={() => setCurrentView('ADMIN_CENTER')}
              />
            )}
            {currentView === 'ADMIN_CENTER' && (
              <AdminCenterView
                merchants={merchants}
                setMerchants={setMerchants}
                onResetMerchants={handleResetMerchants}
              />
            )}
          </main>

          <footer className="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
            OOMS Unstructured Order Management System • Antigravity Enterprise Architecture Pack
          </footer>
        </div>
      );
    }

    // =========================================================================
    // [탭 1] 농가 로그인 & 회원가입 뷰
    // =========================================================================
    function MerchantSignupAndProductView({
      merchants,
      setMerchants,
      activeMerchant,
      setActiveMerchant,
      loggedInMerchant,
      setLoggedInMerchant,
      onLogout,
      onOpenFarmPortal,
      onGoToAdmin
    }) {
      const [authMode, setAuthMode] = useState('LOGIN'); // LOGIN(로그인), SIGNUP(회원가입)
      const [step, setStep] = useState('SIGNUP'); // SIGNUP -> PROFILE_AND_PRODUCT -> SUCCESS
      const [signupMethod, setSignupMethod] = useState('ID_PW'); // ID_PW, EASY_KAKAO
      
      // 로그인 폼 상태
      const [loginForm, setLoginForm] = useState({
        loginId: '',
        password: ''
      });
      const [loginError, setLoginError] = useState('');

      // 신규 회원가입 폼 상태
      const [authForm, setAuthForm] = useState({
        username: '',
        password: '',
        passwordConfirm: ''
      });

      // 농가 기본 인적사항 상태 (가입 후 자동생성 코드 포함)
      const [farmCode, setFarmCode] = useState(`FARM-2026-${Math.floor(100 + Math.random() * 900)}`);
      const [profileForm, setProfileForm] = useState({
        farmName: '',
        repName: '',
        phone: '',
        address: '',
        postOfficeNum: '10' + Math.floor(10000000 + Math.random() * 90000000)
      });

      // 상품 등록 입력 폼 기본 상태
      const initialProductForm = {
        category: '사과',
        productName: '',
        variety: '',
        spec: '', // 예: 7kg(2~3수)
        originPrice: '',
        salePrice: '',
        desc: ''
      };
      const [productForm, setProductForm] = useState(initialProductForm);

      // 다중 상품 목록 상태 (여러 개 상품 등록 지원)
      const [productsList, setProductsList] = useState([]);

      // 상품 목록에 추가 핸들러
      const handleAddProductToList = () => {
        if (!productForm.productName.trim()) {
          alert('상품명을 입력해주세요.');
          return;
        }
        if (!productForm.variety.trim()) {
          alert('품목/품종을 입력해주세요.');
          return;
        }
        if (!productForm.spec.trim()) {
          alert('규격을 입력해주세요. (예: 5kg(14~16과), 7kg(2~3수))');
          return;
        }
        if (!productForm.salePrice || Number(productForm.salePrice) <= 0) {
          alert('직거래 할인가를 올바르게 입력해주세요.');
          return;
        }

        const newProd = {
          id: `p-${Date.now()}-${Math.floor(100 + Math.random() * 900)}`,
          category: productForm.category,
          name: productForm.productName.trim(),
          variety: productForm.variety.trim(),
          spec: productForm.spec.trim(),
          originPrice: Number(productForm.originPrice) || Number(productForm.salePrice),
          salePrice: Number(productForm.salePrice),
          desc: productForm.desc.trim() || '산지에서 직접 재배한 신선한 농산물'
        };

        setProductsList(prev => [...prev, newProd]);
        // 폼 초기화 (카테고리는 유지)
        setProductForm(prev => ({
          ...initialProductForm,
          category: prev.category
        }));
        alert(`[${newProd.name}] 상품이 목록에 추가되었습니다! (현재 총 ${productsList.length + 1}개)\n계속해서 다른 상품을 추가하시거나 아래 '농가 등록 신청 완료' 버튼을 누르세요.`);
      };

      // 상품 목록에서 특정 상품 삭제 핸들러
      const handleRemoveProductFromList = (prodId) => {
        setProductsList(prev => prev.filter(p => p.id !== prodId));
      };

      // 1. 기존 농가 로그인 처리
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');

        const query = loginForm.loginId.trim();
        const found = merchants.find(m => 
          m.merchantCode.toLowerCase() === query.toLowerCase() ||
          m.repName === query ||
          m.farmName.includes(query) ||
          m.phone.replace(/[^0-9]/g, '').includes(query.replace(/[^0-9]/g, ''))
        );

        if (found) {
          setActiveMerchant(found);
          setLoggedInMerchant(found);
          localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(found));
          alert(`[${found.farmName}] ${found.repName} 대표님, 환영합니다!\n로그인 후 농가 모바일 포털(farm.html)을 새 창에서 엽니다.`);
          onOpenFarmPortal(found);
        } else {
          setLoginError('등록된 농가 정보(농가코드, 성명 또는 전화번호)를 찾을 수 없습니다. 테스트용 빠른 로그인을 이용하시거나 회원가입을 진행해주세요.');
        }
      };

      // 빠른 데모 농가 로그인 선택
      const handleQuickDemoLogin = (merchant) => {
        setActiveMerchant(merchant);
        setLoggedInMerchant(merchant);
        localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(merchant));
        alert(`[${merchant.farmName}] ${merchant.repName} 대표님 계정으로 로그인되었습니다.\n농가 포털(farm.html)을 엽니다.`);
        onOpenFarmPortal(merchant);
      };

      // 2. 신규 회원가입 제출 (아이디/패스워드 또는 간편가입)
      const handleAuthSubmit = (e) => {
        e.preventDefault();
        if (signupMethod === 'ID_PW') {
          if (!authForm.username || !authForm.password) {
            alert('아이디와 비밀번호를 입력해주세요.');
            return;
          }
          if (authForm.password !== authForm.passwordConfirm) {
            alert('비밀번호가 일치하지 않습니다.');
            return;
          }
        }
        setStep('PROFILE_AND_PRODUCT');
      };

      // 카카오 간편 로그인/가입
      const handleEasyKakao = (isLogin = false) => {
        if (isLogin) {
          const defaultKakaoMerchant = merchants[0];
          setActiveMerchant(defaultKakaoMerchant);
          setLoggedInMerchant(defaultKakaoMerchant);
          localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(defaultKakaoMerchant));
          alert(`카카오 계정으로 간편 로그인이 완료되었습니다!\n(${defaultKakaoMerchant.farmName})`);
          onOpenFarmPortal(defaultKakaoMerchant);
        } else {
          setSignupMethod('EASY_KAKAO');
          setAuthForm({ username: 'kakao_farmer', password: '***', passwordConfirm: '***' });
          setProfileForm({
            farmName: '문경 백두대간 사과농원',
            repName: '이성철',
            phone: '010-4412-8877',
            address: '경상북도 문경시 문경읍 문경서중길 21',
            postOfficeNum: '1077482910'
          });
          setStep('PROFILE_AND_PRODUCT');
        }
      };

      // 3. 농가 정보 및 상품 최종 등록 완료
      const handleCompleteRegistration = (e) => {
        e.preventDefault();
        if (!profileForm.farmName || !profileForm.repName || !profileForm.phone) {
          alert('농장명, 대표자 성명, 연락처는 필수입니다.');
          return;
        }

        // 현재 폼에 입력 중인 상품이 작성되어 있다면 목록에 자동 추가
        let finalProducts = [...productsList];
        if (productForm.productName.trim() && productForm.salePrice) {
          finalProducts.push({
            id: `p-${Date.now()}-${Math.floor(100 + Math.random() * 900)}`,
            category: productForm.category,
            name: productForm.productName.trim(),
            variety: productForm.variety.trim() || '대표 품종',
            spec: productForm.spec.trim() || '7kg(2~3수)',
            originPrice: Number(productForm.originPrice) || Number(productForm.salePrice),
            salePrice: Number(productForm.salePrice),
            desc: productForm.desc.trim() || '산지에서 직접 재배한 신선한 농산물'
          });
        }

        // 상품이 하나도 등록되지 않은 경우 경고
        if (finalProducts.length === 0) {
          alert('농가에 등록할 상품을 최소 1개 이상 입력해주세요.');
          return;
        }

        const newMerchant = {
          id: `m-${Date.now()}`,
          merchantCode: farmCode,

        setMerchants(prev => prev.map(m => {
          if (m.id === id) {
            const nextStatus = m.status === 'APPROVED' ? 'PENDING' : 'APPROVED';
            return { ...m, status: nextStatus };
          }
          return m;
        }));
      };

      // 농가 삭제 함수
      const deleteMerchant = (id, farmName) => {
        if (confirm(`'${farmName}' 농가를 회원 목록에서 삭제하시겠습니까?`)) {
          setMerchants(prev => prev.filter(m => m.id !== id));

      };

      // 스테이징 주문 상태 (localStorage 'ooms_orders' 영구 통합 연동)
      const [stagingOrders, setStagingOrdersState] = useState(() => {
        try {
          const saved = localStorage.getItem('ooms_orders') || localStorage.getItem('ooms_staging_orders');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {
          console.error('localStorage load error:', e);
        }
        try {
          localStorage.setItem('ooms_orders', JSON.stringify(DEFAULT_ORDERS_MASTER));
        } catch (e) {}
        return DEFAULT_ORDERS_MASTER;
      });

      // 스테이징 주문 변경 시 localStorage 동기화 헬퍼
      const setStagingOrders = (updater) => {
        setStagingOrdersState(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          try {
            localStorage.setItem('ooms_orders', JSON.stringify(next));
            localStorage.setItem('ooms_staging_orders', JSON.stringify(next));
          } catch (e) {
            console.error('localStorage save error:', e);
          }
          return next;
        });
      };

      // 타 탭/창에서 신규 주문 발생 시 실시간 자동 리렌더링
      useEffect(() => {
        const handleStorageChange = (e) => {
          if ((e.key === 'ooms_orders' || e.key === 'ooms_staging_orders') && e.newValue) {
            try {
              const updated = JSON.parse(e.newValue);
              if (Array.isArray(updated)) setStagingOrdersState(updated);

        window.addEventListener('storage', handleStorageChange);

                        <th className="p-3">농장명 / 상호</th>
                        <th className="p-3">대표자 / 연락처</th>
                        <th className="p-3">농장 주소</th>
                        <th className="p-3">우체국고객번호</th>
                        <th className="p-3">등록상품</th>
                        <th className="p-3">가입일</th>
                        <th className="p-3 text-center">승인상태</th>
                        <th className="p-3 text-right">관리</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 font-medium">
                      {filteredMerchants.length === 0 ? (
                        <tr>
                          <td colSpan="9" className="p-6 text-center text-slate-400">
                            검색된 농가 회원이 없습니다.
                          </td>
                        </tr>
                      ) : (
                        filteredMerchants.map((m, idx) => (
                          <tr key={m.id} className="hover:bg-slate-50/80 transition-colors">
                            <td className="p-3 font-mono font-bold text-slate-700">
                              <div className="flex items-center gap-1">
                                {idx === 0 && m.status === 'PENDING' && (
                                  <span className="bg-amber-500 text-white text-[9px] px-1 py-0.2 rounded font-black">NEW</span>
                                )}
                                <span>{m.merchantCode}</span>
                              </div>
                            </td>
                            <td className="p-3">
                              <span className="font-extrabold text-slate-900">{m.farmName}</span>
                              <span className="text-[10px] text-slate-400 block">{m.signupType}</span>
                            </td>
                            <td className="p-3">
                              <span className="font-bold text-slate-800">{m.repName}</span>
                              <span className="text-slate-500 block text-[11px]">{m.phone}</span>
                            </td>
                            <td className="p-3 text-slate-600 max-w-xs truncate" title={m.address}>
                              {m.address}
                            </td>
                            <td className="p-3 font-mono text-farm-700 font-bold">
                              {m.postOfficeNum}
                            </td>
                            <td className="p-3">
                              <span className="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full font-bold text-[11px]">
                                {m.products?.length || 0}개 상품
                              </span>
                            </td>
                            <td className="p-3 text-slate-400 text-[11px]">
                              {m.createdAt}
                            </td>
                            <td className="p-3 text-center">
                              <span className={`inline-block px-2 py-1 rounded-full text-[10px] font-black ${m.status === 'APPROVED' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800 animate-pulse'}`}>
                                {m.status === 'APPROVED' ? '✓ 승인완료' : '⏳ 심사대기'}
                              </span>
                            </td>
                            <td className="p-3 text-right">
                              <div className="flex items-center justify-end gap-1.5">
                                <button
                                  onClick={() => toggleMerchantStatus(m.id)}
                                  className={`px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all ${m.status === 'APPROVED' ? 'bg-slate-200 text-slate-700 hover:bg-slate-300' : 'bg-emerald-600 hover:bg-emerald-700 text-white'}`}
                                >
                                  {m.status === 'APPROVED' ? '승인취소' : '승인'}
                                </button>
                                <button
                                  onClick={() => deleteMerchant(m.id, m.farmName)}
                                  className="px-2 py-1.5 rounded-lg text-xs text-rose-500 hover:bg-rose-50 font-bold transition-all"
                                  title="농가 삭제"
                                >
                                  🗑
                                </button>
                              </div>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* 하단: 농가별 등록 상품 상세 카드 아코디언 */}
              <div className="space-y-3">
                <h4 className="text-xs font-black text-slate-500 uppercase tracking-wider">
                  📦 농가별 등록 상품 상세 내역
                </h4>
                {filteredMerchants.map((m) => (
                  <div key={m.id} className="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-100">
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-xs text-slate-800">{m.farmName}</span>
                        <span className="font-mono text-[10px] text-slate-400">({m.merchantCode})</span>
                      </div>
                      <span className="text-xs text-farm-600 font-bold">대표자: {m.repName}</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 mt-3">
                      {m.products?.map((p, pIdx) => (
                        <div key={pIdx} className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs">
                          <div className="flex justify-between items-start">
                            <span className="font-bold text-slate-900">{p.name}</span>
                            <span className="font-mono font-black text-harvest-600">{p.salePrice?.toLocaleString()}원</span>
                          </div>
                          <p className="text-slate-500 text-[11px] mt-0.5">품목: {p.variety} | 규격: <b className="text-slate-700">{p.spec}</b></p>
                          <p className="text-slate-400 text-[10px] mt-0.5 truncate">{p.desc}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 서브탭 2: 비정형 주문 스테이징 제어 탭 (Split-View & 신호등) */}
          {adminSubTab === 'STAGING_APPROVAL' && (
            <div className="space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="text-sm font-extrabold text-slate-800">
                  비정형 원문 AI 정제 검증 및 우체국 송장 발급
                </h3>
              </div>

              {stagingOrders.length === 0 ? (
                <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-400 text-xs">
                  현재 접수된 비정형 주문이 없습니다.
                </div>
              ) : (
                stagingOrders.map(order => {
                  const isGreen = (order.confidence && order.confidence.includes('GREEN')) || (order.level === 'GREEN');
                  const isYellow = (order.confidence && order.confidence.includes('YELLOW')) || (order.level === 'YELLOW');
                  const borderColor = isGreen ? 'border-emerald-200 hover:border-emerald-300' : (isYellow ? 'border-amber-200 hover:border-amber-300' : 'border-rose-200 hover:border-rose-300');
                  const scoreBadgeColor = isGreen ? 'bg-emerald-100 text-emerald-800' : (isYellow ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800');

                  const isPending = (order.status?.staging === 'PENDING') || (order.status === 'STAGING_PENDING');
                  const isApproved = (order.status?.staging === 'APPROVED') || (order.status === 'STAGING_APPROVED');
                  const isIssued = (order.status?.staging === 'INVOICE_ISSUED') || (order.status === 'INVOICE_ISSUED');

                  const ordererName = order.orderer?.name || order.orderer || '고객';
                  const ordererTel = order.orderer?.tel || order.ordererPhone || '';
                  const receiverName = order.receiver?.name || order.receiver || '수령인';
                  const receiverTel = order.receiver?.tel || order.phone || '';
                  const roadAddr = order.address?.road || order.refined_road_address || order.address || '';
                  const detailAddr = order.address?.detail || order.refined_detail_address || '';
                  const zipCode = order.address?.zip || order.zip || '';
                  const productName = order.product?.name ? `${order.product.name} (${order.product.qty || 1}박스)` : (order.product || '농산물');
                  const orderAmount = Number(order.product?.price) || Number(order.amount) || 0;
                  const confidenceText = order.confidence || `${Math.round((order.score || 0.96) * 100)}% (${order.level || 'GREEN'})`;
                  const isPwa = order.channel === 'PWA' || order.source === 'PWA';

                  return (
                    <div key={order.id} className={`bg-white rounded-2xl border-2 ${borderColor} p-4 shadow-sm hover:shadow-md transition-all`}>
                      <div className="flex flex-wrap items-center justify-between pb-2 border-b border-slate-100 text-xs mb-3 gap-2">
                        <div className="flex items-center gap-2">
                          <span className="font-mono font-black text-slate-600 bg-slate-100 px-2 py-0.5 rounded">
                            {order.id}
                          </span>
                          {isPwa ? (
                            <span className="bg-harvest-100 text-harvest-800 font-extrabold px-2 py-0.5 rounded text-[11px] flex items-center gap-1">
                              <span>📱</span> PWA 고객직거래
                            </span>
                          ) : (
                            <span className="bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-bold">
                              {order.channel || order.source || 'SMS'}
                            </span>
                          )}
                          <span className={`font-extrabold px-2 py-0.5 rounded-full text-[11px] ${scoreBadgeColor}`}>
                            신뢰도 {confidenceText}
                          </span>
                          {isPending && (
                            <span className="text-[10px] bg-amber-500 text-white font-black px-1.5 py-0.2 rounded animate-pulse">
                              승인대기
                            </span>
                          )}
                        </div>

                        <div className="flex items-center gap-2">
                          {isPending && (
                            <button
                              onClick={() => handleApprove(order.id)}
                              className="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs transition-all shadow-xs flex items-center gap-1"
                            >
                              <span>✓ 1-클릭 승인</span>
                            </button>
                          )}
                          {isApproved && (
                            <button
                              onClick={() => handleIssuePostOfficeInvoice(order.id)}
                              className="bg-harvest-500 hover:bg-harvest-600 active:scale-95 text-white font-extrabold px-3 py-1.5 rounded-xl text-xs transition-all shadow-xs flex items-center gap-1"
                            >
                              <span>📦 우체국 등기송장 발급</span>
                            </button>
                          )}
                          {isIssued && (
                            <span className="font-mono text-purple-700 bg-purple-50 border border-purple-200 px-2.5 py-1 rounded-lg font-black text-xs flex items-center gap-1">
                              <span>🚚 우체국 송장:</span>
                              <span>{order.tracking}</span>
                            </span>
                          )}
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 flex flex-col justify-between">
                          <div>
                            <div className="flex items-center justify-between mb-1">
                              <p className="text-[10px] font-bold text-slate-400">인입 비정형 원문</p>
                              {ordererName && (
                                <span className="text-[10px] text-slate-500">
                                  주문자: <b>{ordererName}</b> ({ordererTel || '연락처'})
                                </span>
                              )}
                            </div>
                            <p className="font-mono text-slate-700 leading-relaxed bg-white p-2 rounded-lg border border-slate-200/60">
                              {order.rawText}
                            </p>
                          </div>
                          {orderAmount > 0 && (
                            <p className="text-[11px] text-slate-400 mt-2 text-right">
                              결제예정: <b className="text-slate-700 font-mono">{orderAmount.toLocaleString()}원</b>
                            </p>
                          )}
                        </div>

                        <div className="bg-farm-50/50 p-3 rounded-xl border border-farm-100 flex flex-col justify-between">
                          <div>
                            <p className="text-[10px] font-bold text-farm-700 mb-1">🏛 행안부 정제 주소 & 상품 정보</p>
                            <p className="font-extrabold text-slate-900 text-sm">
                              {receiverName} <span className="font-normal text-xs text-slate-500">({receiverTel})</span>
                            </p>
                            <p className="text-slate-700 mt-1 font-medium leading-snug">
                              {roadAddr} {detailAddr} <span className="font-mono text-farm-700 font-bold ml-1">[{zipCode}]</span>
                            </p>
                          </div>
                          <div className="mt-2 pt-2 border-t border-farm-200/50 flex items-center justify-between">
                            <span className="text-harvest-600 font-extrabold">{productName}</span>
                            <span className="text-[11px] font-bold text-slate-400">
                              우체국 계약택배 연동
                            </span>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
