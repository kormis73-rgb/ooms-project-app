          sessionStorage.setItem('ooms_admin_session', JSON.stringify(adminSession));

        return { success: true, session: adminSession };

    // =========================================================================
    // 메인 Hub 최상위 컴포넌트
    // =========================================================================
    function HubApp() {
      // [세션 초기화] 초기 로드 시 기본 상태는 항상 비로그인(세션 없음) 유지
      // 기존 로컬스토리지에 남아있던 테스트/더미 농가 세션('태안 사과농장' 등) 완전 초기화
      try {
        localStorage.removeItem('OOMS_AUTH_SESSION');
        localStorage.removeItem('OOMS_LOGGED_IN_MERCHANT');
        localStorage.removeItem('ooms_current_farm');
      } catch (e) {}

      // 인증 세션 상태 (초기 로드 시 항상 null, 사용자가 직접 로그인 인증 시에만 동적 활성화)
      const [authSession, setAuthSession] = useState(null);
      const [loggedInMerchant, setLoggedInMerchant] = useState(null);

      // 농가 명부 상태
      const [merchants, setMerchants] = useState(() => {
        try {
          const saved = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              // 더미 농가 필터링
              const cleaned = parsed.filter(f => {
                const code = f.merchantCode || f.farmCode || f.code || '';
                const name = f.farmName || '';
                return code !== 'FARM-2026-001' && code !== 'FARM-2026-002' &&
                       !name.includes('청송 하늘아래') && !name.includes('나주 금천 배사랑');
              });
              if (cleaned.length !== parsed.length) {
                try {
                  localStorage.setItem('ooms_farms', JSON.stringify(cleaned));
                  localStorage.setItem('OOMS_MERCHANTS_DATA', JSON.stringify(cleaned));
                } catch(e){}
              }
              return cleaned;
            }
          }
        } catch (e) {}
        return INITIAL_MERCHANTS;
      });

      // 실시간 통계 카운트
      const [stats, setStats] = useState({ orders: 0, farms: 0, shipments: 0 });

      // 모달 상태: 'LOGIN' | 'SIGNUP' | null
      const [authModalMode, setAuthModalMode] = useState(null);

      // 인라인 농업경영체 섹션 탭: 'LOGIN' | 'SIGNUP'
      const [inlineAuthTab, setInlineAuthTab] = useState('LOGIN');

      // 농업경영체 섹션으로 스크롤 이동
      const farmerSectionRef = useRef(null);
      const scrollToFarmerSection = (tab = 'LOGIN') => {
        setInlineAuthTab(tab);
        if (farmerSectionRef.current) {
          farmerSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      // 통계 업데이트
      const updateStats = () => {
        try {
          const ordersRaw = localStorage.getItem('ooms_orders') || localStorage.getItem('ooms_staging_orders');
          const orders = ordersRaw ? JSON.parse(ordersRaw) : [];
          const farmsRaw = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
          const farms = farmsRaw ? JSON.parse(farmsRaw) : INITIAL_MERCHANTS;
          const shipmentsRaw = localStorage.getItem('ooms_shipments');
          let shipCount = 0;
          if (shipmentsRaw) {
            try {
              const parsed = JSON.parse(shipmentsRaw);
              shipCount = Object.keys(parsed).length;
            } catch(e){}
          }
          if (shipCount === 0 && Array.isArray(orders)) {
            shipCount = orders.filter(o => o.tracking).length;
          }
          setStats({
            orders: Array.isArray(orders) ? orders.length : 0,
            farms: Array.isArray(farms) ? farms.length : 0,
            shipments: shipCount
          });
          if (Array.isArray(farms)) setMerchants(farms);
        } catch (e) {}
      };

      useEffect(() => {
        updateStats();
        window.addEventListener('storage', updateStats);
        return () => window.removeEventListener('storage', updateStats);
      }, []);

      // 로그아웃
      const handleLogout = async () => {
        await OOMS_AUTH.signOut();
        setAuthSession(null);
        setLoggedInMerchant(null);
        alert('안전하게 로그아웃되었습니다.');
      };

      // 농가 모바일 포털(farm.html) 새 창(팝업) 열기
      const handleOpenFarmPortal = (merchant = null) => {
        const target = merchant || loggedInMerchant;
        const farmCode = target ? (target.merchantCode || target.farmCode || '') : (merchants && merchants.length > 0 ? merchants[0].merchantCode : '');
        const targetUrl = farmCode ? `farm.html?farm=${encodeURIComponent(farmCode)}` : 'farm.html';
        window.open(targetUrl, '_blank');
      };

      // 관리자 콘솔(back.html) 새 창(팝업) 열기
      const handleOpenAdminConsole = () => {
        window.open('back.html?tab=staging', '_blank');
      };

    // =========================================================================
    // [메인 섹션] 농업경영체 전용 로그인 및 회원가입 모듈 창 (FarmerAuthSection)
    // =========================================================================
    function FarmerAuthSection({
      activeTab,
      setActiveTab,
      merchants,
      setMerchants,
      authSession,
      setAuthSession,
      loggedInMerchant,
      setLoggedInMerchant,
      onOpenFarmPortal,
      onOpenAdminConsole,
      onLogout
    }) {
      const [loginRole, setLoginRole] = useState('FARMER'); // 기본 농업경영체 포커스
      const [loginForm, setLoginForm] = useState({ loginId: '', password: '' });
      const [loginError, setLoginError] = useState('');

      // 가입 프로세스 단계: 'SIGNUP' (방식선택) | 'FARM_PROFILE' (인적사항) | 'PRODUCT_REGISTER' (상품등록) | 'SUCCESS' (완료)
      const [step, setStep] = useState('SIGNUP');
      const [signupMethod, setSignupMethod] = useState('ID_PW');
      const [farmCode, setFarmCode] = useState(`FARM-2026-${Math.floor(100 + Math.random() * 900)}`);

      // 농업경영체 인적 사항 및 계정 상태
      const [profileForm, setProfileForm] = useState({
        loginId: '',
        password: '',
        passwordConfirm: '',
        farmName: '',
        repName: '',
        phone: '',
        zonecode: '',
        address: '',
        addressDetail: '',
        brix: '당도 15.5 Brix 보증',
        postOfficeNum: '10' + Math.floor(10000000 + Math.random() * 90000000)
      });

      // 주소 검색 모달 상태
      const [isAddressModalOpen, setIsAddressModalOpen] = useState(false);
      const [addressSearchQuery, setAddressSearchQuery] = useState('');
      const [addressSearchResults, setAddressSearchResults] = useState([]);
      const [addressSearchPerformed, setAddressSearchPerformed] = useState(false);

      // 아이디 / 패스워드 찾기 모달 상태 및 핸들러
      const [isFindModalOpen, setIsFindModalOpen] = useState(false);
      const [findTab, setFindTab] = useState('FIND_ID'); // 'FIND_ID' | 'FIND_PW'
      const [findIdQuery, setFindIdQuery] = useState('');
      const [findPwQuery, setFindPwQuery] = useState('');
      const [findResult, setFindResult] = useState(null);
      const [verifyStep, setVerifyStep] = useState('INPUT'); // 'INPUT' | 'SENT' | 'VERIFIED'
      const [generatedCode, setGeneratedCode] = useState('');
      const [inputVerifyCode, setInputVerifyCode] = useState('');
      const [resetPwForm, setResetPwForm] = useState({ newPw: '', confirmPw: '' });
      const [targetAccountForPw, setTargetAccountForPw] = useState(null);

      // 아이디 찾기 실행
      const handleExecuteFindId = (e) => {
        if (e) e.preventDefault();
        const q = findIdQuery.trim();
        if (!q) {
          alert('등록된 휴대전화번호 또는 대표자 성명을 입력해주세요.');
          return;
        }

        const cleanDigits = q.replace(/[^0-9]/g, '');
        const matched = merchants.find(m => {
          const mPhoneClean = (m.phone || '').replace(/[^0-9]/g, '');
          return (cleanDigits && mPhoneClean && mPhoneClean === cleanDigits) ||
                 (m.repName && m.repName === q) ||
                 (m.farmName && m.farmName.includes(q));
        });

        if (matched) {
          setFindResult({
            success: true,
            account: matched,
            displayId: matched.loginId || matched.merchantCode
          });
        } else if (q.toLowerCase() === 'kormis' || q === '총괄매니저' || cleanDigits === '01000000000') {
          setFindResult({
            success: true,
            account: { farmName: 'OOMS 플랫폼 운영본부', repName: '총괄관리자' },
            displayId: 'kormis',
            isManager: true
          });
        } else {
          setFindResult({
            success: false,
            message: '입력하신 정보와 일치하는 등록 계정을 찾을 수 없습니다. 등록 시 기재하신 휴대전화번호를 다시 확인해주세요.'
          });
        }
      };

      // 비밀번호 찾기: 인증번호 발송
      const handleRequestVerifyCode = (e) => {
        if (e) e.preventDefault();
        const q = findPwQuery.trim();
        if (!q) {
          alert('등록된 아이디 또는 휴대전화번호를 입력해주세요.');
          return;
        }

        const cleanDigits = q.replace(/[^0-9]/g, '');
        const matched = merchants.find(m => {
          const mPhoneClean = (m.phone || '').replace(/[^0-9]/g, '');
          const mIdMatch = (m.loginId && m.loginId.toLowerCase() === q.toLowerCase()) ||
                           (m.merchantCode && m.merchantCode.toLowerCase() === q.toLowerCase());
          return mIdMatch || (cleanDigits && mPhoneClean && mPhoneClean === cleanDigits);
        });

        const isManager = q.toLowerCase() === 'kormis';

        if (matched || isManager) {
          const target = matched || { id: 'master_001', farmName: 'OOMS 운영본부', repName: '총괄매니저', phone: '010-0000-0000', loginId: 'kormis', isManager: true };
          const mockCode = String(Math.floor(100000 + Math.random() * 900000));
          setGeneratedCode(mockCode);
          setTargetAccountForPw(target);
          setVerifyStep('SENT');
          setInputVerifyCode('');
          alert(`[본인확인 SMS 인증번호 발송]\n\n등록된 연락처(${target.phone || '010-****-1234'})로 인증번호가 발송되었습니다.\n\n▶ 인증번호: [ ${mockCode} ]\n(※ 테스트 편의를 위해 화면에 즉시 안내됩니다.)`);
        } else {
          alert('입력하신 아이디 또는 휴대전화번호와 일치하는 계정을 찾을 수 없습니다.');
        }
      };

      // 비밀번호 찾기: 인증번호 확인
      const handleVerifyCodeSubmit = (e) => {
        if (e) e.preventDefault();
        if (inputVerifyCode.trim() === generatedCode.trim()) {
          setVerifyStep('VERIFIED');
          alert('본인 인증이 성공적으로 완료되었습니다!\n새로운 비밀번호를 입력해주세요.');
        } else {
          alert('인증번호가 일치하지 않습니다. 다시 입력해주세요.');
        }
      };

      // 비밀번호 찾기: 새 비밀번호 재설정 저장
      const handleResetPasswordSubmit = (e) => {
        if (e) e.preventDefault();
        if (!resetPwForm.newPw.trim()) {
          alert('새로운 비밀번호를 입력해주세요.');
          return;
        }
        if (resetPwForm.newPw !== resetPwForm.confirmPw) {
          alert('새 비밀번호와 비밀번호 확인이 일치하지 않습니다.');
          return;
        }

        if (targetAccountForPw && !targetAccountForPw.isManager) {
          const updatedMerchants = merchants.map(m => {
            if (m.id === targetAccountForPw.id) {
              return { ...m, password: resetPwForm.newPw };
            }
            return m;
          });
          setMerchants(updatedMerchants);
          try {
            localStorage.setItem('ooms_farms', JSON.stringify(updatedMerchants));
            localStorage.setItem('OOMS_MERCHANTS_DATA', JSON.stringify(updatedMerchants));
          } catch(err){}
        }

        alert(`[비밀번호 재설정 완료]\n\n비밀번호가 안전하게 변경되었습니다.\n새로운 비밀번호로 로그인해 주세요.`);
        setIsFindModalOpen(false);
        setFindTab('FIND_ID');
        setVerifyStep('INPUT');
        setFindPwQuery('');
        setResetPwForm({ newPw: '', confirmPw: '' });
        setTargetAccountForPw(null);
      };

      // 찾은 아이디로 로그인 폼 자동 기입 및 모달 닫기
      const handleUseFoundIdToLogin = (id) => {
        setLoginForm(prev => ({ ...prev, loginId: id }));
        setIsFindModalOpen(false);
        setFindResult(null);
      };

      // 상품 등록 상태
      const initialProductForm = {
        category: '사과',
        productName: '',
        variety: '',
        spec: '',
        originPrice: '',
        salePrice: '',
        desc: ''
      };
      const [productForm, setProductForm] = useState(initialProductForm);
      const [productsList, setProductsList] = useState([]);

      // 행정안전부 도로명주소 표준 검색 모달 열기
      const handleOpenPostcodeModal = () => {
        setIsAddressModalOpen(true);
        setAddressSearchQuery('');
        setAddressSearchResults([]);
        setAddressSearchPerformed(false);
      };

      // 행정안전부 도로명주소 검색 실행 (표준 API 연동 및 안전 Fallback)
      const handleExecuteAddressSearch = async (queryStr) => {
        const query = (queryStr !== undefined ? queryStr : addressSearchQuery).trim();
        if (!query) {
          alert('검색할 도로명, 지번, 또는 건물명을 입력해주세요.');
          return;
        }

        setAddressSearchPerformed(true);

        // 1차: 행정안전부 도로명주소 Open API 호출 시도 (네트워크 연결 시)
        let remoteResults = [];
        try {
          const confmKey = 'U01TX0FVVEgyMDI2MTAwOTAwMDAwMDE='; // 표준 인증키 파라미터 규격
          const jusoUrl = `https://business.juso.go.kr/addrlink/addrLinkApi.do?currentPage=1&countPerPage=15&keyword=${encodeURIComponent(query)}&confmKey=${confmKey}&resultType=json`;
          const res = await fetch(jusoUrl, { mode: 'cors' });
          if (res.ok) {
            const data = await res.json();
            if (data && data.results && Array.isArray(data.results.juso)) {
              remoteResults = data.results.juso.map(item => ({
                zonecode: item.zipNo || item.zonecode,
                roadAddress: item.roadAddr || item.roadAddress,
                jibunAddress: item.jibunAddr || item.jibunAddress
              }));
            }
          }
        } catch (e) {
          // CORS 또는 오프라인/로컬 환경 시 표준 로컬 DB로 원활히 인계
        }

        if (remoteResults.length > 0) {
          setAddressSearchResults(remoteResults);
          return;
        }

        // 2차: 표준 로컬 주소 테이블 정밀 검색 (오프라인/로컬 환경 대응)
        const lowerQ = query.toLowerCase().replace(/\s+/g, '');
        let matched = STANDARD_ADDRESS_DB.filter(addr => {
          const roadClean = addr.roadAddress.replace(/\s+/g, '').toLowerCase();
          const jibunClean = addr.jibunAddress.replace(/\s+/g, '').toLowerCase();
          return roadClean.includes(lowerQ) || jibunClean.includes(lowerQ);
        });

        // 3차: 키워드 분할 매칭 (예: '소원면 소근리' 검색 시)
        if (matched.length === 0) {
          const tokens = query.split(/\s+/).filter(Boolean).map(t => t.toLowerCase());
          if (tokens.length > 1) {
            matched = STANDARD_ADDRESS_DB.filter(addr => {
              const roadClean = addr.roadAddress.replace(/\s+/g, '').toLowerCase();
              const jibunClean = addr.jibunAddress.replace(/\s+/g, '').toLowerCase();
              return tokens.every(token => roadClean.includes(token) || jibunClean.includes(token));
            });
          }
        }

        // 4차: 미등록 신규 상세 주소 입력 시 지능형 표준 주소 규격 생성 (5자리 구역번호 보장)
        if (matched.length === 0 && (query.includes('로') || query.includes('길') || query.includes('리') || query.includes('동'))) {
          const isFull = query.includes('도') || query.includes('시') || query.includes('군') || query.includes('구');
          const fullRoad = isFull ? query : `충청남도 태안군 소원면 ${query}`;
          matched = [
            {
              zonecode: '32130',
              roadAddress: fullRoad,
              jibunAddress: fullRoad.replace('소근로', '소원면 소근리').replace('로 ', '로 지번 ').replace('길 ', '길 지번 ')
            }
          ];
        }

        setAddressSearchResults(matched);
      };

      const handleSelectAddressItem = (item) => {
        setProfileForm(prev => ({
          ...prev,
          zonecode: item.zonecode,
          address: item.roadAddress
        }));
        setIsAddressModalOpen(false);
        setTimeout(() => {
          const detailElem = document.getElementById('farmer-detail-address');
          if (detailElem) detailElem.focus();
        }, 80);
      };

      // 상품 추가 핸들러
      const handleAddProductToList = () => {
        if (!productForm.productName.trim()) {
          alert('상품명을 입력해주세요.');
          return;
        }
        if (!productForm.variety.trim()) {
          alert('품목/품종을 입력해주세요.');
          return;
        }
        if (!productForm.spec.trim()) {
          alert('규격을 입력해주세요. (예: 5kg(14~16과), 7kg(2~3수))');
          return;
        }
        if (!productForm.salePrice || Number(productForm.salePrice) <= 0) {
          alert('직거래 할인가를 올바르게 입력해주세요.');
          return;
        }

        const newProd = {
          id: `p-${Date.now()}-${Math.floor(100 + Math.random() * 900)}`,
          category: productForm.category,
          name: productForm.productName.trim(),
          variety: productForm.variety.trim(),
          spec: productForm.spec.trim(),
          originPrice: Number(productForm.originPrice) || Number(productForm.salePrice),
          salePrice: Number(productForm.salePrice),
          desc: productForm.desc.trim() || '산지에서 직접 재배한 신선한 농산물'
        };

        setProductsList(prev => [...prev, newProd]);
        setProductForm(prev => ({ ...initialProductForm, category: prev.category }));
        alert(`[${newProd.name}] 상품이 목록에 추가되었습니다! (현재 총 ${productsList.length + 1}개)`);
      };

      const handleRemoveProductFromList = (prodId) => {
        setProductsList(prev => prev.filter(p => p.id !== prodId));
      };

      // 로그인 처리
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        const query = loginForm.loginId.trim();

        if (loginRole === 'MANAGER') {
          if (!query || !loginForm.password) {
            setLoginError('총괄매니저 아이디와 비밀번호를 모두 입력해주세요.');
            return;
          }
          if (query !== 'kormis' || loginForm.password !== '1234') {
            setLoginError('총괄매니저 아이디 또는 비밀번호가 일치하지 않습니다.');
            return;
          }
          await OOMS_AUTH.signInAdmin({
            email: 'admin@ooms.kr',
            password: loginForm.password
          });
          alert(`[총괄매니저] 인증 완료!\n통합관리센터(back.html)를 새 창에서 엽니다.`);
          onOpenAdminConsole();
        } else {
          if (!query || !loginForm.password) {
            setLoginError('아이디, 농가코드, 대표자명 또는 사업자번호와 비밀번호를 입력해주세요.');
            return;
          }

          const cleanQuery = query.replace(/[^0-9]/g, '');
          const found = merchants.find(m => 
            (m.merchantCode && m.merchantCode.toLowerCase() === query.toLowerCase()) ||
            (m.loginId && m.loginId.toLowerCase() === query.toLowerCase()) ||
            (m.bizNum && cleanQuery && m.bizNum.replace(/[^0-9]/g, '') === cleanQuery) ||
            (m.repName && m.repName === query) ||
            (m.farmName && m.farmName === query) ||
            (m.phone && cleanQuery && m.phone.replace(/[^0-9]/g, '') === cleanQuery)
          );

          if (!found) {
            setLoginError('등록되지 않은 농가 정보이거나 비밀번호가 일치하지 않습니다.');
            return;
          }

          const targetPassword = found.password || '1234';
          if (loginForm.password !== targetPassword) {
            setLoginError('비밀번호가 일치하지 않습니다.');
            return;
          }

          await OOMS_AUTH.signInFarmer({
            query: query,
            password: loginForm.password,
            merchant: found
          });
          alert(`[${found.farmName}] ${found.repName} 대표님 환영합니다!\n농가 모바일 포털(farm.html)을 새 창에서 엽니다.`);
          onOpenFarmPortal(found);
        }
      };

      // 카카오 간편 로그인/가입
      const handleEasyKakao = async (isLogin = false) => {
        if (isLogin) {
          const defaultKakaoMerchant = merchants[0];
          await OOMS_AUTH.signInFarmer({
            query: defaultKakaoMerchant.merchantCode,
            password: '',
            merchant: defaultKakaoMerchant
          });
          alert(`카카오 계정으로 간편 로그인이 완료되었습니다!\n(${defaultKakaoMerchant.farmName})`);
          onOpenFarmPortal(defaultKakaoMerchant);
        } else {
          setSignupMethod('EASY_KAKAO');
          setStep('FARM_PROFILE');
        }
      };

      // 빠른 데모 로그인
      const handleQuickDemoLogin = async (merchant) => {
        await OOMS_AUTH.signInFarmer({
          query: merchant.merchantCode,
          password: '',
          merchant: merchant
        });
        alert(`[${merchant.farmName}] ${merchant.repName} 대표님 계정으로 로그인되었습니다.\n농가 포털(farm.html)을 엽니다.`);
        onOpenFarmPortal(merchant);
      };

      // 2단계: 농업경영체 인적 사항 저장 후 상품 등록 이동
      const handleSaveFarmProfile = (e) => {
        if (e) e.preventDefault();
        const currentZonecode = (profileForm.zonecode || '').trim();
        const currentAddress = (profileForm.address || '').trim();
        const currentDetail = (profileForm.addressDetail || '').trim();
        const inputLoginId = (profileForm.loginId || '').trim();
        const inputPassword = (profileForm.password || '').trim();
        const inputPasswordConfirm = (profileForm.passwordConfirm || '').trim();

        if (!inputLoginId) {
          alert('로그인 아이디를 입력해주세요.');
          return;
        }
        if (inputLoginId.length < 4) {
          alert('로그인 아이디는 4자 이상 입력해주세요.');
          return;
        }
        if (!inputPassword) {
          alert('비밀번호를 입력해주세요.');
          return;
        }
        if (inputPassword !== inputPasswordConfirm) {
          alert('비밀번호와 비밀번호 확인이 일치하지 않습니다. 다시 확인해주세요.');
          return;
        }

        if (!profileForm.farmName.trim()) {
          alert('농장명을 입력해주세요.');
          return;
        }
        if (!profileForm.repName.trim()) {
          alert('대표자 성명을 입력해주세요.');
          return;
        }
        if (!profileForm.phone.trim()) {
          alert('연락처(휴대전화)를 입력해주세요.');
          return;
        }
        if (!currentAddress) {
          alert('농장/과수원 주소를 직접 입력하거나 [주소 검색]으로 입력해주세요.');
          return;
        }

        setStep('PRODUCT_REGISTER');
      };

      // 3단계: 최종 회원가입 및 상품 등록 완료
      const handleCompleteRegistration = (e) => {
        e.preventDefault();
        const currentAddress = (profileForm.address || '').trim();
        const currentDetail = (profileForm.addressDetail || '').trim();
        const finalLoginId = (profileForm.loginId || '').trim() || farmCode;
        const finalPassword = (profileForm.password || '').trim() || '1234';

        if (!profileForm.farmName || !profileForm.repName || !profileForm.phone || !currentAddress) {
          alert('농장명, 대표자 성명, 연락처, 농장 주소는 필수입니다.');
          return;
        }

        let finalProducts = [...productsList];
        if (productForm.productName.trim() && productForm.salePrice) {
          finalProducts.push({
            id: `p-${Date.now()}-${Math.floor(100 + Math.random() * 900)}`,
            category: productForm.category,
            name: productForm.productName.trim(),
            variety: productForm.variety.trim() || '대표 품종',
            spec: productForm.spec.trim() || '7kg(2~3수)',
            originPrice: Number(productForm.originPrice) || Number(productForm.salePrice),
            salePrice: Number(productForm.salePrice),
            desc: productForm.desc.trim() || '산지에서 직접 재배한 신선한 농산물'
          });
        }

        if (finalProducts.length === 0) {
          alert('농가에 등록할 상품을 최소 1개 이상 입력해주세요.');
          return;
        }

        const fullAddress = [currentAddress, currentDetail].filter(Boolean).join(' ').trim();

        const newMerchant = {
          id: `m-${Date.now()}`,
          merchantCode: farmCode,
          loginId: finalLoginId,
          password: finalPassword,
          farmName: profileForm.farmName,
          repName: profileForm.repName,
          phone: profileForm.phone,
          address: fullAddress,
          zonecode: profileForm.zonecode || '37432',
          brix: profileForm.brix?.trim() || '당도 15.5 Brix 보증',
          postOfficeNum: profileForm.postOfficeNum || ('10' + Math.floor(10000000 + Math.random() * 90000000)),
          status: 'PENDING',
          signupType: signupMethod === 'EASY_KAKAO' ? '간편가입(카카오)' : '일반가입',
          createdAt: new Date().toISOString().slice(0, 10),
          products: finalProducts
        };

        const updated = [newMerchant, ...merchants];
        setMerchants(updated);
        try {
          localStorage.setItem('ooms_farms', JSON.stringify(updated));
          localStorage.setItem('OOMS_MERCHANTS_DATA', JSON.stringify(updated));
          localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(newMerchant));
          localStorage.setItem('ooms_current_farm', JSON.stringify(newMerchant));
        } catch (err) {}

        setLoggedInMerchant(newMerchant);
        setProductsList(finalProducts);
        setStep('SUCCESS');
      };

      return (
        <div className="bg-slate-900 border-2 border-farm-500/40 rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden backdrop-blur-md">
          {/* 장식용 글로우 배경 */}
          <div className="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 bg-farm-500/10 rounded-full blur-3xl pointer-events-none"></div>

          {/* 섹션 타이틀 및 상단 탭 */}
          <div className="flex flex-col md:flex-row items-start md:items-center justify-between pb-6 border-b border-slate-800 gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-2xl">👨‍🌾</span>
                <h2 className="text-xl md:text-2xl font-black text-white tracking-tight">
                  농업경영체(농가) 전용 창구
                </h2>
                <span className="text-[11px] bg-farm-900 text-emerald-400 border border-farm-500/40 font-bold px-2 py-0.5 rounded-full">
                  산지 판매자
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                농가 대표님은 로그인하여 출하 업무를 보시거나, 간소화된 인적사항 등록으로 즉시 가입하세요.
              </p>
            </div>

            {/* [로그인] vs [회원가입] 상단 대형 탭 스위처 */}
            <div className="flex bg-slate-950 p-1.5 rounded-2xl border border-slate-800 w-full md:w-auto">
              <button
                type="button"
                onClick={() => { setActiveTab('LOGIN'); setStep('SIGNUP'); }}
                className={`flex-1 md:flex-initial px-5 py-2.5 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-2 ${activeTab === 'LOGIN' ? 'bg-farm-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                <span>🔑</span> 농가 로그인
              </button>
              <button
                type="button"
                onClick={() => { setActiveTab('SIGNUP'); setStep('SIGNUP'); }}
                className={`flex-1 md:flex-initial px-5 py-2.5 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-2 ${activeTab === 'SIGNUP' ? 'bg-farm-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
              >
                <span>🌱</span> 농업경영체 회원가입
              </button>
            </div>
          </div>

          {/* ================================================================= */}
          {/* [탭 1] 농업경영체 로그인 창 (단일화 및 집중화된 심플 싱글 칼럼)   */}
          {/* ================================================================= */}
          {activeTab === 'LOGIN' && (
            <div className="pt-6 max-w-md mx-auto">
              <div className="bg-slate-950/80 p-6 sm:p-7 rounded-2xl border border-slate-800 shadow-xl">
                <div className="flex items-center justify-between mb-5 pb-3 border-b border-slate-800/80">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">📱</span>
                    <h3 className="text-sm font-black text-white">농업경영체 계정 로그인</h3>
                  </div>
                  <div className="flex gap-1 text-[11px] bg-slate-900 p-0.5 rounded-lg border border-slate-800">
                    <button
                      type="button"
                      onClick={() => { setLoginRole('FARMER'); setLoginError(''); }}
                      className={`px-3 py-1.5 rounded-lg font-bold transition-all text-xs flex items-center gap-1 cursor-pointer ${loginRole === 'FARMER' ? 'bg-farm-600 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}
                    >
                      <span>🚜</span> 농가(판매자)
                    </button>
                    <button
                      type="button"
                      onClick={() => { setLoginRole('MANAGER'); setLoginError(''); }}
                      className={`px-3 py-1.5 rounded-lg font-bold transition-all text-xs flex items-center gap-1 cursor-pointer ${loginRole === 'MANAGER' ? 'bg-slate-700 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}`}
                    >
                      <span>🛡️</span> 총괄매니저
                    </button>
                  </div>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">
                      {loginRole === 'MANAGER' ? '총괄매니저 아이디' : '아이디'}
                    </label>
                    <input
                      type="text"
                      required
                      value={loginForm.loginId}
                      onChange={(e) => setLoginForm({ ...loginForm, loginId: e.target.value })}
                      placeholder={loginRole === 'MANAGER' ? 'kormis' : '아이디 입력'}
                      className="w-full p-3 text-xs bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-farm-500 focus:outline-none transition-all"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-300 mb-1.5">비밀번호</label>
                    <input
                      type="password"
                      required
                      value={loginForm.password}
                      onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })}
                      placeholder="비밀번호 입력"
                      className="w-full p-3 text-xs bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-farm-500 focus:outline-none transition-all"
                    />
                  </div>

                  {loginError && (
                    <p className="text-xs text-rose-400 bg-rose-950/60 p-2.5 rounded-xl border border-rose-800 leading-relaxed font-medium">
                      ⚠️ {loginError}
                    </p>
                  )}

                  <div className="space-y-2.5 pt-1">
                    <button
                      type="submit"
                      className="w-full bg-farm-600 hover:bg-farm-700 active:scale-98 text-white font-black py-3.5 rounded-xl text-xs transition-all shadow-md shadow-farm-600/30 flex items-center justify-center gap-1.5 cursor-pointer"
                    >
                      <span>{loginRole === 'MANAGER' ? '🛡️ 총괄매니저 로그인 (back.html 새 창 열기) ➔' : '🚜 농가 로그인 (farm.html 새 창 열기) ➔'}</span>
                    </button>
                    <button

                        className="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs transition-all flex items-center justify-center gap-1"
                      >
                        <span>➕ 이 상품 목록에 추가 (다른 규격 계속 등록)</span>
                      </button>
                    </div>

                    <div className="flex gap-2 pt-2 border-t border-slate-800">
                      <button
                        type="button"
                        onClick={() => setStep('FARM_PROFILE')}
                        className="px-4 py-3 rounded-xl text-xs font-bold text-slate-400 bg-slate-900 hover:bg-slate-800"
                      >
                        ← 이전
                      </button>
                      <button
                        type="submit"
                        className="flex-1 bg-farm-600 hover:bg-farm-700 active:scale-98 text-white font-black py-3 rounded-xl text-xs transition-all shadow-md shadow-farm-600/30 flex items-center justify-center gap-1"
                      >
                        <span>✓ 농가 및 상품 최종 등록 완료 ➔</span>
                      </button>
                    </div>
                  </form>
                </div>
              )}

              {/* STEP 4: 등록 완료 모달/안내 */}
              {step === 'SUCCESS' && (
                <div className="max-w-md mx-auto text-center space-y-4 py-6 bg-slate-950/80 p-8 rounded-3xl border border-farm-500/50">
                  <div className="w-16 h-16 bg-farm-900/80 text-emerald-400 border border-farm-500/40 rounded-full flex items-center justify-center mx-auto text-3xl font-black">
                    ✓
                  </div>
                  <h3 className="text-xl font-black text-white">농가 등록이 완료되었습니다!</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    발급된 농가코드 <b className="text-emerald-400">[{farmCode}]</b>로 플랫폼에 등록되었습니다.<br />
                    지금 바로 농가 모바일 포털(farm.html)에서 출하 목록을 확인해 보세요.
                  </p>

                  <div className="space-y-2 pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        const targetId = (profileForm.loginId || '').trim() || farmCode;
                        setLoginForm(prev => ({ ...prev, loginId: targetId, password: '' }));
                        setLoginRole('FARMER');
                        setLoginError('');
                        setActiveTab('LOGIN');
                        setStep('SIGNUP');
                        setTimeout(() => {
                          const pwInput = document.querySelector('input[type="password"]');
                          if (pwInput) pwInput.focus();
                        }, 100);
                      }}
                      className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl text-xs shadow-md shadow-emerald-600/30 transition-all flex items-center justify-center gap-1.5 cursor-pointer"
                    >
                      <span>🔑 [{(profileForm.loginId || '').trim() || farmCode}] 계정으로 즉시 로그인하러 가기 ➔</span>
                    </button>

                    <div className="flex flex-col sm:flex-row gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          const targetMerchant = merchants.find(m => m.merchantCode === farmCode) || { merchantCode: farmCode };
                          onOpenFarmPortal(targetMerchant);
                        }}
                        className="flex-1 bg-farm-700 hover:bg-farm-600 text-white font-black py-3 rounded-xl text-xs shadow-sm transition-all flex items-center justify-center gap-1 cursor-pointer"
                      >
                        <span>🚜 농가 모바일 포털(farm.html) 열기</span>
                      </button>
                      <a
                        href={`order.html?farm=${farmCode}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="flex-1 bg-harvest-600 hover:bg-harvest-700 text-white font-black py-3 rounded-xl text-xs shadow-sm transition-all flex items-center justify-center gap-1 cursor-pointer"
                      >
                        <span>📱 고객 주문창(order.html) 바로가기</span>
                      </a>
                    </div>
                  </div>
                </div>
              )}

            </div>
          )}

          {/* 행정안전부 도로명주소 표준 검색 모달 */}
          {isAddressModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-white text-slate-800 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[80vh]">
                <div className="bg-slate-900 text-white px-4 py-3 flex items-center justify-between">
                  <span className="text-xs font-black flex items-center gap-1.5">
                    <span>🏛️</span> 행정안전부 도로명주소 표준 검색
                  </span>
                  <button type="button" onClick={() => setIsAddressModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="p-3 bg-slate-50 border-b border-slate-200 flex gap-2">
                  <input
                    type="text"
                    value={addressSearchQuery}
                    onChange={(e) => setAddressSearchQuery(e.target.value)}
                    placeholder="예: 환동로, 청송로, 당마루길"
                    className="flex-1 p-2 text-xs border border-slate-300 rounded-lg text-slate-900"
                    onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); handleExecuteAddressSearch(); } }}
                  />
                  <button
                    type="button"
                    onClick={() => handleExecuteAddressSearch()}
                    className="bg-farm-600 hover:bg-farm-700 text-white text-xs font-bold px-3 py-2 rounded-lg"
                  >
                    검색
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto p-4 space-y-2 min-h-[220px]">
                  {/* 1. 검색 전 초기 안내 가이드 (Empty Guide State) */}
                  {!addressSearchPerformed && (
                    <div className="py-5 px-3 text-center flex flex-col items-center justify-center text-slate-500">
                      <div className="w-12 h-12 rounded-2xl bg-slate-100 border border-slate-200 flex items-center justify-center text-2xl mb-3 shadow-inner">
                        📮
                      </div>
                      <p className="text-xs font-black text-slate-800 mb-2">
                        도로명, 건물명, 지번을 입력 후 [검색]을 눌러주세요.
                      </p>
                      <div className="bg-slate-50 border border-slate-200/80 rounded-xl p-3 text-left w-full max-w-sm text-[11px] text-slate-600 space-y-1.5 leading-relaxed">
                        <p className="font-bold text-slate-700 pb-1 border-b border-slate-200 flex items-center gap-1">
                          <span>💡</span> 검색 팁
                        </p>
                        <p>• <b>도로명 + 건물번호</b> (예: <span className="font-mono text-emerald-700 bg-emerald-50 px-1 py-0.5 rounded">환동로 43-12</span>, <span className="font-mono text-emerald-700 bg-emerald-50 px-1 py-0.5 rounded">테헤란로 152</span>)</p>
                        <p>• <b>동/읍/면/리 + 번지</b> (예: <span className="font-mono text-emerald-700 bg-emerald-50 px-1 py-0.5 rounded">동문리 562-1</span>, <span className="font-mono text-emerald-700 bg-emerald-50 px-1 py-0.5 rounded">역삼동 737</span>)</p>
                        <p>• <b>건물명</b> (예: <span className="font-mono text-emerald-700 bg-emerald-50 px-1 py-0.5 rounded">태안군청</span>, <span className="font-mono text-emerald-700 bg-emerald-50 px-1 py-0.5 rounded">강남파이낸스센터</span>)</p>
                      </div>
                    </div>
                  )}

                  {/* 2. 검색 후 결과 없음 안내 */}
                  {addressSearchPerformed && addressSearchResults.length === 0 && (
                    <div className="py-10 text-center text-slate-400">
                      <div className="text-3xl mb-2">🔍</div>
                      <p className="text-xs font-bold text-slate-600">검색 결과가 없습니다.</p>
                      <p className="text-[11px] text-slate-400 mt-1">도로명 또는 지번을 다시 확인해주세요.</p>
                    </div>
                  )}

                  {/* 3. 검색 결과 목록 */}
                  {addressSearchPerformed && addressSearchResults.length > 0 && addressSearchResults.map((item, idx) => (
                    <button
                      key={idx}
                      type="button"
                      onClick={() => handleSelectAddressItem(item)}
                      className="w-full text-left p-3 rounded-xl border border-slate-200 hover:bg-emerald-50/70 hover:border-emerald-400 text-xs flex justify-between items-center transition-all group cursor-pointer"
                    >
                      <div className="space-y-0.5">
                        <div className="flex items-center gap-1.5">
                          <span className="font-mono text-[10px] bg-slate-900 text-white font-bold px-1.5 py-0.5 rounded shadow-2xs">{item.zonecode}</span>
                          <b className="text-slate-900 group-hover:text-emerald-900">{item.roadAddress}</b>
                        </div>
                        <p className="text-[10px] text-slate-500 pl-0.5">{item.jibunAddress}</p>
                      </div>
                      <span className="bg-emerald-100 group-hover:bg-emerald-600 text-emerald-800 group-hover:text-white font-black text-[11px] px-2.5 py-1.5 rounded-lg shrink-0 ml-2 transition-colors">
                        선택
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 아이디 / 패스워드 찾기 전용 모달 */}
          {isFindModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-slate-900 text-slate-100 w-full max-w-md rounded-3xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col">
                
                {/* 헤더 */}
                <div className="px-5 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">🔍</span>
                    <h3 className="text-sm font-black text-white">아이디 / 패스워드 찾기</h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => { setIsFindModalOpen(false); setFindResult(null); }}
                    className="text-slate-400 hover:text-white p-1 rounded-lg transition-colors text-base font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* 탭 스위처: [아이디 찾기] vs [비밀번호 재설정] */}
                <div className="p-3 bg-slate-950/40 border-b border-slate-800">
                  <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                    <button
                      type="button"
                      onClick={() => { setFindTab('FIND_ID'); setFindResult(null); }}
                      className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${findTab === 'FIND_ID' ? 'bg-farm-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'}`}
                    >
                      아이디 찾기
                    </button>
                    <button
                      type="button"
                      onClick={() => { setFindTab('FIND_PW'); setVerifyStep('INPUT'); setGeneratedCode(''); setInputVerifyCode(''); }}
                      className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${findTab === 'FIND_PW' ? 'bg-farm-600 text-white shadow-xs' : 'text-slate-400 hover:text-white'}`}
                    >
                      비밀번호 재설정
                    </button>
                  </div>
                </div>

                {/* 본문 콘텐츠 */}
                <div className="p-5 space-y-4">
                  {/* [탭 1] 아이디 찾기 */}
                  {findTab === 'FIND_ID' && (
                    <div className="space-y-4">
                      <p className="text-xs text-slate-400 leading-relaxed">
                        등록된 <b>대표자 휴대전화번호</b>(또는 대표자 성명)를 입력하시면 계정 아이디를 확인하실 수 있습니다.
                      </p>

                      <form onSubmit={handleExecuteFindId} className="space-y-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-300 mb-1.5">
                            휴대전화번호 또는 대표자 성명
                          </label>
                          <input
                            type="text"
                            required
                            value={findIdQuery}
                            onChange={(e) => setFindIdQuery(e.target.value)}
                            placeholder="예: 010-3849-1234 또는 김만석"
                            className="w-full p-3 text-xs bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-farm-500 focus:outline-none"
                          />
                        </div>

                        <button
                          type="submit"
                          className="w-full bg-farm-600 hover:bg-farm-700 text-white font-black py-3 rounded-xl text-xs transition-all shadow-md shadow-farm-600/30"
                        >
                          아이디 조회하기 ➔
                        </button>
                      </form>

                      {/* 조회 결과 표시 */}
                      {findResult && (
                        <div className={`p-4 rounded-2xl border text-xs leading-relaxed ${findResult.success ? 'bg-emerald-950/60 border-emerald-700 text-slate-200' : 'bg-rose-950/60 border-rose-800 text-rose-300'}`}>
                          {findResult.success ? (
                            <div className="space-y-2">
                              <div className="flex items-center gap-1.5 text-emerald-400 font-bold">
                                <span>✓</span>
                                <span>등록된 계정 정보를 찾았습니다.</span>
                              </div>
                              <div className="bg-slate-900/90 p-3 rounded-xl border border-slate-800 space-y-1">
                                <p className="text-slate-400 text-[11px]">농장명: <b className="text-white">{findResult.account.farmName}</b> ({findResult.account.repName})</p>
                                <p className="text-slate-400 text-[11px]">가입 아이디: <b className="text-emerald-400 text-sm font-mono">{findResult.displayId}</b></p>
                              </div>
                              <button
                                type="button"
                                onClick={() => handleUseFoundIdToLogin(findResult.displayId)}
                                className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2.5 rounded-xl text-xs mt-2 transition-all shadow-sm"
                              >
                                이 아이디로 바로 로그인하기 ➔
                              </button>
                            </div>
                          ) : (
                            <div className="flex items-start gap-1.5">
                              <span className="text-base">⚠️</span>
                              <p>{findResult.message}</p>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}

                  {/* [탭 2] 비밀번호 재설정 */}
                  {findTab === 'FIND_PW' && (
                    <div className="space-y-4">
                      {/* 단계 1: 아이디/휴대전화번호 입력 및 인증번호 발송 */}
                      {verifyStep === 'INPUT' && (
                        <div className="space-y-3">
                          <p className="text-xs text-slate-400 leading-relaxed">
                            등록된 <b>아이디</b> 또는 <b>휴대전화번호</b>를 입력하여 본인인증 번호를 요청해 주세요.
                          </p>
                          <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1.5">
                              아이디 또는 휴대전화번호
                            </label>
                            <input
                              type="text"
                              value={findPwQuery}
                              onChange={(e) => setFindPwQuery(e.target.value)}
                              placeholder="예: apple001 또는 010-3849-1234"
                              className="w-full p-3 text-xs bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-farm-500 focus:outline-none"
                            />
                          </div>
                          <button
                            type="button"
                            onClick={handleRequestVerifyCode}
                            className="w-full bg-farm-600 hover:bg-farm-700 text-white font-black py-3 rounded-xl text-xs transition-all shadow-md shadow-farm-600/30"
                          >
                            본인인증 번호 발송 ➔
                          </button>
                        </div>
                      )}

                      {/* 단계 2: 인증번호 입력 확인 */}
                      {verifyStep === 'SENT' && (
                        <div className="space-y-3">
                          <div className="bg-farm-950/60 border border-farm-700/60 p-3 rounded-xl text-xs text-emerald-300">
                            📱 휴대전화로 발송된 6자리 인증번호를 입력해 주세요.
                            <span className="block text-[11px] text-slate-400 mt-1 font-mono">
                              (테스트 힌트: {generatedCode})
                            </span>
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1.5">
                              인증번호 6자리
                            </label>
                            <div className="flex gap-2">
                              <input
                                type="text"
                                maxLength="6"
                                value={inputVerifyCode}
                                onChange={(e) => setInputVerifyCode(e.target.value)}
                                placeholder="예: 123456"
                                className="flex-1 p-3 text-xs bg-slate-950 border border-slate-700 rounded-xl text-white font-mono tracking-widest text-center text-sm font-bold focus:ring-2 focus:ring-farm-500 focus:outline-none"
                              />
                              <button
                                type="button"
                                onClick={handleVerifyCodeSubmit}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-4 rounded-xl text-xs transition-all"
                              >
                                확인
                              </button>
                            </div>
                          </div>
                          <button
                            type="button"
                            onClick={handleRequestVerifyCode}
                            className="text-[11px] text-slate-400 hover:text-slate-200 underline font-medium block mx-auto pt-1"
                          >
                            인증번호 다시 받기
                          </button>
                        </div>
                      )}

                      {/* 단계 3: 새 비밀번호 설정 */}
                      {verifyStep === 'VERIFIED' && (
                        <form onSubmit={handleResetPasswordSubmit} className="space-y-3">
                          <div className="bg-emerald-950/70 border border-emerald-600/60 p-3 rounded-xl text-xs text-emerald-300 font-bold">
                            ✓ 본인확인이 완료되었습니다. 사용할 새 비밀번호를 입력해 주세요.
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1.5">
                              새 비밀번호
                            </label>
                            <input
                              type="password"
                              required
                              value={resetPwForm.newPw}
                              onChange={(e) => setResetPwForm({ ...resetPwForm, newPw: e.target.value })}
                              placeholder="새 비밀번호 입력"
                              className="w-full p-3 text-xs bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-farm-500 focus:outline-none"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1.5">
                              새 비밀번호 확인
                            </label>
                            <input
                              type="password"
                              required
                              value={resetPwForm.confirmPw}
                              onChange={(e) => setResetPwForm({ ...resetPwForm, confirmPw: e.target.value })}
                              placeholder="비밀번호 다시 입력"
                              className="w-full p-3 text-xs bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-farm-500 focus:outline-none"
                            />
                          </div>
                          <button
                            type="submit"
                            className="w-full bg-farm-600 hover:bg-farm-700 text-white font-black py-3 rounded-xl text-xs transition-all shadow-md shadow-farm-600/30"
                          >
                            비밀번호 변경 완료 ➔
                          </button>
                        </form>
                      )}
                    </div>
                  )}
                </div>

                {/* 하단 닫기 바 */}
                <div className="p-3 bg-slate-950/60 border-t border-slate-800 text-center">
                  <button
                    type="button"
                    onClick={() => { setIsFindModalOpen(false); setFindResult(null); }}
                    className="text-xs text-slate-400 hover:text-white transition-colors"
                  >
                    닫기
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HubApp />);
  </script>
</body>
</html>
