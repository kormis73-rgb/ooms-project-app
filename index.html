  <script>
    window.__KAKAO_CODE__ = (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        return params.get('code') || null;
      } catch (e) {
        return null;
      }
    })();

    // [초기 가로채기] 카카오 로그인 모드(?code=... & auth_mode === 'login') 즉시 포털 직행 처리
    (function checkKakaoLoginRedirectEarly() {
      try {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const authMode = sessionStorage.getItem('kakao_auth_mode');

        if (code && authMode === 'login') {
          sessionStorage.removeItem('kakao_auth_mode');
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname);
          }
          let targetFarmCode = 'FARM-2026-456';
          try {
            const raw = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
            if (raw) {
              const list = JSON.parse(raw);
              const found = list.find(f => 
                f.farmCode === 'FARM-2026-456' || 
                f.merchantCode === 'FARM-2026-456' || 
                f.kakaoId || 
                (f.loginId && f.loginId.startsWith('kakao_')) || 
                f.repName === '조국래' || 
                f.ownerName === '조국래'
              );
              if (found) {
                targetFarmCode = found.farmCode || found.merchantCode || 'FARM-2026-456';
                localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(found));
                localStorage.setItem('ooms_current_farm', JSON.stringify(found));
              }
            }
          } catch (e) {}

          window.location.replace(`farm.html?farm=${encodeURIComponent(targetFarmCode || 'FARM-2026-456')}&role=user`);
        }
      } catch (e) {}
    })();

    if (window.Kakao && !window.Kakao.isInitialized()) {
      window.Kakao.init('dc866b784e9d7a179baebfe4c322c4cd');
    }

    function handleKakaoLogin(mode = 'login') {
      try {
        sessionStorage.setItem('kakao_auth_mode', mode);
      } catch (e) {}

      if (!window.Kakao) {
        alert('카카오 SDK가 아직 로드되지 않았습니다. 잠시 후 다시 시도해 주세요.');
        return;
      }
      if (!Kakao.isInitialized()) {
        Kakao.init('dc866b784e9d7a179baebfe4c322c4cd');
      }

      // SDK 버전에 따른 분기 처리 (v2 지원)
      if (Kakao.Auth && typeof Kakao.Auth.loginWithKakaoAccount === 'function') {
        Kakao.Auth.loginWithKakaoAccount({
          success: fetchKakaoUserInfo,
          fail: function(err) {
            console.error('카카오 로그인 실패:', err);
            alert('카카오 로그인에 실패했습니다: ' + JSON.stringify(err));
          }
        });
      } else if (Kakao.Auth && typeof Kakao.Auth.login === 'function') {
        Kakao.Auth.login({
          success: fetchKakaoUserInfo,
          fail: function(err) {
            console.error('카카오 로그인 실패:', err);
            alert('카카오 로그인에 실패했습니다: ' + JSON.stringify(err));
          }
        });
      } else {
        // authorize 리다이렉트 방식 fallback
        Kakao.Auth.authorize({
          redirectUri: window.location.origin + window.location.pathname
        });
      }
    }

    function fetchKakaoUserInfo(authObj) {
      const authMode = (function() {
        try { return sessionStorage.getItem('kakao_auth_mode'); } catch (e) { return 'login'; }
      })();

      Kakao.API.request({
        url: '/v2/user/me',
        success: function(res) {
          const nickname = res.kakao_account?.profile?.nickname || res.properties?.nickname || '조국래';
          const kakaoId = res.id ? String(res.id) : '';

          if (authMode === 'login') {
            try { sessionStorage.removeItem('kakao_auth_mode'); } catch (e) {}
            let targetFarmCode = 'FARM-2026-456';
            try {
              const raw = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
              if (raw) {
                const list = JSON.parse(raw);
                const found = list.find(f => 
                  (kakaoId && String(f.kakaoId) === kakaoId) || 
                  (f.loginId && f.loginId === 'kakao_' + kakaoId) || 
                  f.farmCode === 'FARM-2026-456' || 
                  f.merchantCode === 'FARM-2026-456' || 
                  f.repName === nickname || f.ownerName === nickname ||
                  f.repName === '조국래' || f.ownerName === '조국래'
                );
                if (found) {
                  targetFarmCode = found.farmCode || found.merchantCode || 'FARM-2026-456';
                  localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(found));
                  localStorage.setItem('ooms_current_farm', JSON.stringify(found));
                }
              }
            } catch (e) {}
            window.location.href = `farm.html?farm=${encodeURIComponent(targetFarmCode || 'FARM-2026-456')}&role=user`;
            return;
          }

          // 회원가입 모드 ('join')
          const nameInput = document.getElementById('farmerOwnerName');
          if (nameInput) {
            nameInput.value = nickname;
            nameInput.dispatchEvent(new Event('input', { bubbles: true }));
          }
          
          window.currentKakaoUser = { id: kakaoId, nickname: nickname };
          
          if (typeof window.onKakaoUserFetched === 'function') {
            window.onKakaoUserFetched(res);
          } else if (typeof goToStep === 'function') {
            goToStep(2);
          }
        },
        fail: function(error) {
          console.error('사용자 정보 조회 실패:', error);
          alert('카카오 사용자 정보를 가져오는 데 실패했습니다.');
        }
      });
    }

    // =========================================================================
    // 메인 Hub 최상위 컴포넌트
    // =========================================================================
    function HubApp() {
      // [세션 초기화] 초기 로드 시 기본 상태는 항상 비로그인(세션 없음) 유지
      // 기존 로컬스토리지에 남아있던 테스트/더미 농가 세션('태안 사과농장' 등) 완전 초기화
      try {
        localStorage.removeItem('OOMS_AUTH_SESSION');
        localStorage.removeItem('OOMS_LOGGED_IN_MERCHANT');
        localStorage.removeItem('ooms_current_farm');
      } catch (e) {}

      // 인증 세션 상태 (농가 로그인 세션 유지 지원)
      const [authSession, setAuthSession] = useState(() => {
        try {
          const raw = sessionStorage.getItem('current_user_farm') || localStorage.getItem('current_user_farm');
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return null;
      });
      const [loggedInMerchant, setLoggedInMerchant] = useState(() => {
        try {
          const raw = sessionStorage.getItem('current_user_farm') || localStorage.getItem('current_user_farm');
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return null;
      });

      // 농가 명부 상태
      const [merchants, setMerchants] = useState(() => {
        try {
          const saved = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) {
              // 더미 농가 필터링
              const cleaned = parsed.filter(f => {
                const code = f.merchantCode || f.farmCode || f.code || '';
                const name = f.farmName || '';
                return code !== 'FARM-2026-001' && code !== 'FARM-2026-002' &&
                       !name.includes('청송 하늘아래') && !name.includes('나주 금천 배사랑');
              });
              if (cleaned.length !== parsed.length) {
                try {
                  localStorage.setItem('ooms_farms', JSON.stringify(cleaned));
                  localStorage.setItem('OOMS_MERCHANTS_DATA', JSON.stringify(cleaned));
                } catch(e){}
              }
              return cleaned;
            }
          }
        } catch (e) {}
        return INITIAL_MERCHANTS;
      });

      // 실시간 통계 카운트
      const [stats, setStats] = useState({ orders: 0, farms: 0, shipments: 0 });

      // 모달 상태: 'LOGIN' | 'SIGNUP' | null
      const [authModalMode, setAuthModalMode] = useState(null);

      // URL의 code 파라미터 및 kakao_auth_mode 감지
      const urlParams = typeof window !== 'undefined' ? new URLSearchParams(window.location.search) : null;
      const kakaoCode = (urlParams && urlParams.get('code')) || window.__KAKAO_CODE__;
      const kakaoAuthMode = (function() {
        try { return sessionStorage.getItem('kakao_auth_mode'); } catch(e){ return null; }
      })();

      const hasKakaoCode = Boolean(kakaoCode);
      const isKakaoLogin = Boolean(kakaoCode && kakaoAuthMode === 'login');
      const isKakaoJoin = Boolean(kakaoCode && kakaoAuthMode !== 'login');
      const tabParam = urlParams ? urlParams.get('tab') : null;
      const viewParam = urlParams ? urlParams.get('view') : null;

      // 인라인 농업경영체 섹션 탭: tab=login 또는 view=farmer일 때 'LOGIN', 카카오 가입일 때 'SIGNUP', 기본 'LOGIN'
      const [inlineAuthTab, setInlineAuthTab] = useState(
        (tabParam === 'login' || viewParam === 'farmer') ? 'LOGIN' : (isKakaoJoin ? 'SIGNUP' : 'LOGIN')
      );

      // 농업경영체 섹션으로 스크롤 이동
      const farmerSectionRef = useRef(null);
      const scrollToFarmerSection = (tab = 'LOGIN') => {
        setInlineAuthTab(tab);
        if (farmerSectionRef.current) {
          farmerSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      // tab=login 또는 view=farmer 파라미터 감지 시 농가 로그인 섹션 자동 활성화 및 세션 격리 복구
      useEffect(() => {
        if ((tabParam === 'login' || viewParam === 'farmer') && farmerSectionRef.current) {
          setInlineAuthTab('LOGIN');
          if (viewParam === 'farmer') {
            setLoggedInMerchant(null);
            if (authSession && authSession.role !== 'admin') {
              setAuthSession(null);
            }
          }
          const timer = setTimeout(() => {
            farmerSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 150);
          return () => clearTimeout(timer);
        }
      }, [tabParam, viewParam]);

      // 카카오 인증 리다이렉트 처리: 로그인 모드 vs 회원가입 모드 분기
      useEffect(() => {
        if (isKakaoLogin) {
          try { sessionStorage.removeItem('kakao_auth_mode'); } catch(e){}
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname);
          }
          let targetFarmCode = 'FARM-2026-456';
          try {
            const raw = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
            if (raw) {
              const list = JSON.parse(raw);
              const found = list.find(f => 
                f.farmCode === 'FARM-2026-456' || 
                f.merchantCode === 'FARM-2026-456' || 
                f.kakaoId || 
                (f.loginId && f.loginId.startsWith('kakao_')) || 
                f.repName === '조국래' || 
                f.ownerName === '조국래'
              );
              if (found) {
                targetFarmCode = found.farmCode || found.merchantCode || 'FARM-2026-456';
                localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(found));
                localStorage.setItem('ooms_current_farm', JSON.stringify(found));
              }
            }
          } catch(e){}
          window.location.replace(`farm.html?farm=${encodeURIComponent(targetFarmCode || 'FARM-2026-456')}&role=user`);
        } else if (isKakaoJoin && farmerSectionRef.current) {
          const timer = setTimeout(() => {
            farmerSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 150);
          return () => clearTimeout(timer);
        }
      }, [isKakaoLogin, isKakaoJoin]);

      // 통계 업데이트
      const updateStats = () => {
        try {
          const ordersRaw = localStorage.getItem('ooms_orders') || localStorage.getItem('ooms_staging_orders');
          const orders = ordersRaw ? JSON.parse(ordersRaw) : [];
          const farmsRaw = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
          const farms = farmsRaw ? JSON.parse(farmsRaw) : INITIAL_MERCHANTS;
          const shipmentsRaw = localStorage.getItem('ooms_shipments');
          let shipCount = 0;
          if (shipmentsRaw) {
            try {
              const parsed = JSON.parse(shipmentsRaw);
              shipCount = Object.keys(parsed).length;
            } catch(e){}
          }
          if (shipCount === 0 && Array.isArray(orders)) {
            shipCount = orders.filter(o => o.tracking).length;
          }
          setStats({
            orders: Array.isArray(orders) ? orders.length : 0,
            farms: Array.isArray(farms) ? farms.length : 0,
            shipments: shipCount
          });
          if (Array.isArray(farms)) setMerchants(farms);
        } catch (e) {}
      };

      useEffect(() => {
        updateStats();
        window.addEventListener('storage', updateStats);
        return () => window.removeEventListener('storage', updateStats);
      }, []);

      // 로그아웃
      const handleLogout = async () => {
        await OOMS_AUTH.signOut();
        setAuthSession(null);
        setLoggedInMerchant(null);
        alert('안전하게 로그아웃되었습니다.');
      };

      // 농가 모바일 포털(farm.html) 새 탭 직접 이동
      const handleOpenFarmPortal = (merchant = null) => {
        const activeMerchant = merchant || loggedInMerchant;
        let farmCode = activeMerchant ? (activeMerchant.farmCode || activeMerchant.merchantCode || activeMerchant.code) : null;
        if (!farmCode) {
          try {
            farmCode = localStorage.getItem('ooms_farm_code') || sessionStorage.getItem('ooms_farm_code');
          } catch (e) {}
        }
        if (!farmCode) farmCode = 'FARM-2026-224';
        const targetFarmUrl = `farm.html?farm=${encodeURIComponent(farmCode)}&role=user`;
        window.open(targetFarmUrl, '_blank');
      };

      // 총괄 운영 관리자 인증 모달 상태
      const [isAdminAuthModalOpen, setIsAdminAuthModalOpen] = useState(false);
      const [adminLoginForm, setAdminLoginForm] = useState({ id: '', password: '' });
      const [adminLoginError, setAdminLoginError] = useState('');

      const handleOpenAdminAuthModal = () => {
        setAdminLoginForm({ id: '', password: '' });
        setAdminLoginError('');
        setIsAdminAuthModalOpen(true);
      };

      const handleCloseAdminAuthModal = () => {
        setAdminLoginForm({ id: '', password: '' });
        setAdminLoginError('');
        setIsAdminAuthModalOpen(false);
      };

      const handleAdminLoginSubmit = async (e) => {
        if (e) e.preventDefault();
        setAdminLoginError('');
        const idInput = (adminLoginForm.id || '').trim();
        const pwInput = (adminLoginForm.password || '').trim();

        if (!idInput || !pwInput) {
          setAdminLoginError('관리자 아이디와 비밀번호를 모두 입력해주세요.');
          setAdminLoginForm(prev => ({ ...prev, password: '' }));
          return;
        }

        // 마스터/관리자 계정 인증 검증 (kormis / 1234)
        if (idInput === 'kormis' && pwInput === '1234') {
          try {
            if (typeof OOMS_AUTH !== 'undefined' && typeof OOMS_AUTH.signInAdmin === 'function') {
              await OOMS_AUTH.signInAdmin({ email: 'kormis', password: '1234' });
            } else {
              const adminSession = {
                access_token: 'sb_admin_token_' + Date.now(),
                user: { id: 'usr_master_001', email: 'admin@ooms.kr', role: 'master', name: '총괄매니저' },
                createdAt: new Date().toISOString()
              };
              localStorage.setItem('ooms_admin_auth', JSON.stringify(adminSession));
              sessionStorage.setItem('ooms_admin_session', JSON.stringify(adminSession));
            }
          } catch (err) {
            console.error('관리자 세션 생성 오류:', err);
          }

          handleCloseAdminAuthModal();
          const targetUrl = 'back.html?tab=staging&demo=true';
          window.open(targetUrl, '_blank');
        } else {
          setAdminLoginError('관리자 인증 정보가 일치하지 않습니다.');
          setAdminLoginForm(prev => ({ ...prev, password: '' }));
          alert('관리자 인증 정보가 일치하지 않습니다.');
        }
      };

      // 관리자 콘솔(back.html) 새 창(팝업) 열기
      const handleOpenAdminConsole = () => {
        window.open('back.html?tab=staging', '_blank');
      };

      return (
        <div className="min-h-screen flex flex-col selection:bg-farm-500 selection:text-white">
          {/* 상단 글로벌 내비게이션 바 */}
          <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
            <div className="max-w-md mx-auto px-4 py-2.5 flex items-center justify-between">
              <div 
                onClick={() => {
                  try {
                    sessionStorage.removeItem('kakao_auth_mode');
                  } catch (e) {}
                  window.location.href = 'index.html';
                }}
                className="flex items-center gap-2 cursor-pointer hover:opacity-80 transition-opacity"
                title="OOMS 홈으로 이동"
              >
                <span className="text-2xl">🍏</span>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-bold text-white text-base">OOMS</span>
                    <span className="text-[11px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1.5 py-0.5 rounded font-mono font-bold">
                      Hub v2.0
                    </span>
                  </div>
                  <p className="text-[10px] text-slate-400">
                    산지직송 비정형 주문 물류 플랫폼
                  </p>
                </div>
              </div>

              {/* 헤더 우측 여백 유지 */}
              <div></div>
            </div>
          </header>

          {/* 메인 히어로 섹션 (모바일 1화면 최적화 컴팩트 패딩) */}
          <main className="flex-1 max-w-md mx-auto w-full px-3 py-2 sm:py-3 flex flex-col justify-center items-center">
            
            {/* 타이틀 & 인트로 헤더 */}
            <div className="text-center w-full max-w-md mx-auto mb-2">
              <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-950/80 border border-emerald-500/30 text-emerald-400 text-[10px] font-bold mb-1">
                <span>🌾</span>
                <span>전국 산지 직거래 물류 자동화 포털</span>
              </div>
              <h1 className="text-xl sm:text-2xl font-black text-white tracking-tight leading-tight">
                농산물 직거래 출하 물류<br />
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-farm-500 to-teal-400">
                  산지 농업경영체 포털
                </span>
              </h1>
              <p className="text-[10.5px] text-slate-400 mt-0.5 leading-snug">
                출하 배정 주문 확인부터 송장 자동 발급까지 원스톱으로 관리하세요.
              </p>

              {/* 실시간 플랫폼 요약 통계 배지 */}
              <div className="mt-1.5 flex flex-wrap items-center justify-center gap-1 text-[10px]">
                <span className="bg-slate-800/80 border border-slate-700 text-slate-300 px-2 py-0.5 rounded-lg flex items-center gap-1">
                  <span>📦</span> 주문: <b className="text-white font-mono font-bold">{stats.orders}건</b>
                </span>
                <span className="bg-slate-800/80 border border-slate-700 text-slate-300 px-2 py-0.5 rounded-lg flex items-center gap-1">
                  <span>👨‍🌾</span> 농가: <b className="text-white font-mono font-bold">{stats.farms}곳</b>
                </span>
                <span className="bg-slate-800/80 border border-slate-700 text-slate-300 px-2 py-0.5 rounded-lg flex items-center gap-1">
                  <span>🚚</span> 송장: <b className="text-white font-mono font-bold">{stats.shipments}건</b>
                </span>
              </div>
            </div>

            {/* ============================================================= */}
            {/* [신규 핵심] 농업경영체 로그인 및 회원가입 전용 메인 섹션 창      */}
            {/* ============================================================= */}
            <div ref={farmerSectionRef} className="w-full max-w-md mx-auto">
              <FarmerAuthSection
                activeTab={inlineAuthTab}
                setActiveTab={setInlineAuthTab}
                merchants={merchants}
                setMerchants={setMerchants}
                authSession={authSession}
                setAuthSession={setAuthSession}
                loggedInMerchant={loggedInMerchant}
                setLoggedInMerchant={setLoggedInMerchant}
                onOpenFarmPortal={handleOpenFarmPortal}
                onOpenAdminConsole={handleOpenAdminConsole}
                onLogout={handleLogout}
              />
            </div>

          </main>

          {/* 그린씨드 공식 푸터 */}
          <footer className="py-2.5 border-t border-slate-800/80 text-center text-xs text-slate-500 space-y-1.5 max-w-md mx-auto w-full px-4">
            {/* 총괄 운영 관리자 인증 모달 진입 버튼 (은은한 회색 텍스트 링크) */}
            <div className="pb-0.5">
              <button
                type="button"
                onClick={handleOpenAdminAuthModal}
                className="inline-flex items-center gap-1 text-[11px] text-slate-500 hover:text-slate-300 transition-colors font-medium hover:underline decoration-slate-700 cursor-pointer"
                title="총괄 운영 관리자 인증"
              >
                <span>⚙️</span>
                <span>총괄 운영 관리자</span>
              </button>
            </div>

            <div className="flex items-center justify-center gap-2 font-medium text-slate-400 text-[10.5px]">
              <span className="text-sm">🌱</span>
              <span>농업회사법인 그린씨드 주식회사</span>
              <span className="text-slate-600">|</span>
              <a href="https://www.greenseed.farm" target="_blank" rel="noopener noreferrer" className="hover:text-emerald-400 transition-colors">www.greenseed.farm</a>
            </div>
            <p className="whitespace-nowrap text-[9.5px]">© 2026 GREEN SEED Co., Ltd. All rights reserved.</p>
          </footer>

          {/* 총괄 운영 관리자 전용 보안 인증 모달 */}
          {isAdminAuthModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div 
                className="bg-slate-900 border border-slate-700/80 rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden p-6 text-slate-100"
                onClick={(e) => e.stopPropagation()}
              >
                {/* 모달 헤더 */}
                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🛡️</span>
                    <div>
                      <h3 className="text-base font-bold text-slate-100">총괄 운영 관리자 전용 인증</h3>
                      <p className="text-[11px] text-slate-400">보안 구역 진입을 위한 관리자 계정을 입력하세요</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={handleCloseAdminAuthModal}
                    className="text-slate-400 hover:text-slate-200 text-lg p-1 rounded-lg hover:bg-slate-800 transition-colors"
                  >
                    ✕
                  </button>
                </div>

                {/* 모달 폼 */}
                <form onSubmit={handleAdminLoginSubmit} className="mt-4 space-y-4">
                  {adminLoginError && (
                    <div className="p-2.5 bg-rose-500/10 border border-rose-500/30 rounded-xl text-rose-400 text-xs font-medium flex items-center gap-2">
                      <span>⚠️</span>
                      <span>{adminLoginError}</span>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      관리자 아이디
                    </label>
                    <input
                      type="text"
                      autoComplete="off"
                      value={adminLoginForm.id}
                      onChange={(e) => setAdminLoginForm(prev => ({ ...prev, id: e.target.value }))}
                      placeholder="관리자 ID 입력 (예: kormis)"
                      className="w-full px-3.5 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
                      autoFocus
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      관리자 비밀번호
                    </label>
                    <input
                      type="password"
                      autoComplete="off"
                      value={adminLoginForm.password}
                      onChange={(e) => setAdminLoginForm(prev => ({ ...prev, password: e.target.value }))}
                      placeholder="비밀번호 입력"
                      className="w-full px-3.5 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
                    />
                  </div>

                  <div className="pt-2 flex items-center gap-2">
                    <button
                      type="button"
                      onClick={handleCloseAdminAuthModal}
                      className="flex-1 py-2.5 px-4 bg-slate-800 hover:bg-slate-750 text-slate-300 text-sm font-medium rounded-xl border border-slate-700 hover:border-slate-600 transition-colors cursor-pointer"
                    >
                      닫기
                    </button>
                    <button
                      type="submit"
                      className="flex-2 py-2.5 px-4 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white text-sm font-semibold rounded-xl shadow-lg shadow-amber-900/30 transition-all cursor-pointer"
                    >
                      관리자 인증 및 콘솔 진입 ↗
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // [메인 섹션] 농업경영체 전용 로그인 및 회원가입 모듈 창 (FarmerAuthSection)
    // =========================================================================
    function FarmerAuthSection({
      activeTab,
      setActiveTab,
      merchants,
      setMerchants,
      authSession,
      setAuthSession,
      loggedInMerchant,
      setLoggedInMerchant,
      onOpenFarmPortal,
      onOpenAdminConsole,
      onLogout
    }) {
      const [loginForm, setLoginForm] = useState({ loginId: '', password: '' });
      const [loginError, setLoginError] = useState('');

      // 접속 중인 농가 세션 감지 (총괄 관리자와 완전 분리)
      const activeFarm = loggedInMerchant || (authSession && authSession.role !== 'admin' ? authSession : null) || (function() {
        try {
          const raw = sessionStorage.getItem('current_user_farm') || localStorage.getItem('current_user_farm');
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return null;
      })();
      const hasActiveSession = Boolean(activeFarm);

      // SCM 파이프라인 출하 대기 및 미입금 실시간 집계
      const farmPipelineStats = (function() {
        if (!activeFarm) return { todayCount: 0, unpaidCount: 0 };
        try {
          const raw = localStorage.getItem('ooms_orders');
          const allOrders = raw ? JSON.parse(raw) : [];
          const curCode = (activeFarm.farmCode || activeFarm.merchantCode || activeFarm.code || 'FARM-2026-224').trim().toLowerCase();
          const curId = (activeFarm.id || '').trim().toLowerCase();
          const curLogin = (activeFarm.loginId || '').trim().toLowerCase();

          const farmOrders = allOrders.filter(o => {
            if (o.farmCode) {
              const oCode = String(o.farmCode).trim().toLowerCase();
              return oCode === curCode || oCode === curId || oCode === curLogin;
            }
            return false;
          });

          const isOrderPaid = (o) => {
            if (!o) return false;
            if (o.paymentStatus === '입금완료') return true;
            if (o.paymentStatus === '미입금') return false;
            if (o.status && typeof o.status === 'object') return o.status.payment === 'PAID';
            return o.status === 'PAID' || o.paid === true;
          };

          const isOrderInvoice = (o) => {
            if (o.tracking || o.invoiceNum || o.invoiceNumber) return true;
            if (o.shippingStatus === '배송중' || o.shippingStatus === '배송완료' || o.shippingStatus === '배송출발') return true;
            if (o.status?.shipping === 'SHIPPED' || o.status?.shipping === 'DELIVERED') return true;
            if (o.status?.staging === 'INVOICE_ISSUED') return true;
            return false;
          };

          const isOrderAddrErr = (o) => {
            const road = (o.address?.road || o.address || '').toString();
            const detail = (o.detailAddress || o.address?.detail || '').toString();
            const full = `${road} ${detail}`;
            return full.includes('확인 요망') || full.includes('주소 오류') || full.includes('상세 주소 확인 요망') || (o.orderId === 'ORD-4602' || o.id === 'ORD-4602');
          };

          const unpaidCount = farmOrders.filter(o => !isOrderPaid(o)).length;
          const todayCount = farmOrders.filter(o => {
            if (!isOrderPaid(o) || isOrderInvoice(o) || isOrderAddrErr(o)) return false;
            const sched = (o.deliverySchedule || o.schedule || '').toString().trim().toUpperCase();
            return sched === 'IMMEDIATE' || sched === 'TODAY' || sched === '' || sched.startsWith('2026-10-18') || sched.startsWith('2026-10-19');
          }).length;

          return { todayCount, unpaidCount };
        } catch (e) {
          return { todayCount: 0, unpaidCount: 0 };
        }
      })();

      // 농가 전용 로그아웃 핸들러 (다른 계정으로 로그인 등)
      const handleSectionLogout = async () => {
        try {
          const farmKeys = [
            'current_farm_user',
            'current_user_farm',
            'ooms_farm_code',
            'ooms_farm_session',
            'ooms_farmer_session',
            'ooms_current_farm',
            'OOMS_LOGGED_IN_MERCHANT',
            'kakao_auth_mode'
          ];
          farmKeys.forEach(k => {
            sessionStorage.removeItem(k);
            localStorage.removeItem(k);
          });
        } catch (e) {}
        if (typeof setLoggedInMerchant === 'function') setLoggedInMerchant(null);
        if (typeof setAuthSession === 'function' && authSession && authSession.role !== 'admin') setAuthSession(null);
        setLoginForm({ loginId: '', password: '' });
        setLoginError('');
      };

      // 페이지 표시(pageshow) 및 재진입 시 농가 세션이 없으면 로그인 폼 완전 초기화
      useEffect(() => {
        const handlePageShow = () => {
          const hasFarm = sessionStorage.getItem('current_user_farm') || localStorage.getItem('current_user_farm');
          if (!hasFarm) {
            setLoginForm({ loginId: '', password: '' });
            setLoginError('');
          }
        };
        window.addEventListener('pageshow', handlePageShow);
        return () => window.removeEventListener('pageshow', handlePageShow);
      }, []);

      // URL 파라미터(?view=farmer 또는 ?tab=login) 진입 시 농가 로그인 폼으로 즉시 세팅
      useEffect(() => {
        const params = typeof window !== 'undefined' ? new URLSearchParams(window.location.search) : null;

      // 아이디 / 패스워드 찾기 모달 상태 및 핸들러

      // 상품 등록 상태
      const initialProductForm = {
        category: '사과',

      };
      const [productForm, setProductForm] = useState(initialProductForm);
      const [productsList, setProductsList] = useState([]);

      // 표준 카카오(Daum) 우편번호 도로명주소 검색 함수
      const openAddressSearch = () => {
        if (typeof daum === 'undefined' || !daum.Postcode) {
          alert('주소 검색 서비스를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
          return;

        new daum.Postcode({
          oncomplete: function(data) {
            // 1. 도로명 주소 또는 지번 주소 선택
            var fullAddr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
            var extraAddr = '';

            // 2. 법정동 및 건물명 참고항목 조합
            if (data.userSelectedType === 'R') {
              if (data.bname !== '' && /[동|로|가]$/g.test(data.bname)) {
                extraAddr += data.bname;
              }
              if (data.buildingName !== '' && data.apartment === 'Y') {
                extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
              }
              if (extraAddr !== '') {
                fullAddr += ' (' + extraAddr + ')';
              }

            // 3. React 상태 및 DOM 인풋 필드 동기화
            setProfileForm(prev => ({
              ...prev,

            if (detailEl) {
              detailEl.focus();

          }
        }).open();
      };

      const openJusoPopup = openAddressSearch;
      window.openAddressSearch = openAddressSearch;

      // 상품 추가 핸들러
      const handleAddProductToList = () => {
        if (!productForm.productName.trim()) {

      };

      const handleRemoveProductFromList = (prodId) => {
        setProductsList(prev => prev.filter(p => p.id !== prodId));
      };

      // 농업경영체 전용 로그인 처리
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        const query = loginForm.loginId.trim();

        if (!query || !loginForm.password) {
          setLoginError('아이디 또는 농가식별코드와 비밀번호를 입력해주세요.');
          setLoginForm(prev => ({ ...prev, password: '' }));
          return;
        }

        const cleanQuery = query.replace(/[^0-9]/g, '');
        const lowerQuery = query.toLowerCase();
        const found = merchants.find(m => 
          (m.farmCode && m.farmCode.toLowerCase() === lowerQuery) ||
          (m.merchantCode && m.merchantCode.toLowerCase() === lowerQuery) ||
          (m.code && m.code.toLowerCase() === lowerQuery) ||
          (m.loginId && m.loginId.toLowerCase() === lowerQuery) ||
          (m.bizNum && cleanQuery && m.bizNum.replace(/[^0-9]/g, '') === cleanQuery) ||
          (m.repName && m.repName === query) ||
          (m.ownerName && m.ownerName === query) ||
          (m.farmName && m.farmName === query) ||
          (m.phone && cleanQuery && m.phone.replace(/[^0-9]/g, '') === cleanQuery)
        );

        if (!found) {
          setLoginError('등록되지 않은 농가 정보이거나 비밀번호가 일치하지 않습니다.');
          setLoginForm(prev => ({ ...prev, password: '' }));

        const targetPassword = found.password || '1234';

          setLoginError('비밀번호가 일치하지 않습니다.');
          setLoginForm(prev => ({ ...prev, password: '' }));
          return;

        await OOMS_AUTH.signInFarmer({
          query: query,

        });
        const actualFarmCode = found.farmCode || found.merchantCode || found.code || 'FARM-2026-224';
        try {
          localStorage.setItem('current_user_farm', JSON.stringify(found));
          sessionStorage.setItem('current_user_farm', JSON.stringify(found));
          localStorage.setItem('ooms_farm_code', actualFarmCode);
          sessionStorage.setItem('ooms_farm_code', actualFarmCode);
        } catch (e) {}

        setLoginForm({ loginId: '', password: '' });
        setLoginError('');
        if (typeof setLoggedInMerchant === 'function') {
          setLoggedInMerchant(found);
        }
        if (typeof setAuthSession === 'function') {
          setAuthSession(found);
        }

        alert(`[${found.farmName}] ${found.repName || found.ownerName || '대표'}님 환영합니다!\n농가 모바일 포털(farm.html)로 바로 이동합니다.`);
        const targetFarmUrl = `farm.html?farm=${encodeURIComponent(actualFarmCode)}&role=user`;
        window.open(targetFarmUrl, '_blank');
      };

      // 카카오 정식 SDK 인증 프로미스 래퍼 (Kakao SDK v2 완벽 호환)
      const requestKakaoAuth = () => {
        return new Promise((resolve, reject) => {
          if (!window.Kakao) {
            alert('카카오 SDK가 아직 로드되지 않았습니다. 잠시 후 다시 시도해 주세요.');
            return reject(new Error('Kakao SDK 라이브러리를 찾을 수 없습니다.'));
          }
          if (!window.Kakao.isInitialized()) {
            window.Kakao.init('dc866b784e9d7a179baebfe4c322c4cd');
          }

          const onAuthSuccess = function(authObj) {
            window.Kakao.API.request({
              url: '/v2/user/me',
              success: function(response) {
                resolve({ authObj, user: response });
              },
              fail: function(error) {
                console.error('사용자 정보 조회 실패:', error);
                reject(error);
              }
            });
          };

          const onAuthFail = function(err) {
            console.error('카카오 로그인 실패:', err);
            reject(err);
          };

          // SDK 팝업 방식(loginForm 또는 login)을 최우선 적용하여 index.html 전체 페이지 리다이렉트 방지
          if (window.Kakao.Auth && typeof window.Kakao.Auth.loginForm === 'function') {
            window.Kakao.Auth.loginForm({
              success: onAuthSuccess,
              fail: onAuthFail
            });
          } else if (window.Kakao.Auth && typeof window.Kakao.Auth.login === 'function') {
            window.Kakao.Auth.login({
              success: onAuthSuccess,
              fail: onAuthFail
            });
          } else if (window.Kakao.Auth && typeof window.Kakao.Auth.loginWithKakaoAccount === 'function') {
            window.Kakao.Auth.loginWithKakaoAccount({
              success: onAuthSuccess,
              fail: onAuthFail
            });
          } else {
            // Kakao.Auth.authorize() 호출 시 브라우저 일반 새 탭(window.open(url, '_blank'))으로 열기
            const kakaoAppKey = 'dc866b784e9d7a179baebfe4c322c4cd';
            const redirectUri = encodeURIComponent(window.location.origin + window.location.pathname);
            const authUrl = `https://kauth.kakao.com/oauth/authorize?client_id=${kakaoAppKey}&redirect_uri=${redirectUri}&response_type=code`;
            const newTab = window.open(authUrl, '_blank');
            if (!newTab || newTab.closed || typeof newTab.closed === 'undefined') {
              reject(new Error('브라우저의 새 탭 차단이 감지되었습니다. 새 탭 허용 후 다시 시도해주세요.'));
            } else {
              newTab.focus();
            }
          }
        });
      };

      // 1단계: 카카오 1초 간편가입 정식 SDK 연동 핸들러
      const handleSelectKakaoSignup = async () => {
        try {
          try {
            sessionStorage.setItem('kakao_auth_mode', 'join');
          } catch (e) {}

          if (!window.Kakao) {
            alert('카카오 SDK를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
            return;
          }

          const { user } = await requestKakaoAuth();
          const kakaoId = user.id ? String(user.id) : '';
          const nickname = user.kakao_account?.profile?.nickname || 
                           user.properties?.nickname || 
                           '카카오 농가';
          const email = user.kakao_account?.email || '';
          const phoneRaw = user.kakao_account?.phone_number || '';
          
          let formattedPhone = '';
          if (phoneRaw) {
            const digits = phoneRaw.replace('+82 ', '0').replace('+82', '0').replace(/[^0-9]/g, '');
            if (digits.length === 11) formattedPhone = digits.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
            else if (digits.length === 10) formattedPhone = digits.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
            else formattedPhone = phoneRaw;
          }

          // 이미 등록된 카카오 농가가 있는지 확인
          const existing = merchants.find(m => 
            (m.kakaoId && String(m.kakaoId) === kakaoId) ||
            (m.loginId && m.loginId === 'kakao_' + kakaoId)
          );
          if (existing) {
            if (confirm(`이미 [${existing.farmName}](${existing.repName || existing.ownerName} 대표님)으로 등록된 카카오 계정입니다.\n\n해당 농가 포털로 바로 로그인하시겠습니까?`)) {
              await OOMS_AUTH.signInFarmer({
                query: existing.merchantCode || existing.farmCode,
                password: existing.password || '1234',
                merchant: existing
              });
              setLoginForm({ loginId: '', password: '' });
              setLoginError('');
              if (typeof setLoggedInMerchant === 'function') setLoggedInMerchant(existing);
              if (typeof setAuthSession === 'function') setAuthSession(existing);
              alert(`[💬 카카오 간편로그인]\n[${existing.farmName}] ${existing.repName || existing.ownerName} 대표님 환영합니다!\n농가 모바일 포털(farm.html)을 새 창에서 엽니다.`);
              onOpenFarmPortal(existing);
              return;
            }
          }

          setCurrentSignupMode('KAKAO');
          setSignupMethod('EASY_KAKAO');
          setProfileForm(prev => ({
            ...prev,
            repName: nickname || prev.repName || '카카오 농가',
            phone: formattedPhone || prev.phone || '',
            loginId: 'kakao_' + (kakaoId || farmCode),
            kakaoId: kakaoId,
            kakaoNickname: nickname,
            kakaoEmail: email,
            password: '1234',
            passwordConfirm: '1234'
          }));

          alert(`[💬 카카오 간편인증 성공!]\n\n• 카카오 닉네임: ${nickname}님\n• 카카오 식별번호: ${kakaoId}\n\n카카오 계정 정보가 자동으로 반영되었습니다.\n2단계 농업경영체 정보 입력으로 이동합니다.`);
          goToStep(2);

        } catch (err) {
          console.error('카카오 간편가입 인증 오류:', err);
          if (err && (err.error === 'access_denied' || err.message?.includes('closed') || err.error_description?.includes('User denied') || err.error === 'window_closed')) {
            alert('카카오 간편가입 인증이 취소되었습니다.');
          } else {
            alert('카카오 간편가입 처리 중 오류가 발생했습니다: ' + (err.error_description || err.message || JSON.stringify(err)));
          }
        }
      };

      // 1단계: 일반 아이디/비밀번호 가입 선택 핸들러
      const handleSelectStandardSignup = () => {
        setCurrentSignupMode('STANDARD');
        setSignupMethod('ID_PW');
        setProfileForm(prev => {
          const isKakaoGen = prev.loginId && prev.loginId.startsWith('kakao_');
          return {
            ...prev,
            loginId: isKakaoGen ? '' : prev.loginId,
            password: isKakaoGen ? '' : prev.password,
            passwordConfirm: isKakaoGen ? '' : prev.passwordConfirm
          };
        });
        goToStep(2);
      };

      // 카카오 정식 SDK 간편로그인 핸들러
      const handleEasyKakao = async (isLogin = true) => {
        try {
          sessionStorage.setItem('kakao_auth_mode', isLogin ? 'login' : 'join');
        } catch (e) {}

        if (!isLogin) {
          handleSelectKakaoSignup();
          return;
        }

        try {
          if (!window.Kakao) {
            alert('카카오 SDK를 불러오는 중입니다. 잠시 후 다시 시도해주세요.');
            return;
          }

          const { user } = await requestKakaoAuth();
          const kakaoId = user.id ? String(user.id) : '';
          const nickname = user.kakao_account?.profile?.nickname || 
                           user.properties?.nickname || 
                           '';

          // 1) kakaoId 매칭 또는 카카오 로그인ID 매칭
          let matched = merchants.find(m => 
            (kakaoId && m.kakaoId && String(m.kakaoId) === kakaoId) ||
            (kakaoId && m.loginId && m.loginId === 'kakao_' + kakaoId) ||
            (nickname && (m.repName === nickname || m.ownerName === nickname)) ||
            (m.repName === '조국래' || m.ownerName === '조국래') ||
            (m.farmCode === 'FARM-2026-456' || m.merchantCode === 'FARM-2026-456')
          );

          // 2) 최근 카카오 가입 농가 캐시 확인
          if (!matched) {
            try {
              const savedLatest = localStorage.getItem('ooms_kakao_latest_farm');
              if (savedLatest) {
                const parsed = JSON.parse(savedLatest);
                matched = merchants.find(m => (m.farmCode === parsed.farmCode || m.merchantCode === parsed.merchantCode)) || parsed;
              }
            } catch(e) {}
          }

          if (!matched) {
            matched = {
              id: 'm-kakao-456',
              farmCode: 'FARM-2026-456',
              merchantCode: 'FARM-2026-456',
              farmName: '청송 꿀사과 농원',
              repName: nickname || '조국래',
              ownerName: nickname || '조국래',
              loginId: 'kakao_456',
              password: '1234',
              status: 'APPROVED'
            };
          }

          const targetFarmCode = matched.farmCode || matched.merchantCode || matched.code || 'FARM-2026-456';

          await OOMS_AUTH.signInFarmer({
            query: targetFarmCode,
            password: matched.password || '1234',
            merchant: matched
          });
          try {
            sessionStorage.removeItem('kakao_auth_mode');
            localStorage.setItem('current_user_farm', JSON.stringify(matched));
            sessionStorage.setItem('current_user_farm', JSON.stringify(matched));
            localStorage.setItem('ooms_farm_code', targetFarmCode);
            sessionStorage.setItem('ooms_farm_code', targetFarmCode);
            localStorage.removeItem('ooms_admin_auth');
            sessionStorage.removeItem('ooms_admin_auth');
          } catch (e) {}

          setLoginForm({ loginId: '', password: '' });
          setLoginError('');
          if (typeof setLoggedInMerchant === 'function') {
            setLoggedInMerchant(matched);
          }
          if (typeof setAuthSession === 'function') {
            setAuthSession(matched);
          }

          alert(`[💬 카카오 간편로그인 완료]\n\n[${matched.farmName}] ${matched.repName || matched.ownerName} 대표님 환영합니다!\n농가 모바일 포털(farm.html)을 새 탭에서 엽니다.`);

          // 브라우저 상단 일반 새 탭으로 열기 (규격 준수: window.open(targetFarmUrl, '_blank') 단 2개 인자만 전달)
          const targetFarmUrl = `farm.html?farm=${encodeURIComponent(targetFarmCode || 'FARM-2026-456')}&role=user`;
          window.open(targetFarmUrl, '_blank');
        } catch (err) {
          console.error('카카오 로그인 에러:', err);
          if (err && (err.error === 'access_denied' || err.message?.includes('closed') || err.error_description?.includes('User denied') || err.error === 'window_closed')) {
            alert('카카오 간편로그인이 취소되었습니다.');
          } else if (err && err.message) {
            alert('카카오 로그인 안내: ' + (err.error_description || err.message));
          }
        }
      };

      // 빠른 데모 로그인
      const handleQuickDemoLogin = async (merchant) => {
        await OOMS_AUTH.signInFarmer({
          query: merchant.merchantCode,
          password: '',
          merchant: merchant
        });
        setLoginForm({ loginId: '', password: '' });
        setLoginError('');
        if (typeof setLoggedInMerchant === 'function') {
          setLoggedInMerchant(merchant);
        }
        if (typeof setAuthSession === 'function') {
          setAuthSession(merchant);
        }
        alert(`[${merchant.farmName}] ${merchant.repName} 대표님 계정으로 로그인되었습니다.\n농가 포털(farm.html)을 엽니다.`);
        onOpenFarmPortal(merchant);
      };

      // 2단계: 농업경영체 인적 사항 저장 후 상품 등록 이동
      const handleSaveFarmProfile = (e) => {
        if (e) e.preventDefault();
        const currentZonecode = (profileForm.zonecode || '').trim();
        const currentAddress = (profileForm.address || '').trim();
        const currentDetail = (profileForm.addressDetail || '').trim();

        if (currentSignupMode === 'STANDARD') {
          const inputLoginId = (profileForm.loginId || '').trim();
          const inputPassword = (profileForm.password || '').trim();
          const inputPasswordConfirm = (profileForm.passwordConfirm || '').trim();

          if (!inputLoginId) {
            alert('로그인 아이디를 입력해주세요.');
            return;
          }
          if (inputLoginId.length < 4) {
            alert('로그인 아이디는 4자 이상 입력해주세요.');
            return;
          }
          if (!inputPassword) {
            alert('비밀번호를 입력해주세요.');
            return;
          }
          if (inputPassword !== inputPasswordConfirm) {
            alert('비밀번호와 비밀번호 확인이 일치하지 않습니다. 다시 확인해주세요.');
            return;
          }
        } else {
          // KAKAO 간편가입 모드일 때: 자동 계정 할당
          if (!profileForm.loginId) {
            profileForm.loginId = 'kakao_' + farmCode;
          }
          if (!profileForm.password) {
            profileForm.password = '1234';
          }
        }

        if (!profileForm.farmName.trim()) {
          alert('농장명을 입력해주세요.');
          return;
        }
        if (!profileForm.repName.trim()) {
          alert('대표자 성명을 입력해주세요.');
          return;
        }
        if (!profileForm.phone.trim()) {
          alert('연락처(휴대전화)를 입력해주세요.');
          return;
        }

        const cleanPhone = (profileForm.phone || '').replace(/[^0-9]/g, '');
        if (!/^01[016789]\d{7,8}$/.test(cleanPhone)) {
          alert('올바른 휴대전화 번호 10~11자리를 입력해주세요.');
          return;
        }

        if (!currentAddress) {
          alert('농장/과수원 주소를 직접 입력하거나 [주소 검색]으로 입력해주세요.');
          return;
        }

        goToStep(3);
      };

      // 3단계: 최종 회원가입 및 상품 등록 완료
      const handleCompleteRegistration = (e) => {
        e.preventDefault();
        const currentAddress = (profileForm.address || '').trim();
        const currentDetail = (profileForm.addressDetail || '').trim();

        const isKakao = currentSignupMode === 'KAKAO';
        const finalLoginType = isKakao ? 'KAKAO' : 'STANDARD';
        const finalLoginId = isKakao
          ? (profileForm.loginId || ('kakao_' + (profileForm.kakaoId || farmCode)))
          : ((profileForm.loginId || '').trim() || farmCode);
        const finalPassword = isKakao
          ? '1234'
          : ((profileForm.password || '').trim() || '1234');

        if (!profileForm.farmName || !profileForm.repName || !profileForm.phone || !currentAddress) {
          alert('농장명, 대표자 성명, 연락처, 농장 주소는 필수입니다.');
          return;
        }

        let finalProducts = [...productsList];
        if (productForm.productName.trim() && productForm.salePrice) {
          finalProducts.push({
            id: `p-${Date.now()}-${Math.floor(100 + Math.random() * 900)}`,
            category: productForm.category,
            name: productForm.productName.trim(),
            variety: productForm.variety.trim() || '대표 품종',
            spec: productForm.spec.trim() || '7kg(2~3수)',
            originPrice: Number(productForm.originPrice) || Number(productForm.salePrice),
            salePrice: Number(productForm.salePrice),
            desc: productForm.desc.trim() || '산지에서 직접 재배한 신선한 농산물'
          });
        }

        if (finalProducts.length === 0) {
          alert('농가에 등록할 상품을 최소 1개 이상 입력해주세요.');
          return;
        }

        const fullAddress = [currentAddress, currentDetail].filter(Boolean).join(' ').trim();

        const newMerchant = {
          id: `m-${Date.now()}`,
          farmCode: farmCode,
          merchantCode: farmCode,
          loginType: finalLoginType,
          loginId: finalLoginId,
          password: finalPassword,
          kakaoId: profileForm.kakaoId || null,
          kakaoNickname: profileForm.kakaoNickname || null,
          farmName: profileForm.farmName,
          repName: profileForm.repName,
          ownerName: profileForm.repName,
          phone: profileForm.phone,
          address: fullAddress,
          zonecode: profileForm.zonecode || '37432',
          brix: profileForm.brix?.trim() || '당도 15.5 Brix 보증',
          postOfficeNum: profileForm.postOfficeNum || ('10' + Math.floor(10000000 + Math.random() * 90000000)),
          status: 'PENDING',
          signupType: isKakao ? '간편가입(카카오)' : '일반가입',
          createdAt: new Date().toISOString().slice(0, 10),
          products: finalProducts
        };

        const updated = [newMerchant, ...merchants];
        setMerchants(updated);
        try {
          localStorage.setItem('ooms_farms', JSON.stringify(updated));
          localStorage.setItem('OOMS_MERCHANTS_DATA', JSON.stringify(updated));
          localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(newMerchant));
          localStorage.setItem('ooms_current_farm', JSON.stringify(newMerchant));
          if (isKakao) {
            localStorage.setItem('ooms_kakao_latest_farm', JSON.stringify(newMerchant));
          }
        } catch (err) {}

        setLoggedInMerchant(newMerchant);
        setProductsList(finalProducts);
        goToStep(4);
      };

      return (
        <div className="bg-slate-900/90 border border-emerald-500/30 rounded-3xl p-4 sm:p-5 shadow-2xl relative overflow-hidden backdrop-blur-xl w-full">
          {/* 은은한 배경 글로우 */}
          <div className="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

          {/* 섹션 상단 헤더 */}
          <div className="flex flex-col items-center text-center pb-3 border-b border-slate-800/80 gap-1.5">
            <div>
              <div className="flex items-center justify-center gap-1.5">
                <span className="text-xl">👨‍🌾</span>
                <h2 className="text-base sm:text-lg font-black text-white tracking-tight">
                  농업경영체 전용 포털
                </h2>
                <span className="text-[10px] bg-emerald-950/90 text-emerald-400 border border-emerald-500/40 font-bold px-2 py-0.5 rounded-full shadow-xs">
                  산지 파트너
                </span>
              </div>
              <p className="text-[11px] text-slate-400 mt-0.5 whitespace-nowrap">
                {hasActiveSession 
                  ? '인증된 농업경영체 세션이 활성화되어 있습니다.'
                  : '로그인하여 출하 업무를 확인하거나 간편 회원가입을 진행하세요.'}
              </p>
            </div>

            {/* 세션이 없을 때만 단정한 알약 형태(Pill Tab)의 [로그인] / [회원가입] 전환 UI 노출 */}
            {!hasActiveSession && (
              <div className="flex bg-slate-950/90 p-1 rounded-2xl border border-slate-800/90 w-full shadow-inner backdrop-blur-md mt-1">
                <button
                  type="button"
                  id="tabLogin"
                  data-tab="login"
                  onClick={() => {
                    try {
                      sessionStorage.removeItem('kakao_auth_mode');
                      if (window.history && window.history.replaceState) {
                        window.history.replaceState({}, document.title, window.location.pathname);
                      }
                    } catch (e) {}
                    setActiveTab('LOGIN');
                    setStep('SIGNUP');
                    setLoginError('');
                  }}
                  className={`flex-1 py-2 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-1.5 cursor-pointer ${activeTab === 'LOGIN' ? 'bg-gradient-to-r from-emerald-600 to-farm-600 text-white shadow-md shadow-emerald-900/40' : 'text-slate-400 hover:text-white'}`}
                >
                  <span>🔑</span> 로그인
                </button>
                <button
                  type="button"
                  id="tabJoin"
                  data-tab="join"
                  onClick={() => {
                    setActiveTab('SIGNUP');
                    if (!isKakaoJoin && step === 'SIGNUP') {
                      setStep('SIGNUP');
                    }
                  }}
                  className={`flex-1 py-2 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-1.5 cursor-pointer ${activeTab === 'SIGNUP' ? 'bg-gradient-to-r from-emerald-600 to-farm-600 text-white shadow-md shadow-emerald-900/40' : 'text-slate-400 hover:text-white'}`}
                >
                  <span>🌱</span> 회원가입
                </button>
              </div>
            )}
          </div>

          {/* ================================================================= */}
          {/* [세션 활성화 시] 스마트 웰컴 패스 슬림 글래스 카드                */}
          {/* ================================================================= */}
          {hasActiveSession && (
            <div id="auth-session-card" className="pt-3 w-full">
              <div className="relative overflow-hidden rounded-2xl bg-gradient-to-b from-slate-950/90 to-slate-900/95 border border-emerald-500/30 p-4 sm:p-5 shadow-2xl backdrop-blur-xl">
                {/* 은은한 배경 글로우 */}
                <div className="absolute top-0 right-0 -mr-12 -mt-12 w-44 h-44 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>

                <div className="relative z-10 flex flex-col items-center text-center gap-3">
                  {/* 상태 배지: 🟢 정상 접속 중 (Active Session) */}
                  <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-500/40 text-emerald-400 text-[11px] font-bold shadow-xs">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>정상 접속 중 (Active Session)</span>
                  </div>

                  {/* 대표 정보: 농장명 · 대표자명 대표님 (볼드 처리) */}
                  <div className="space-y-0.5 my-0.5">
                    <h3 className="text-base sm:text-lg font-black text-white tracking-tight break-keep">
                      <span>{activeFarm?.farmName || '태안 사과농장'}</span>
                      <span className="text-emerald-400 mx-1.5">·</span>
                      <span className="text-slate-100">{activeFarm?.repName || activeFarm?.ownerName || '김혜진'} 대표님</span>
                    </h3>
                    <p className="text-[11px] text-slate-400 font-mono">
                      농가식별코드: <span className="text-emerald-400 font-bold">{activeFarm?.farmCode || activeFarm?.merchantCode || activeFarm?.code || 'FARM-2026-224'}</span>
                    </p>
                  </div>

                  {/* SCM 미니 파이프라인 출하 현황 요약 배너 */}
                  <div className="w-full grid grid-cols-2 gap-2 my-0.5">
                    <div className="bg-rose-950/40 border border-rose-500/30 rounded-xl p-2 text-center shadow-xs">
                      <p className="text-[10px] text-rose-300 font-bold flex items-center justify-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-rose-400 animate-ping"></span>
                        오늘 출하 대기
                      </p>
                      <p className="text-sm font-black text-white mt-0.5 font-mono">
                        {farmPipelineStats.todayCount}건
                      </p>
                    </div>
                    <div className="bg-amber-950/40 border border-amber-500/30 rounded-xl p-2 text-center shadow-xs">
                      <p className="text-[10px] text-amber-300 font-bold">
                        ⏳ 입금 대기
                      </p>

                        {farmPipelineStats.unpaidCount}건
                      </p>
                    </div>
                  </div>

                  {/* 액션 버튼: 프레시 그린 그라데이션 단일 메인 버튼 */}
                  <button
                    type="button"
                    onClick={() => {
                      const code = activeFarm?.farmCode || activeFarm?.merchantCode || activeFarm?.code || 'FARM-2026-224';
                      const targetFarmUrl = `farm.html?farm=${encodeURIComponent(code)}&role=user`;
                      window.open(targetFarmUrl, '_blank');

                    className="w-full mt-1 py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-500 via-farm-500 to-teal-500 hover:from-emerald-400 hover:via-farm-400 hover:to-teal-400 active:scale-98 text-slate-950 font-black text-xs sm:text-sm tracking-wide transition-all shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2 cursor-pointer group"
                    title="내 농가 모바일 포털(farm.html) 새 탭 열기"
                  >

                            type="button"
                            onClick={handleRequestVerifyCode}
                            className="text-[11px] text-slate-400 hover:text-slate-200 underline font-medium block mx-auto pt-1"
                          >
                            인증번호 다시 받기
                          </button>
                        </div>
                      )}

                      {/* 단계 3: 새 비밀번호 설정 */}
                      {verifyStep === 'VERIFIED' && (
                        <form onSubmit={handleResetPasswordSubmit} className="space-y-3">
                          <div className="bg-emerald-950/70 border border-emerald-600/60 p-3 rounded-xl text-xs text-emerald-300 font-bold">
                            ✓ 본인확인이 완료되었습니다. 사용할 새 비밀번호를 입력해 주세요.
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1.5">
                              새 비밀번호
                            </label>
                            <input
                              type="password"
                              required
                              value={resetPwForm.newPw}
                              onChange={(e) => setResetPwForm({ ...resetPwForm, newPw: e.target.value })}
                              placeholder="새 비밀번호 입력"
                              className="w-full p-3 text-xs bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-farm-500 focus:outline-none"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1.5">
                              새 비밀번호 확인
                            </label>
                            <input
                              type="password"
                              required
                              value={resetPwForm.confirmPw}
                              onChange={(e) => setResetPwForm({ ...resetPwForm, confirmPw: e.target.value })}
                              placeholder="비밀번호 다시 입력"
                              className="w-full p-3 text-xs bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-farm-500 focus:outline-none"
                            />
                          </div>
                          <button
                            type="submit"
                            className="w-full bg-farm-600 hover:bg-farm-700 text-white font-black py-3 rounded-xl text-xs transition-all shadow-md shadow-farm-600/30"
                          >
                            비밀번호 변경 완료 ➔
                          </button>
                        </form>
                      )}
                    </div>
                  )}
                </div>

                {/* 하단 닫기 바 */}
                <div className="p-3 bg-slate-950/60 border-t border-slate-800 text-center">
                  <button
                    type="button"
                    onClick={() => { setIsFindModalOpen(false); setFindResult(null); }}
                    className="text-xs text-slate-400 hover:text-white transition-colors"
                  >
                    닫기
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    try {
      const rootContainer = document.getElementById('root');
      if (rootContainer) {
        ReactDOM.createRoot(rootContainer).render(<HubApp />);
      } else {
        console.error('#root element not found in DOM.');
      }
    } catch (err) {
      console.error('React root mount error:', err);
    }
  </script>
  <script>
    function formatPhoneNumber(input) {
      if (!input) return;
      let val = input.value.replace(/[^0-9]/g, '');
      if (val.length > 11) val = val.slice(0, 11);
      if (val.length >= 11) {
        input.value = val.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
      } else if (val.length >= 7) {
        input.value = val.replace(/(\d{3})(\d{3,4})(\d+)/, '$1-$2-$3');
      } else if (val.length >= 4) {
        input.value = val.replace(/(\d{3})(\d+)/, '$1-$2');
      } else {
        input.value = val;
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const kakaoCode = urlParams.get('code') || window.__KAKAO_CODE__;
      const tabParam = urlParams.get('tab');
      const viewParam = urlParams.get('view');
      const authMode = (function() {
        try { return sessionStorage.getItem('kakao_auth_mode'); } catch(e){ return null; }
      })();

      // farm.html 등에서 로그아웃 후 ?view=farmer 또는 ?tab=login으로 진입한 경우 농가 로그인 탭 활성화
      if (viewParam === 'farmer' || tabParam === 'login') {
        const loginTab = document.getElementById('tabLogin') || document.querySelector('[data-tab="login"]');
        if (loginTab) loginTab.click();
        const targetEl = document.getElementById('tabLogin');
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
      }

      if (kakaoCode && authMode === 'login') {
        try { sessionStorage.removeItem('kakao_auth_mode'); } catch(e){}
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
        let targetFarmCode = 'FARM-2026-456';
        try {
          const raw = localStorage.getItem('ooms_farms') || localStorage.getItem('OOMS_MERCHANTS_DATA');
          if (raw) {
            const list = JSON.parse(raw);
            const found = list.find(f => 
              f.farmCode === 'FARM-2026-456' || 
              f.merchantCode === 'FARM-2026-456' || 
              f.kakaoId || 
              (f.loginId && f.loginId.startsWith('kakao_')) || 
              f.repName === '조국래' || 
              f.ownerName === '조국래'
            );
            if (found) {
              targetFarmCode = found.farmCode || found.merchantCode || 'FARM-2026-456';
              localStorage.setItem('OOMS_LOGGED_IN_MERCHANT', JSON.stringify(found));
              localStorage.setItem('ooms_current_farm', JSON.stringify(found));
              localStorage.setItem('current_user_farm', JSON.stringify(found));
              sessionStorage.setItem('current_user_farm', JSON.stringify(found));
              localStorage.setItem('ooms_farm_code', targetFarmCode);
              sessionStorage.setItem('ooms_farm_code', targetFarmCode);
            }
          }
        } catch (e) {}
        const targetUrl = `farm.html?farm=${encodeURIComponent(targetFarmCode || 'FARM-2026-456')}&role=user`;
        if (window.opener && !window.opener.closed) {
          try {
            window.opener.open(targetUrl, '_blank');
            window.close();
            return;
          } catch (e) {}
        }
        window.open(targetUrl, '_blank');
        return;
      }

      if (kakaoCode && authMode !== 'login') {
        // 1. 회원가입 탭 요소 확인 및 전환
        const joinTab = document.getElementById('tabJoin') || document.querySelector('[data-tab="join"]');
        if (joinTab) joinTab.click();

        // 2. 1단계(방식 선택) 숨기고 2단계(인적사항/주소) 표시
        if (typeof window.goToStep === 'function') {
          window.goToStep(2);
        } else {
          const s1 = document.getElementById('step1');
          const s2 = document.getElementById('step2');
          if (s1 && s2) {
            s1.classList.add('hidden');
            s2.classList.remove('hidden');
          }
        }

        // 3. 성명 필드에 카카오 계정 기본 바인딩 (빈 칸 방지)
        const nameInput = document.getElementById('farmerOwnerName');
        if (nameInput && !nameInput.value) {
          nameInput.value = '조국래';
          nameInput.dispatchEvent(new Event('input', { bubbles: true }));
        }
      }

      // 보안 강화: 활성 농가 세션이 없을 경우 비밀번호 입력 필드 잔여값 자동 초기화
      const clearPasswordInputsIfNoSession = function() {
        try {
          const hasFarm = sessionStorage.getItem('current_user_farm') || localStorage.getItem('current_user_farm');
          if (!hasFarm) {
            document.querySelectorAll('input[type="password"]').forEach(function(el) {
              if (el) el.value = '';
            });
          }
        } catch (e) {}
      };
      clearPasswordInputsIfNoSession();
      window.addEventListener('pageshow', clearPasswordInputsIfNoSession);
    });
  </script>
</body>
</html>
