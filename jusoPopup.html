<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>행정안전부 주소 수신</title>
</head>
<body onload="init();">
  <form id="form" name="form" method="post">
    <input type="hidden" id="confmKey" name="confmKey" value=""/>
    <input type="hidden" id="returnUrl" name="returnUrl" value=""/>
    <input type="hidden" id="resultType" name="resultType" value=""/>
  </form>
  <script>
    function init() {
      const url = location.href;
      const confmKey = "U01TX0FVVEgyMDI2MTAxMzE1NTUzMzExNjcyNzg=";
      const resultType = "4";
      const inputYn = new URLSearchParams(window.location.search).get("inputYn");
      if (inputYn !== "Y") {
        document.getElementById("confmKey").value = confmKey;
        document.getElementById("returnUrl").value = url;
        document.getElementById("resultType").value = resultType;
        document.form.action = "https://business.juso.go.kr/addrlink/addrLinkUrl.do";
        document.form.submit();
      } else {
        const params = new URLSearchParams(window.location.search);
        if (window.opener && window.opener.jusoCallBack) {
          window.opener.jusoCallBack(
            params.get("roadFullAddr"),
            params.get("roadAddrPart1"),
            params.get("addrDetail"),
            params.get("roadAddrPart2"),
            params.get("engAddr"),
            params.get("jibunAddr"),
            params.get("zipNo")
          );
        }
        window.close();
      }
    }
  </script>
</body>
</html>
