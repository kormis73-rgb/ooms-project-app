<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>행정안전부 도로명주소 콜백</title>
</head>
<body onload="init()">
<script>
  function init() {
    var url = location.href;
    var confmKey = "U01TX0FVVEgyMDI2MTAyNzEwNTUxOTEyMDg3NDk="; 
    // 파라미터 파싱
    var params = new URLSearchParams(window.location.search);
    var roadFullAddr = params.get("roadFullAddr");
    var roadAddrPart1 = params.get("roadAddrPart1");
    var addrDetail = params.get("addrDetail");
    var roadAddrPart2 = params.get("roadAddrPart2");
    var engAddr = params.get("engAddr");
    var jibunAddr = params.get("jibunAddr");
    var zipNo = params.get("zipNo");

    // URLSearchParams가 비어있고 hash에 전달된 경우 대비
    if (!roadFullAddr && window.location.hash) {
      var hashParams = new URLSearchParams(window.location.hash.substring(1));
      roadFullAddr = hashParams.get("roadFullAddr");
      roadAddrPart1 = hashParams.get("roadAddrPart1");
      addrDetail = hashParams.get("addrDetail");
      roadAddrPart2 = hashParams.get("roadAddrPart2");
      engAddr = hashParams.get("engAddr");
      jibunAddr = hashParams.get("jibunAddr");
      zipNo = hashParams.get("zipNo");
    }

    // 부모창(iframe 환경: window.parent / 팝업 환경: window.opener) 탐색
    var targetCaller = (window.parent && window.parent !== window && typeof window.parent.jusoCallBack === 'function')
      ? window.parent
      : ((window.opener && typeof window.opener.jusoCallBack === 'function') ? window.opener : null);

    if (targetCaller) {
      targetCaller.jusoCallBack(roadFullAddr, roadAddrPart1, addrDetail, roadAddrPart2, engAddr, jibunAddr, zipNo);
      if (window.opener) {
        window.close();
      }
    } else {
      // 팝업 단독 테스트 또는 부모창 닫힘 시 안내
      document.body.innerHTML = '<div style="font-family:sans-serif;padding:20px;text-align:center;">'
        + '<p style="color:#059669;font-weight:bold;">주소 정보가 확인되었습니다.</p>'
        + '<p>' + (roadFullAddr || roadAddrPart1 || '선택된 주소 없음') + '</p>'
        + '<button onclick="if(window.opener)window.close();" style="padding:8px 16px;background:#059669;color:#fff;border:none;border-radius:6px;cursor:pointer;">창 닫기</button>'
        + '</div>';
    }
  }
</script>
</body>
</html>
