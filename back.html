<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OOMS - 산지직송 비정형 주문 관리 & 농가 관리 플랫폼</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS CDN for Excel bulk reverse-matching -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            farm: {
              50: '#f2f9f1',
              100: '#e1f3e0',
              500: '#34a853',
              600: '#2e9647',
              700: '#257838',
              900: '#154420',
            },
            harvest: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            },
            kakao: {
              yellow: '#FEE500',
              label: '#191919',
              bg: '#BACEE0',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 초기 농가 마스터 데이터 (더미 데이터 완전 삭제)
    const INITIAL_MERCHANTS = [];

    // [더미 농가 영구 차단 및 정리] 브라우저에 남아있던 FARM-2026-001 / FARM-2026-002 즉시 영구 삭제
    try {
      ['ooms_farms', 'OOMS_MERCHANTS_DATA'].forEach(key => {
        const raw = localStorage.getItem(key);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              const cleaned = parsed.filter(f => {
                const code = f.merchantCode || f.farmCode || f.code || '';
                const name = f.farmName || '';
                return code !== 'FARM-2026-001' && code !== 'FARM-2026-002' &&
                       !name.includes('청송 하늘아래') && !name.includes('나주 금천 배사랑');
              });
              localStorage.setItem(key, JSON.stringify(cleaned));
            }
          } catch(e){}
        }
      });
    } catch(e){}

    // =========================================================================
    // Supabase Auth 연동 및 로컬 Fallback 하이브리드 인증 모듈 (OOMS_AUTH)
    // =========================================================================
    const OOMS_SUPABASE_CONFIG = {
      url: window.OOMS_SUPABASE_URL || 'https://demo-ooms-supabase.co',
      anonKey: window.OOMS_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key'
    };

    let supabaseClient = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabaseClient = window.supabase.createClient(OOMS_SUPABASE_CONFIG.url, OOMS_SUPABASE_CONFIG.anonKey);
      }
    } catch (e) {
      console.warn('Supabase Client 로드 오류 (로컬 하이브리드 모드로 전환):', e);
    }

    const OOMS_AUTH = {
      getAdminSession: () => {
        try {
          const raw = sessionStorage.getItem('ooms_admin_session') || localStorage.getItem('ooms_admin_auth');
          if (raw) return JSON.parse(raw);
        } catch (e) {
          console.error('Admin session load error:', e);
        }
        // 기본 총괄매니저 세션 자동 발급 및 보존
        const defaultAdmin = {
          access_token: 'sb_admin_token_master',
          user: {
            id: 'usr_master_001',
            email: 'admin@ooms.kr',
            role: 'master',
            name: '총괄매니저'
          },
          createdAt: new Date().toISOString()
        };
        try {
          localStorage.setItem('ooms_admin_auth', JSON.stringify(defaultAdmin));
          sessionStorage.setItem('ooms_admin_session', JSON.stringify(defaultAdmin));
        } catch(e) {}
        return defaultAdmin;
      },
      signIn: async ({ email = 'admin@ooms.kr' } = {}) => {
        const sessionObj = {
          access_token: 'sb_admin_token_' + Date.now(),
          user: {
            id: 'usr_master_001',
            email: email,
            role: 'master',
            name: '총괄매니저'
          },
          createdAt: new Date().toISOString()
        };
        sessionStorage.setItem('ooms_admin_session', JSON.stringify(sessionObj));
        localStorage.setItem('ooms_admin_auth', JSON.stringify(sessionObj));
        return { success: true, session: sessionObj };
      },
      signOut: async () => {
        try {
          if (supabaseClient) {
            await supabaseClient.auth.signOut();
          }
        } catch (e) {}
        sessionStorage.removeItem('ooms_admin_session');
        localStorage.removeItem('ooms_admin_auth');
      }
    };

    function MainApp() {
      // URL 쿼리 파라미터 확인 (?tab=staging 감지 시 관리자 센터 자동 활성화)
      const urlParams = new URLSearchParams(window.location.search);
      const isStagingParam = urlParams.get('tab') === 'staging';

      const [currentView, setCurrentView] = useState('ADMIN_CENTER');
      
      // [관리자 전용 격리] 총괄 관리자 세션 상태 (ooms_admin_auth 및 sessionStorage 연동)
      const [authSession, setAuthSession] = useState(() => OOMS_AUTH.getAdminSession());

      // localStorage 영구 저장소 연동 (ooms_farms & OOMS_MERCHANTS_DATA 동시 지원, 새로고침 시 부활 방지)
      const [merchants, setMerchantsState] = useState(() => {
        try {
          const isInitialized = localStorage.getItem('ooms_farms_initialized');
          const savedFarms = localStorage.getItem('ooms_farms');
          const savedLegacy = localStorage.getItem('OOMS_MERCHANTS_DATA');

          // 저장된 데이터가 존재하면 빈 배열([])이어도 그대로 유효한 농가 목록으로 인정 (부활 차단)
          if (savedFarms !== null) {
            const parsed = JSON.parse(savedFarms);
            if (Array.isArray(parsed)) {
              return parsed.filter(f => {
                const code = f.merchantCode || f.farmCode || f.code || '';
                const name = f.farmName || '';
                return code !== 'FARM-2026-001' && code !== 'FARM-2026-002' &&
                       !name.includes('청송 하늘아래') && !name.includes('나주 금천 배사랑');
              });
            }
          }
          if (savedLegacy !== null) {
            const parsed = JSON.parse(savedLegacy);
            if (Array.isArray(parsed)) {
              return parsed.filter(f => {
                const code = f.merchantCode || f.farmCode || f.code || '';
                const name = f.farmName || '';
                return code !== 'FARM-2026-001' && code !== 'FARM-2026-002' &&
                       !name.includes('청송 하늘아래') && !name.includes('나주 금천 배사랑');
              });
            }
          }
          // 아직 초기화된 적이 없는 최초 접속인 경우만 INITIAL_MERCHANTS 시딩
          if (!isInitialized) {
            localStorage.setItem('ooms_farms', JSON.stringify(INITIAL_MERCHANTS));
            localStorage.setItem('OOMS_MERCHANTS_DATA', JSON.stringify(INITIAL_MERCHANTS));
            localStorage.setItem('ooms_farms_initialized', 'true');
            return INITIAL_MERCHANTS;
          }
        } catch (e) {
          console.error('localStorage load error:', e);
        }
        return [];
      });

      // 농가 목록 변경 시 localStorage 자동 동기화 (ooms_farms 및 OOMS_MERCHANTS_DATA 이중 보존 & 초기화 플래그 유지)
      const setMerchants = (updater) => {
        setMerchantsState(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          try {
            localStorage.setItem('ooms_farms', JSON.stringify(next));
            localStorage.setItem('OOMS_MERCHANTS_DATA', JSON.stringify(next));
            localStorage.setItem('ooms_farms_initialized', 'true');
            window.dispatchEvent(new Event('storage'));
          } catch (e) {
            console.error('localStorage save error:', e);
          }
          return next;
        });
      };

      const [activeMerchant, setActiveMerchant] = useState(() => merchants[0] || null);

      // 관리자 뷰 전환 핸들러
      const handleSwitchView = (targetView) => {
        setCurrentView(targetView);
      };

      // 테스트 데이터 초기화 함수
      const handleResetMerchants = () => {
        if (confirm('등록된 농가 목록을 초기 샘플 데이터로 리셋하시겠습니까?')) {
          setMerchants(INITIAL_MERCHANTS);
          setActiveMerchant(INITIAL_MERCHANTS[0]);
          try {
            localStorage.setItem('ooms_settlement_status', JSON.stringify({}));
            window.dispatchEvent(new Event('storage'));
          } catch (e) {}
          alert('농가 회원 목록이 초기화되었습니다.');
        }
      };

      // 총괄 관리자 세션 전용 로그아웃 함수 (농가 세션과 완전 격리)
      const handleLogout = async () => {
        await OOMS_AUTH.signOut();
        setAuthSession(null);
        alert('총괄매니저 세션이 안전하게 종료되었습니다.');
        window.location.href = 'index.html';
      };

      // 새 창으로 farm.html (농가 한손 모바일 포털) 열기 함수
      const openFarmPortalPage = (merchant = null) => {
        const target = merchant || (merchants && merchants.length > 0 ? merchants[0] : null);
        const farmCode = target ? (target.merchantCode || target.farmCode || '') : '';
        const targetUrl = farmCode ? `farm.html?farm=${encodeURIComponent(farmCode)}` : 'farm.html';
        window.open(targetUrl, '_blank', 'noopener,noreferrer');
      };

      // 새 창으로 order.html 열기 함수
      const openCustomerOrderPage = () => {
        window.open('order.html', '_blank', 'noopener,noreferrer');
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* 상단 글로벌 헤더 */}
          <header className="bg-slate-900 border-b border-slate-800 text-white px-4 py-3 sticky top-0 z-50 shadow-md">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
              {/* 로고 & 플랫폼 타이틀 (클릭 시 메인 허브 index.html로 이동) */}
              <a
                href="index.html"
                className="flex items-center gap-3 group hover:opacity-90 transition-all cursor-pointer no-underline select-none"
                title="메인 대문 허브(index.html)로 이동"
              >
                <span className="text-2xl group-hover:scale-110 transition-transform">🍏</span>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-black text-base text-farm-500 tracking-tight group-hover:text-farm-400 transition-colors">
                      OOMS
                    </span>
                    <span className="text-[11px] bg-slate-800 border border-slate-700 text-emerald-400 px-2 py-0.5 rounded-full font-bold group-hover:border-emerald-500/60 transition-colors">
                      통합 플랫폼 매니저
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 group-hover:text-slate-300 transition-colors">
                    로그인&회원가입 관리자 스테이징 센터 PWA 주문
                  </p>
                </div>
              </a>

              {/* 탭 네비게이션 & 새 창 열기 액션 버튼들 */}
              <div className="flex flex-wrap items-center gap-2">
                {/* 통합관리센터 모드 뱃지 */}
                <div className="flex bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-xs font-bold text-emerald-400 items-center gap-1.5 shadow-2xs">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>통합관리센터 콘솔 (등록 농가 {merchants.length}곳)</span>
                </div>

                {/* [관리자 전용] 총괄매니저 세션 뱃지 + 로그아웃 */}
                <div className="flex items-center gap-2 bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-xl text-xs">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span className="text-emerald-300 font-extrabold max-w-[140px] truncate">
                    🛡️ 총괄매니저 (Admin)
                  </span>
                  <button
                    onClick={handleLogout}
                    className="text-[10px] bg-slate-700 hover:bg-rose-900/60 text-slate-300 hover:text-rose-200 px-1.5 py-0.5 rounded transition-colors cursor-pointer font-bold"
                    title="총괄매니저 로그아웃"
                  >
                    로그아웃
                  </button>
                </div>

                {/* [신규 분리] 농가 모바일(farm.html) 새 창 열기 버튼 */}
                <button
                  onClick={() => openFarmPortalPage()}
                  className="bg-farm-600 hover:bg-farm-700 active:scale-95 text-white text-xs font-black px-3 py-2 rounded-xl shadow-md shadow-farm-600/30 transition-all flex items-center gap-1"
                  title="농가 현장 전용 모바일 포털(farm.html)을 새 창에서 엽니다"
                >
                  <span>🚜 농가 모바일</span>
                  <span className="text-[10px] bg-white/20 px-1 py-0.5 rounded">새 창 ↗</span>
                </button>

                {/* 고객 주문 폼(order.html) 새 창 띄우기 버튼 */}
                <button
                  onClick={openCustomerOrderPage}
                  className="bg-harvest-500 hover:bg-harvest-600 active:scale-95 text-white text-xs font-black px-3 py-2 rounded-xl shadow-md shadow-harvest-500/30 transition-all flex items-center gap-1"
                  title="고객이 주문하는 모바일 웹/PWA(order.html)를 새 창에서 엽니다"
                >
                  <span>📱 고객 주문 폼</span>
                  <span className="text-[10px] bg-white/20 px-1 py-0.5 rounded">새 창 ↗</span>
                </button>
              </div>
            </div>
          </header>

          {/* 메인 뷰: 관리자 통합관리센터 전용 뷰 */}
          <main className="flex-1 py-4 px-2 sm:px-4">
            <AdminCenterView
              merchants={merchants}
              setMerchants={setMerchants}
              onResetMerchants={handleResetMerchants}
            />
          </main>

          <footer className="bg-slate-900 border-t border-slate-800 text-slate-400 py-3 text-center text-xs">
            OOMS Unstructured Order Management System • Antigravity Enterprise Architecture Pack
          </footer>
        </div>
      );
    }

    // =========================================================================
    // [관리자 전용] 관리자 통합 제어 센터 (가입 농가 회원 리스트 명부 + 상품 관리 + 스테이징)
    // =========================================================================
    const DEFAULT_ORDERS_MASTER = [];

    // =========================================================================
    // 초기 고객 CS 티켓 마스터 데이터 (기본 0건 완전 초기화)
    // =========================================================================
    const DEFAULT_CS_TICKETS_MASTER = [];

    // =========================================================================
    // [관리자 전용] 통합관리센터 5대 핵심 메뉴 엔터프라이즈 콘솔 (AdminCenterView)
    // =========================================================================
    function AdminCenterView({ merchants = [], setMerchants, onResetMerchants }) {
      const urlParams = new URLSearchParams(window.location.search);
      const tabParam = (urlParams.get('tab') || '').toLowerCase();
      
      // 5대 핵심 메뉴 탭: 'MERCHANTS' | 'PRODUCTS' | 'ORDERS' | 'SETTLEMENT' | 'CS_BOARD'
      const getInitialTab = () => {
        if (tabParam === 'staging' || tabParam === 'orders') return 'ORDERS';
        if (tabParam === 'products') return 'PRODUCTS';
        if (tabParam === 'settlement') return 'SETTLEMENT';
        if (tabParam === 'cs' || tabParam === 'cs_board') return 'CS_BOARD';
        return 'MERCHANTS';
      };

      const [activeTab, setActiveTab] = useState(getInitialTab);

      // 검색어 및 필터 상태
      const [searchKeyword, setSearchKeyword] = useState('');
      const [productCategoryFilter, setProductCategoryFilter] = useState('ALL');
      const [productViewMode, setProductViewMode] = useState('TABLE'); // 'TABLE' | 'ACCORDION'
      const [orderFilter, setOrderFilter] = useState('ALL'); // 'ALL' | 'PENDING' | 'UNPAID' | 'SHIPPED'
      const [csFilter, setCsFilter] = useState('ALL'); // 'ALL' | 'PENDING' | 'IN_PROGRESS' | 'RESOLVED'

      // 모달 상태
      const [editMerchantModal, setEditMerchantModal] = useState({ isOpen: false, data: null });
      const [csReplyModal, setCsReplyModal] = useState({ isOpen: false, ticket: null, reply: '' });
      // 농가 상품 신규 등록 모달 상태
      const [addProductModal, setAddProductModal] = useState({
        isOpen: false,
        merchant: null,
        category: '사과',
        name: '',
        spec: '',
        price: '',
        brix: ''
      });
      // 가입 농가 회원 다중 선택 체크박스 상태 (농가 id 목록)
      const [selectedMerchantIds, setSelectedMerchantIds] = useState([]);

      // 주문 관리 필터/정렬 및 택배사 연동 상태
      const [orderStartDate, setOrderStartDate] = useState('');
      const [orderEndDate, setOrderEndDate] = useState('');
      const [orderSortBy, setOrderSortBy] = useState('APPROVED_DESC'); // 'APPROVED_DESC' | 'APPROVED_ASC' | 'AMOUNT_DESC'
      const [carrierFormat, setCarrierFormat] = useState('POST'); // 'POST' (우체국/공공택배) | 'CJ' (CJ대한통운) | 'HANJIN' (한진/롯데)
      const [selectedOrderIds, setSelectedOrderIds] = useState([]);

      // 등록상품 마우스 호버 플로팅 툴팁 상태
      const [productTooltip, setProductTooltip] = useState({
        visible: false,
        merchant: null,
        top: 0,
        left: 0
      });

      const handleProductBadgeMouseEnter = (e, merchant) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const tooltipWidth = 330;
        let leftPos = rect.left;
        if (leftPos + tooltipWidth > window.innerWidth - 20) {
          leftPos = window.innerWidth - tooltipWidth - 20;
        }
        setProductTooltip({
          visible: true,
          merchant,
          top: rect.bottom + 8,
          left: Math.max(10, leftPos)
        });
      };

      const handleProductBadgeMouseLeave = () => {
        setProductTooltip(prev => ({ ...prev, visible: false }));
      };

      // 1. 주문 데이터 상태 (localStorage 'ooms_orders' 영구 동기화, 기본 0건 완전 초기화)
      const [orders, setOrdersState] = useState(() => {
        try {
          const isOrdersReset = localStorage.getItem('ooms_orders_reset_pipeline');
          if (!isOrdersReset) {
            localStorage.setItem('ooms_orders', JSON.stringify([]));
            localStorage.setItem('ooms_staging_orders', JSON.stringify([]));
            localStorage.setItem('ooms_orders_reset_pipeline', 'true');
            return [];
          }
          const saved = localStorage.getItem('ooms_orders') || localStorage.getItem('ooms_staging_orders');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch (e) {
          console.error(e);
        }
        return [];
      });

      const setOrders = (updater) => {
        setOrdersState(prev => {
          const next = typeof updater === 'function' ? updater(prev) : updater;
          try {
            localStorage.setItem('ooms_orders', JSON.stringify(next));
            localStorage.setItem('ooms_staging_orders', JSON.stringify(next));
            window.dispatchEvent(new Event('storage'));
          } catch (e) {
            console.error(e);
          }
          return next;
        });
      };

      // 2. 고객 CS 티켓 데이터 상태 (localStorage 'ooms_cs_inquiries' 영구 동기화, 기본 0건 완전 초기화)
      const [csTickets, setCsTicketsState] = useState(() => {
        try {
          const isCsReset = localStorage.getItem('ooms_cs_reset_pipeline');
          if (!isCsReset) {
            localStorage.setItem('ooms_cs_inquiries', JSON.stringify([]));
            localStorage.setItem('ooms_cs_tickets', JSON.stringify([]));
            localStorage.setItem('ooms_cs_reset_pipeline', 'true');
            return [];
          }
          const saved = localStorage.getItem('ooms_cs_inquiries') || localStorage.getItem('ooms_cs_tickets');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed)) return parsed;
          }

          const day = String(d.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;

          const past = new Date(today);
          past.setDate(today.getDate() - 2);

        } else if (type === 'WEEK') {

            o.detail_address ||
            ''
          ).trim();

          let fullAddress = '';
          if (road && detail) {
            fullAddress = `${road} ${detail}`;
          } else if (road) {
            fullAddress = road;
          } else if (detail) {
            fullAddress = detail;
          } else if (typeof o.address === 'string' && o.address) {
            fullAddress = o.address.trim();
          } else {
            fullAddress = '주소 정보 없음';
          }

          // 6 & 7. 상품명 및 수량 분리 정제
          let rawProdName = (
            o.product?.name ||
            o.productName ||
            o.product_name ||
            (typeof o.product === 'string' ? o.product : '') ||
            '농산물'
          ).trim();

          let qty = Number(o.product?.qty) || Number(o.quantity) || Number(o.order_quantity) || 1;

          // 상품명 문자열에 "(N박스)", "(N개)", "N박스" 등의 수량 표기가 포함된 경우 분리 정제
          const qtyMatch = rawProdName.match(/[\(\[]?\s*(\d+)\s*(?:박스|box|개|세트|입)\s*[\)\]]?/i);
          if (qtyMatch) {
            if (!o.product?.qty && !o.quantity) {
              qty = Number(qtyMatch[1]) || qty;
            }
            rawProdName = rawProdName.replace(/[\(\[]?\s*\d+\s*(?:박스|box|개|세트|입)\s*[\)\]]?/gi, '').trim();
          }

          const cleanProductName = rawProdName || '농산물';

          // 8. 메모 (배송메시지 / 요청사항)
          let memo = (
            o.memo ||
            o.note ||
            o.message ||
            o.shipping_message ||
            o.req ||
            (o.rawText && o.rawText.includes('부모님 명절 선물') ? '부모님 명절 선물입니다.' : '') ||
            '요청사항 없음'
          ).trim();

          return [
            ordererName,
            ordererPhone,
            receiverName,
            receiverPhone,
            fullAddress,
            cleanProductName,
            qty,
            memo
          ];
        });

        // 규격 3: 쉼표(,) 및 줄바꿈 처리 (CSV RFC4180 이스케이프)
        const escapeCsv = (val) => {
          const str = String(val ?? '');
          if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
            return `"${str.replace(/"/g, '""')}"`;
          }
          return `"${str}"`; // 모든 컬럼을 안전하게 큰따옴표로 감싸 열 분리 오류 원천 방지
        };

        const csvContent = [
          headers.map(h => `"${h}"`).join(','),
          ...rows.map(row => row.map(escapeCsv).join(','))
        ].join('\r\n');

        // 규격 4: UTF-8 BOM (\uFEFF) 추가로 엑셀 한글 깨짐 방지
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const ymd = `${year}${month}${day}`;
        link.setAttribute('download', `OOMS_주문목록_${ymd}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      const handleTogglePaymentOrder = (id) => {
        setOrders(prev => prev.map(o => {
          if (o.id === id || o.orderId === id) {
            const curPaid = isPaymentPaid(o);
            const nextPaid = !curPaid;
            return {
              ...o,
              paid: nextPaid,
              paymentStatus: nextPaid ? '입금완료' : '미입금',
              status: {
                ...(typeof o.status === 'object' ? o.status : {}),
                payment: nextPaid ? 'PAID' : 'UNPAID'
              }
            };
          }
          return o;
        }));
      };

      // 배송 진행상태 3단계 (준비중 / 배송중 / 배송완료) 변경 핸들러 (규칙 강제: 송장번호 필수)
      const handleChangeShippingStatus = (id, newStatus) => {
        const targetOrder = orders.find(o => (o.id === id || o.orderId === id));
        const currentTracking = targetOrder?.tracking || targetOrder?.invoiceNum || targetOrder?.invoiceNumber;

        if ((newStatus === '배송중' || newStatus === '배송완료') && !currentTracking) {
          alert('⚠️ 운송장(송장) 번호가 등록되지 않은 주문은 [배송중] 또는 [배송완료] 상태로 변경할 수 없습니다.\n먼저 택배사와 송장번호를 등록해주세요.');
          return;
        }

        setOrders(prev => prev.map(o => {
          if (o.id === id || o.orderId === id) {
            return {
              ...o,
              shippingStatus: newStatus,
              status: {
                ...(typeof o.status === 'object' ? o.status : {}),
                shipping: newStatus === '배송완료' ? 'DELIVERED' : (newStatus === '배송중' ? 'SHIPPED' : 'READY')
              }
            };
          }
          return o;
        }));
      };

      // 개별 운송장 번호 등록 및 수정 저장 (저장 즉시 배송중 자동 전환)
      const handleSaveSingleInvoice = (orderId) => {
        const inputState = inlineInvoiceInputs[orderId] || {};
        const courier = inputState.courier || 'CJ대한통운';
        const num = (inputState.num || '').trim();

        if (!num) {
          alert('송장번호를 입력해주세요.');
          return;
        }

        // 숫자 및 하이픈 체크 (8자리 이상)
        const cleanNum = num.replace(/[^0-9]/g, '');
        if (cleanNum.length < 8) {
          alert('유효한 운송장 번호(숫자 8자리 이상)를 입력해주세요.');
          return;
        }

        setOrders(prev => {
          const next = prev.map(o => {
            if (o.id === orderId || o.orderId === orderId) {
              return {
                ...o,
                tracking: num,
                invoiceNum: num,
                invoiceNumber: num,
                carrier: courier,
                courier: courier,
                shippingStatus: '배송중',
                status: {
                  ...(typeof o.status === 'object' ? o.status : {}),
                  staging: 'INVOICE_ISSUED',
                  shipping: 'SHIPPED'
                }
              };
            }
            return o;
          });

          try {
            const shipments = JSON.parse(localStorage.getItem('ooms_shipments') || '{}');
            shipments[orderId] = {
              orderId,
              tracking: num,
              status: 'SHIPPED',
              carrier: courier,
              issuedAt: new Date().toISOString()
            };
            localStorage.setItem('ooms_shipments', JSON.stringify(shipments));
          } catch (err) {}

          return next;
        });

        // 인라인 입력 상태 수정 모드 해제
        setInlineInvoiceInputs(prev => ({
          ...prev,
          [orderId]: { ...prev[orderId], isEditing: false }
        }));

        alert(`주문 [${orderId}]에 [${courier}] 송장(${num})이 등록되었습니다.\n배송상태가 [🚚 배송중]으로 자동 승격되었습니다.`);
      };

      // 개별 운송장 수정 모드 진입
      const handleStartEditInvoice = (orderId, currentCourier, currentNum) => {
        setInlineInvoiceInputs(prev => ({
          ...prev,
          [orderId]: {
            courier: currentCourier || 'CJ대한통운',
            num: currentNum || '',
            isEditing: true
          }
        }));
      };

      // 배송완료 확정 처리 (정산 대상으로 전환)
      const handleCompleteDelivery = (orderId) => {
        const targetOrder = orders.find(o => (o.id === orderId || o.orderId === orderId));
        const currentTracking = targetOrder?.tracking || targetOrder?.invoiceNum || targetOrder?.invoiceNumber;
        if (!currentTracking) {
          alert('송장번호가 등록되지 않은 주문은 배송완료 처리할 수 없습니다.');
          return;
        }

        if (!confirm(`주문 [${orderId}]을 [배송완료] 처리하시겠습니까?\n배송완료 처리 시 정산 대장에 정상 반영됩니다.`)) {
          return;
        }

        setOrders(prev => prev.map(o => {
          if (o.id === orderId || o.orderId === orderId) {
            return {
              ...o,
              shippingStatus: '배송완료',
              status: {
                ...(typeof o.status === 'object' ? o.status : {}),
                shipping: 'DELIVERED'
              }
            };
          }
          return o;
        }));

        try {
          const shipments = JSON.parse(localStorage.getItem('ooms_shipments') || '{}');
          if (shipments[orderId]) {
            shipments[orderId].status = 'DELIVERED';
            shipments[orderId].deliveredAt = new Date().toISOString();
            localStorage.setItem('ooms_shipments', JSON.stringify(shipments));
          }
        } catch (err) {}

        alert(`주문 [${orderId}]이 [✓ 배송완료] 처리되었습니다.`);
      };

      // 엑셀 대량 송장 역매칭 파일 업로드 처리 (SheetJS 기반)
      const handleBulkInvoiceFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            if (typeof XLSX === 'undefined') {
              alert('엑셀 파싱 라이브러리가 로드되지 않았습니다.');
              return;
            }
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            if (!jsonRows || jsonRows.length === 0) {
              alert('엑셀 파일에 데이터가 없습니다.');
              return;
            }

            // 역매칭 로직: 주문번호, 수령인명, 연락처, 송장번호, 택배사 추출
            const matchedList = [];
            const cleanPhone = (str) => String(str || '').replace(/[^0-9]/g, '');

            jsonRows.forEach((row, idx) => {
              // 1. 주문번호 탐색
              const rowOrderId = String(
                row['주문번호'] || row['주문ID'] || row['Order ID'] || row['orderId'] || row['ID'] || ''
              ).trim();

              // 2. 수령인/고객명 탐색
              const rowReceiver = String(
                row['수령인'] || row['수취인'] || row['받는분'] || row['받는사람'] || row['고객명'] || row['주문자'] || ''
              ).trim();

              // 3. 연락처 탐색
              const rowPhone = cleanPhone(
                row['수령인 연락처'] || row['연락처'] || row['전화번호'] || row['휴대폰'] || row['주문자 연락처'] || ''
              );

              // 4. 송장번호 탐색
              const rowInvoice = String(
                row['송장번호'] || row['운송장번호'] || row['운송장'] || row['송장'] || row['Tracking'] || row['Invoice'] || ''
              ).trim();

              // 5. 택배사 탐색
              let rowCourier = String(
                row['택배사'] || row['택배'] || row['배송사'] || row['Carrier'] || ''
              ).trim();
              if (!rowCourier) rowCourier = 'CJ대한통운';

              if (rowInvoice) {
                // 기존 orders에서 매칭되는 주문 검색
                const matchedOrder = orders.find(o => {
                  const oId = String(o.id || o.orderId || '').trim();
                  if (rowOrderId && oId === rowOrderId) return true;

                  const oReceiver = String(o.receiverName || o.receiver?.name || o.receiver || '').trim();
                  const oOrderer = String(o.senderName || o.orderer?.name || o.orderer || '').trim();
                  const oPhone = cleanPhone(o.receiverPhone || o.receiver?.tel || o.phone || o.senderPhone || '');

                  if (rowReceiver && (oReceiver === rowReceiver || oOrderer === rowReceiver)) {
                    if (!rowPhone || !oPhone || rowPhone === oPhone || oPhone.endsWith(rowPhone.slice(-4))) {
                      return true;
                    }
                  }
                  return false;
                });

                if (matchedOrder) {
                  const oId = matchedOrder.id || matchedOrder.orderId;
                  matchedList.push({
                    orderId: oId,
                    receiverName: matchedOrder.receiverName || matchedOrder.receiver?.name || matchedOrder.receiver || '수령인',
                    productName: matchedOrder.productName || matchedOrder.product?.name || '상품',
                    courier: rowCourier,
                    invoiceNumber: rowInvoice,
                    prevStatus: matchedOrder.shippingStatus || '준비중'
                  });
                }
              }
            });

            if (matchedList.length === 0) {
              alert('엑셀 파일에서 등록된 주문과 일치하는 송장 정보를 찾지 못했습니다.\n[주문번호] 또는 [수령인 + 연락처]와 [송장번호] 열이 포함되어 있는지 확인해주세요.');
              return;
            }

            setBulkMatchModal({
              isOpen: true,
              fileName: file.name,
              previewCount: matchedList.length,
              matchedRows: matchedList
            });

          } catch (err) {
            console.error('엑셀 역매칭 파싱 오류:', err);
            alert('엑셀 파일 분석 중 오류가 발생했습니다: ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
        // 입력 초기화
        e.target.value = '';
      };

      // 엑셀 대량 역매칭 일괄 적용 실행
      const handleApplyBulkReverseMatch = () => {
        const targets = bulkMatchModal.matchedRows;
        if (!targets || targets.length === 0) return;

        const matchMap = {};
        targets.forEach(t => {
          matchMap[t.orderId] = t;
        });

        setOrders(prev => {
          const next = prev.map(o => {
            const oId = o.id || o.orderId;
            if (matchMap[oId]) {
              const info = matchMap[oId];
              return {
                ...o,
                tracking: info.invoiceNumber,
                invoiceNum: info.invoiceNumber,
                invoiceNumber: info.invoiceNumber,
                carrier: info.courier,
                courier: info.courier,
                shippingStatus: '배송중',
                status: {
                  ...(typeof o.status === 'object' ? o.status : {}),
                  staging: 'INVOICE_ISSUED',
                  shipping: 'SHIPPED'
                }
              };
            }
            return o;
          });

          try {
            const shipments = JSON.parse(localStorage.getItem('ooms_shipments') || '{}');
            targets.forEach(t => {
              shipments[t.orderId] = {
                orderId: t.orderId,
                tracking: t.invoiceNumber,
                status: 'SHIPPED',
                carrier: t.courier,
                issuedAt: new Date().toISOString()
              };
            });
            localStorage.setItem('ooms_shipments', JSON.stringify(shipments));
          } catch (err) {}

          return next;
        });

        const appliedCount = targets.length;
        setBulkMatchModal({ isOpen: false, fileName: '', previewCount: 0, matchedRows: [] });
        alert(`총 ${appliedCount}건의 주문에 운송장 번호가 일괄 역매칭되어 [🚚 배송중] 상태로 전환되었습니다!`);
      };

      const handleIssueInvoiceOrder = (id) => {
        const tracking = `689${Math.floor(1000000000 + Math.random() * 9000000000)}`;
        setOrders(prev => {
          const next = prev.map(o => {
            if (o.id === id || o.orderId === id) {
              return {
                ...o,
                tracking,
                invoiceNum: tracking,
                invoiceNumber: tracking,
                carrier: 'CJ대한통운',
                courier: 'CJ대한통운',
                shippingStatus: '배송중',
                status: typeof o.status === 'object' ? { ...o.status, staging: 'INVOICE_ISSUED', shipping: 'SHIPPED' } : 'INVOICE_ISSUED'
              };
            }
            return o;
          });

          try {
            const shipments = JSON.parse(localStorage.getItem('ooms_shipments') || '{}');
            shipments[id] = {
              orderId: id,
              tracking,
              status: 'SHIPPED',
              carrier: 'CJ대한통운',
              issuedAt: new Date().toISOString()
            };
            localStorage.setItem('ooms_shipments', JSON.stringify(shipments));
          } catch (err) {}

          return next;
        });
        alert(`택배사 계약소포 송장 [${tracking}]이 발급되어 [🚚 배송중]으로 전환되었습니다.`);
      };

      // -----------------------------------------------------------------------
      // [메뉴 4] 정산 관리 집계 (실제 승인·배송완료 주문 기반 동적 파이프라인)
      // -----------------------------------------------------------------------
      // 최종 승인 및 배송완료 주문 판별 헬퍼 (입금완료 AND 배송완료)
      const isSettlementEligible = (o) => {
        const isPaidOrder = isPaymentPaid(o);
        const isDelivered = (
          o.shippingStatus === '배송완료' ||
          o.shippingStatus === 'DELIVERED' ||
          o.status?.shipping === '배송완료' ||
          o.status?.shipping === 'DELIVERED' ||
          o.deliveryStatus === '배송완료' ||
          o.status?.staging === 'SETTLED'
        );
        return isPaidOrder && isDelivered;
      };

      const settlementAccounts = {
        'FARM-2026-001': { bank: 'NH농협', acc: '302-0928-1234-51', holder: '김만석' },
        'FARM-2026-002': { bank: 'KB국민', acc: '478201-04-182941', holder: '박순자' },
        'FARM-2026-224': { bank: '농협', acc: '301-0284-9182-31', holder: '조국래' },
        'FARM-2026-088': { bank: '우체국', acc: '312849-02-192834', holder: '조국래' }
      };

      // 실제 입금완료 + 배송완료 조건을 만족하는 주문만 필터링
      const eligibleSettlementOrders = orders.filter(isSettlementEligible);

      // 농가별(farmCode) 주문 그룹핑 집계
      const ordersByFarm = {};
      eligibleSettlementOrders.forEach(o => {
        let fCode = o.farmCode || o.merchantCode || o.farm_code;
        if (!fCode) {
          const prodName = o.product?.name || o.productName || (typeof o.product === 'string' ? o.product : '');
          const matched = merchants.find(m => 
            (m.products || []).some(p => p.name === prodName || (prodName && prodName.includes(p.name))) ||
            (m.farmName && (o.farmName === m.farmName || (prodName && prodName.includes(m.farmName))))
          );
          if (matched) fCode = matched.merchantCode || matched.id;
        }
        if (!fCode) fCode = 'FARM-2026-224';

        if (!ordersByFarm[fCode]) {
          ordersByFarm[fCode] = [];
        }
        ordersByFarm[fCode].push(o);
      });

      const farmSettlementSummary = Object.keys(ordersByFarm).map(code => {
        const farmOrders = ordersByFarm[code];
        const merchant = merchants.find(m => m.merchantCode === code || m.id === code) || {};
        const farmName = merchant.farmName || farmOrders[0]?.farmName || '산지 농가';
        const repName = merchant.repName || '농가 대표';
        const phone = merchant.phone || farmOrders[0]?.farmPhone || '-';

        const bankInfo = merchant.bankInfo || settlementAccounts[code] || {
          bank: '농협',
          acc: '301-0284-9182-31',
          holder: repName
        };

        const orderCount = farmOrders.length;
        const totalSales = farmOrders.reduce((sum, o) => {
          const price = Number(o.product?.price) || Number(o.price) || Number(o.amount) || Number(o.totalPrice) || 0;
          const qty = Number(o.quantity) || Number(o.product?.qty) || Number(o.qty) || 1;
          return sum + (price * (o.product?.price ? 1 : qty) || price || 0);
        }, 0);

        const fee = Math.round(totalSales * 0.035); // 3.5% 플랫폼 수수료
        const netSettlement = totalSales - fee;
        const status = settlementStatuses[code] || 'PENDING';

        return {
          id: merchant.id || code,
          merchantCode: code,
          farmName,
          repName,
          phone,
          bankInfo,
          orderCount,
          totalSales,
          fee,
          netSettlement,
          status
        };
      });

      const totalPlatformSales = farmSettlementSummary.reduce((acc, f) => acc + f.totalSales, 0);
      const totalPlatformFee = farmSettlementSummary.reduce((acc, f) => acc + f.fee, 0);
      const totalNetSettlement = farmSettlementSummary.reduce((acc, f) => acc + f.netSettlement, 0);
      const paidSettlementAmount = farmSettlementSummary.filter(f => f.status === 'PAID').reduce((acc, f) => acc + f.netSettlement, 0);
      const pendingSettlementAmount = totalNetSettlement - paidSettlementAmount;

                                    <button

                                      onClick={() => handleChangeShippingStatus(orderId, '준비중')}

                                        (order.shippingStatus || '준비중') === '준비중'

                                          : 'text-slate-500 hover:text-slate-800 hover:bg-slate-200/60'
                                      }`}
                                      title="배송 진행상태를 [준비중]으로 변경"
                                    >
                                      <span>📦</span>
                                      <span>준비중</span>
                                    </button>

                                    <button
                                      type="button"
                                      onClick={() => handleChangeShippingStatus(orderId, '배송중')}
                                      className={`px-2 py-0.5 rounded-md text-[10px] font-extrabold transition-all flex items-center gap-0.5 whitespace-nowrap cursor-pointer ${
                                        order.shippingStatus === '배송중'
                                          ? 'bg-blue-600 text-white shadow-2xs font-black'
                                          : 'text-slate-500 hover:text-slate-800 hover:bg-slate-200/60'
                                      }`}
                                      title="배송 진행상태를 [배송중]으로 변경 (송장번호 필요)"
                                    >
                                      <span>🚚</span>
                                      <span>배송중</span>
                                    </button>

                                    <button
                                      type="button"
                                      onClick={() => handleCompleteDelivery(orderId)}
                                      className={`px-2 py-0.5 rounded-md text-[10px] font-extrabold transition-all flex items-center gap-0.5 whitespace-nowrap cursor-pointer ${
                                        order.shippingStatus === '배송완료'
                                          ? 'bg-emerald-600 text-white shadow-2xs font-black'
                                          : (order.tracking || order.invoiceNum || order.invoiceNumber)
                                          ? 'bg-emerald-50 text-emerald-700 hover:bg-emerald-600 hover:text-white border border-emerald-300'
                                          : 'text-slate-400 hover:text-slate-500 cursor-not-allowed opacity-50'
                                      }`}
                                      title="배송완료 확정 처리 (정산 대상으로 전환)"
                                    >
                                      <span>✓</span>
                                      <span>배송완료</span>
                                    </button>
                                  </div>
                                </div>
                              </td>

                      <span className="text-[10px] text-farm-600 font-bold uppercase">Target Merchant</span>
                      <p className="font-extrabold text-slate-900 text-xs mt-0.5">
                        {addProductModal.merchant.farmName} • {addProductModal.merchant.repName} ({addProductModal.merchant.phone})
                      </p>
                    </div>
                    <span className="bg-farm-600 text-white font-mono text-[10px] font-black px-2 py-0.5 rounded">
                      {addProductModal.merchant.merchantCode}
                    </span>
                  </div>

                  {/* 1. 품목 구분 */}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">
                      1. 품목 구분 *
                    </label>
                    <select
                      value={addProductModal.category}
                      onChange={(e) => setAddProductModal({ ...addProductModal, category: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-farm-500 focus:outline-none bg-white font-bold text-slate-800"
                    >
                      <option value="사과">사과 (부사, 홍로, 시나노골드 등)</option>
                      <option value="배">배 (신고, 원황, 황금배 등)</option>
                      <option value="메론">메론 (하미과, 머스크, 양구 등)</option>
                      <option value="수박">수박 (흑수박, 애플수박 등)</option>
                      <option value="복숭아">복숭아 (백도, 황도, 천도 등)</option>
                      <option value="감귤/한라봉">감귤/한라봉 (노지감귤, 천혜향 등)</option>
                      <option value="포도/샤인머스캣">포도/샤인머스캣 (샤인머스캣, 캠벨 등)</option>
                      <option value="기타 농산물">기타 채소/과일 (자두, 토마토, 딸기 등)</option>
                    </select>
                  </div>

                  {/* 2. 상품명 */}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">
                      2. 상품명 *
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="예: 가정용 꿀사과 5kg"
                      value={addProductModal.name}
                      onChange={(e) => setAddProductModal({ ...addProductModal, name: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-farm-500 focus:outline-none font-medium"
                    />
                  </div>

                  {/* 3. 규격 / 과수 */}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        3. 규격 / 과수 *
                      </label>
                      <input
                        type="text"
                        required
                        placeholder="예: 5kg(14~16과)"
                        value={addProductModal.spec}
                        onChange={(e) => setAddProductModal({ ...addProductModal, spec: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-farm-500 focus:outline-none"
                      />
                    </div>

                    {/* 4. 판매 가격 */}
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        4. 판매 가격(원) *
                      </label>
                      <input
                        type="number"
                        required
                        min="1000"
                        step="1000"
                        placeholder="예: 35000"
                        value={addProductModal.price}
                        onChange={(e) => setAddProductModal({ ...addProductModal, price: e.target.value })}
                        className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-farm-500 focus:outline-none font-mono font-bold"
                      />
                    </div>
                  </div>

                  {/* 5. 보증 당도 / 특이사항 */}
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">
                      5. 보증 당도 / 특이사항
                    </label>
                    <input
                      type="text"
                      placeholder="예: 당도 14 Brix 보증, 흠집 없는 정품"
                      value={addProductModal.brix}
                      onChange={(e) => setAddProductModal({ ...addProductModal, brix: e.target.value })}
                      className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-farm-500 focus:outline-none"
                    />
                    <p className="text-[10px] text-slate-400 mt-1">
                      💡 미입력 시 '선별 기준 준수' 문구가 기본 지정됩니다.
                    </p>
                  </div>

                  {/* 6. 버튼: [취소] 및 [💾 상품 등록 완료] */}
                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setAddProductModal({ isOpen: false, merchant: null, category: '사과', name: '', spec: '', price: '', brix: '' })}
                      className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold cursor-pointer transition-colors"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-farm-600 hover:bg-farm-700 text-white py-3 rounded-xl font-black shadow-md shadow-farm-600/30 cursor-pointer flex items-center justify-center gap-1.5 transition-all"
                    >
                      <span>💾</span>
                      <span>상품 등록 완료</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
          {csReplyModal.isOpen && csReplyModal.ticket && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl space-y-4 text-xs">
                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <span className="font-mono bg-purple-100 text-purple-800 font-bold px-2 py-0.5 rounded">
                      {csReplyModal.ticket.id}
                    </span>
                    <h3 className="font-black text-sm text-slate-900">
                      고객 문의 답변 작성
                    </h3>
                  </div>
                  <button onClick={() => setCsReplyModal({ isOpen: false, ticket: null, reply: '' })} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                <div className="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 space-y-1.5">
                  <div className="flex justify-between text-slate-500 text-[11px]">
                    <span>고객: <b>{csReplyModal.ticket.customerName}</b> ({csReplyModal.ticket.phone})</span>
                    <span>{csReplyModal.ticket.category}</span>
                  </div>
                  <p className="font-bold text-slate-900 text-sm">{csReplyModal.ticket.title}</p>
                  <p className="text-slate-600 leading-relaxed">{csReplyModal.ticket.content}</p>
                </div>

                <form onSubmit={handleSaveCsReply} className="space-y-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">
                      관리자 공식 답변 / 조치 내역 입력 *
                    </label>
                    <textarea
                      rows="4"
                      required
                      value={csReplyModal.reply}
                      onChange={(e) => setCsReplyModal({ ...csReplyModal, reply: e.target.value })}
                      placeholder="고객 요청에 대한 처리 결과 또는 알림톡 안내 내용을 입력하세요..."
                      className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-farm-500 focus:outline-none text-slate-800"
                    />
                  </div>

                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setCsReplyModal({ isOpen: false, ticket: null, reply: '' })}
                      className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold"
                    >
                      취소
                    </button>
                    <button
                      type="submit"
                      className="flex-1 bg-farm-600 hover:bg-farm-700 text-white py-3 rounded-xl font-black shadow-md shadow-farm-600/30"
                    >
                      답변 저장 및 완료 처리 ➔
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 엑셀 대량 송장 역매칭 확인 및 적용 모달 */}
          {bulkMatchModal.isOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
              <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200 animate-in fade-in zoom-in duration-150 max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between pb-4 border-b border-slate-100 shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📊</span>
                    <div>
                      <h3 className="text-base font-black text-slate-900">
                        엑셀 대량 송장 역매칭 확인
                      </h3>
                      <p className="text-xs text-slate-500 font-medium">
                        파일명: <b className="text-slate-800">{bulkMatchModal.fileName}</b> • 매칭 성공: <b className="text-emerald-600 font-mono">{bulkMatchModal.previewCount}건</b>
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setBulkMatchModal({ isOpen: false, fileName: '', previewCount: 0, matchedRows: [] })}
                    className="text-slate-400 hover:text-slate-600 text-lg font-bold p-1 cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <div className="py-4 overflow-y-auto flex-1 space-y-3">
                  <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 text-xs text-emerald-800 font-medium flex items-center justify-between">
                    <span>💡 [일괄 적용]을 클릭하면 매칭된 모든 주문의 송장번호가 등록되고 즉시 <b>[🚚 배송중]</b> 상태로 자동 승격됩니다.</span>
                  </div>

                  <div className="border border-slate-200 rounded-xl overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200">
                        <tr>
                          <th className="py-2.5 px-3">주문번호</th>
                          <th className="py-2.5 px-3">수령인</th>
                          <th className="py-2.5 px-3">상품</th>
                          <th className="py-2.5 px-3">택배사</th>
                          <th className="py-2.5 px-3">매칭 송장번호</th>
                          <th className="py-2.5 px-3">상태 변경</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        {bulkMatchModal.matchedRows.map((row, idx) => (
                          <tr key={idx} className="hover:bg-slate-50">
                            <td className="py-2 px-3 font-mono font-bold text-slate-800">{row.orderId}</td>
                            <td className="py-2 px-3 font-bold text-slate-900">{row.receiverName}</td>
                            <td className="py-2 px-3 text-slate-700 truncate max-w-[120px]">{row.productName}</td>
                            <td className="py-2 px-3 font-bold text-blue-700">{row.courier}</td>
                            <td className="py-2 px-3 font-mono font-black text-slate-900 bg-blue-50/50">{row.invoiceNumber}</td>
                            <td className="py-2 px-3">
                              <span className="text-[10px] bg-blue-100 text-blue-700 font-black px-1.5 py-0.5 rounded">
                                {row.prevStatus} ➔ 배송중
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="flex items-center gap-2 pt-4 border-t border-slate-100 shrink-0">
                  <button
                    type="button"
                    onClick={() => setBulkMatchModal({ isOpen: false, fileName: '', previewCount: 0, matchedRows: [] })}
                    className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold text-xs cursor-pointer transition-all"
                  >
                    취소
                  </button>
                  <button
                    type="button"
                    onClick={handleApplyBulkReverseMatch}
                    className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-black text-xs shadow-md shadow-emerald-600/30 cursor-pointer transition-all"
                  >
                    ✓ 총 {bulkMatchModal.previewCount}건 역매칭 및 배송중 일괄 적용
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 등록상품 마우스 호버 플로팅 툴팁 팝오버 (Fixed 레이어로 테이블 overflow 잘림 방지) */}
          {productTooltip.visible && productTooltip.merchant && (
            <div
              className="fixed z-[9999] pointer-events-none transition-opacity duration-150"
              style={{
                top: `${productTooltip.top}px`,
                left: `${productTooltip.left}px`,
                width: '330px'
              }}
            >
              <div className="bg-slate-900/95 backdrop-blur-md text-slate-100 p-4 rounded-2xl border border-slate-700/80 shadow-2xl space-y-2.5 text-xs">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <div className="flex items-center gap-1.5 truncate">
                    <span className="text-sm">🍎</span>
                    <span className="font-black text-white text-xs truncate max-w-[190px]">
                      {productTooltip.merchant.farmName}
                    </span>
                  </div>
                  <span className="font-mono text-[10px] text-emerald-400 font-bold bg-farm-950 px-1.5 py-0.5 rounded border border-farm-800">
                    {productTooltip.merchant.merchantCode}
                  </span>
                </div>
                <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                  {(!productTooltip.merchant.products || productTooltip.merchant.products.length === 0) ? (
                    <div className="py-3 text-center text-slate-400 text-[11px]">
                      등록된 상세 상품이 없습니다.
                    </div>
                  ) : (
                    productTooltip.merchant.products.map((p, pIdx) => (
                      <div key={p.id || pIdx} className="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 flex flex-col justify-between gap-1">
                        <div className="flex items-start justify-between gap-2">
                          <div className="min-w-0">
                            <span className="bg-farm-900/80 text-emerald-300 text-[9px] font-bold px-1.5 py-0.2 rounded mr-1">
                              {p.category || '농산물'}
                            </span>
                            <b className="text-white text-xs leading-snug">{p.name}</b>
                          </div>
                          <span className="font-mono font-black text-harvest-400 text-xs shrink-0">
                            {p.salePrice ? `${Number(p.salePrice).toLocaleString()}원` : '가격 문의'}
                          </span>
                        </div>
                        <div className="flex items-center justify-between text-[10px] text-slate-400 mt-0.5">
                          <span>품종: {p.variety || '대표품종'} • {p.spec || '규격미기재'}</span>
                          {p.desc && p.desc.includes('Brix') && (
                            <span className="text-amber-300 font-bold">
                              {p.desc.match(/\d+(\.\d+)?\s*Brix/i)?.[0] || '고당도'}
                            </span>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>
                <div className="pt-1.5 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-400">
                  <span>총 {productTooltip.merchant.products?.length || 0}개 상품 등록됨</span>
                  <span className="text-emerald-400 font-medium">실시간 출하 정보</span>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function initApp() {
      const rootElem = document.getElementById('root');
      if (rootElem) {
        try {
          ReactDOM.createRoot(rootElem).render(<MainApp />);
        } catch (err) {
          console.error('React 마운트 오류:', err);
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
