                                        <button
                                          type="button"
                                          onClick={() => handleTogglePaymentOrder(orderId)}
                                          className="btn-cancel-payment px-2 py-1 rounded text-[11px] font-semibold bg-slate-100 hover:bg-amber-50 text-slate-700 hover:text-amber-800 border border-slate-300 hover:border-amber-300 transition-all cursor-pointer whitespace-nowrap active:scale-95 flex items-center gap-1 shadow-2xs"
                                          title="입금 확인을 취소하고 미입금 상태로 되돌립니다"
                                        >
                                          <span>↩️ 입금취소</span>
                                        </button>
                                      )}
                                    </div>

                                    {/* 배송 관리 (단계 선택 콤팩트 드롭다운) */}
                                    <div className="shrink-0">
                                      <select
                                        value={order.shippingStatus || '준비중'}
                                        onChange={(e) => handleChangeShippingStatus(orderId, e.target.value)}
                                        className={`text-[11px] font-semibold rounded px-1.5 py-1 border transition-all cursor-pointer ${
                                          order.shippingStatus === '배송완료'
                                            ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                                            : order.shippingStatus === '배송중'
                                            ? 'bg-blue-50 text-blue-800 border-blue-300'
                                            : 'bg-amber-50 text-amber-800 border-amber-300'
                                        }`}
                                        title="배송 진행상태 단계 전환 (송장번호 입력 시 자동으로 배송중 전환)"
                                      >
                                        <option value="준비중">📦 준비중</option>
                                        <option value="배송중">🚚 배송중</option>
                                        <option value="배송완료">✓ 배송완료</option>
                                      </select>
                                    </div>

                                    <button
                                      type="button"
                                      onClick={() => handleDeleteSingleOrder(order)}
                                      className="p-1 rounded text-slate-400 hover:text-rose-600 hover:bg-rose-50 text-[12px] transition-all cursor-pointer shrink-0"
                                      title={`주문번호 [${orderId}] 영구 삭제`}
                                    >
                                      🗑️
                                    </button>
                                  </div>
                                ) : (
                                  /* 기타 탭: 정적 결제 뱃지 + 배송 상태 선택 */
                                  <div className="flex items-center justify-center gap-1.5 flex-nowrap">
                                    <div className="shrink-0">
                                      <span className={`px-2 py-0.5 rounded text-[11px] font-semibold border whitespace-nowrap ${
                                        paidStatus ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'
                                      }`}>
                                        {paidStatus ? '결제완료' : '입금대기'}
                                      </span>
                                    </div>
                                    <div className="shrink-0">
                                      <select
                                        value={order.shippingStatus || '준비중'}
                                        onChange={(e) => handleChangeShippingStatus(orderId, e.target.value)}
                                        className={`text-[11px] font-semibold rounded px-1.5 py-1 border transition-all cursor-pointer ${
                                          order.shippingStatus === '배송완료'
                                            ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                                            : order.shippingStatus === '배송중'
                                            ? 'bg-blue-50 text-blue-800 border-blue-300'
                                            : 'bg-amber-50 text-amber-800 border-amber-300'
                                        }`}
                                        title="배송 진행상태 단계 전환"
                                      >
                                        <option value="준비중">📦 준비중</option>
                                        <option value="배송중">🚚 배송중</option>
                                        <option value="배송완료">✓ 배송완료</option>
                                      </select>
                                    </div>
                                    <button
                                      type="button"
                                      onClick={() => handleDeleteSingleOrder(order)}
                                      className="p-1 rounded text-slate-400 hover:text-rose-600 hover:bg-rose-50 text-[12px] transition-all cursor-pointer shrink-0"
                                      title={`주문번호 [${orderId}] 영구 삭제`}
                                    >
                                      🗑️
                                    </button>
                                  </div>
                                )}
                              </td>
                            </tr>
                          );
                        })
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ================================================================= */}
          {/* [메뉴 4] 💰 정산 관리 화면 (대시보드 & 농가별 정산 대장)             */}
          {/* ================================================================= */}
          {activeTab === 'SETTLEMENT' && (
            <div className="space-y-4">
              {/* 정산 요약 KPI 카드 */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                  <span className="text-xs text-slate-400 font-bold">2026년 10월 총 거래액</span>
                  <div className="text-xl font-black text-slate-900 font-mono mt-1">
                    {totalPlatformSales.toLocaleString()}원
                  </div>
                  <span className="text-[11px] text-slate-500 mt-0.5 block">전체 농가 직거래 주문 누적</span>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                  <span className="text-xs text-slate-400 font-bold">플랫폼 운영 수수료 (3.5%)</span>
                  <div className="text-xl font-black text-blue-600 font-mono mt-1">
                    {totalPlatformFee.toLocaleString()}원
                  </div>
                  <span className="text-[11px] text-blue-400 mt-0.5 block">PG 연동 및 인프라 운영비</span>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                  <span className="text-xs text-slate-400 font-bold">실수령 정산 대상액 (96.5%)</span>
                  <div className="text-xl font-black text-farm-600 font-mono mt-1">
                    {totalNetSettlement.toLocaleString()}원
                  </div>
                  <span className="text-[11px] text-farm-500 mt-0.5 block">등록 농가 지급 예정 합계</span>
                </div>

                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                  <span className="text-xs text-slate-400 font-bold">지급 완료 / 미지급 잔액</span>
                  <div className="text-xl font-black text-slate-900 font-mono mt-1">
                    <span className="text-emerald-600">{paidSettlementAmount.toLocaleString()}원</span> / <span className="text-amber-600">{pendingSettlementAmount.toLocaleString()}원</span>
                  </div>
                  <span className="text-[11px] text-amber-500 mt-0.5 block">미지급 잔여: {pendingSettlementAmount.toLocaleString()}원</span>
                </div>
              </div>

              {/* 상단 액션바 */}
              <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                <div className="flex flex-wrap items-center gap-2">
                  <h3 className="font-black text-sm text-slate-900 flex items-center gap-1.5">
                    <span>📑</span> 2026년 10월 농가별 정산 대장
                  </h3>
                  <span className="text-xs bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full font-bold">
                    정산 대상 농가: <b className="text-slate-900">{farmSettlementSummary.length}곳</b>
                  </span>
                  <span className="text-xs bg-amber-50 text-amber-800 border border-amber-200 px-2.5 py-0.5 rounded-full font-bold">
                    총 정산 대기액: <b className="text-amber-900 font-mono">{pendingSettlementAmount.toLocaleString()}원</b>
                  </span>
                  <span className="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded font-medium">
                    정기 정산일: 익월 10일
                  </span>
                </div>

                <button

            >
              <div className="bg-slate-900/95 backdrop-blur-md text-slate-100 p-4 rounded-2xl border border-slate-700/80 shadow-2xl space-y-2.5 text-xs">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <div className="flex items-center gap-1.5 truncate">
                    <span className="text-sm">🍎</span>
                    <span className="font-black text-white text-xs truncate max-w-[190px]">
                      {productTooltip.merchant.farmName}
                    </span>
                  </div>
                  <span className="font-mono text-[10px] text-emerald-400 font-bold bg-farm-950 px-1.5 py-0.5 rounded border border-farm-800">
                    {productTooltip.merchant.merchantCode}
                  </span>
                </div>
                <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                  {(!productTooltip.merchant.products || productTooltip.merchant.products.length === 0) ? (
                    <div className="py-3 text-center text-slate-400 text-[11px]">
                      등록된 상세 상품이 없습니다.
                    </div>
                  ) : (
                    productTooltip.merchant.products.map((p, pIdx) => (
                      <div key={p.id || pIdx} className="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 flex flex-col justify-between gap-1">
                        <div className="flex items-start justify-between gap-2">
                          <div className="min-w-0">
                            <span className="bg-farm-900/80 text-emerald-300 text-[9px] font-bold px-1.5 py-0.2 rounded mr-1">
                              {p.category || '농산물'}
                            </span>
                            <b className="text-white text-xs leading-snug">{p.name}</b>
                          </div>
                          <span className="font-mono font-black text-harvest-400 text-xs shrink-0">
                            {p.salePrice ? `${Number(p.salePrice).toLocaleString()}원` : '가격 문의'}
                          </span>
                        </div>
                        <div className="flex items-center justify-between text-[10px] text-slate-400 mt-0.5">
                          <span>품종: {p.variety || '대표품종'} • {p.spec || '규격미기재'}</span>
                          {p.desc && p.desc.includes('Brix') && (
                            <span className="text-amber-300 font-bold">
                              {p.desc.match(/\d+(\.\d+)?\s*Brix/i)?.[0] || '고당도'}
                            </span>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>
                <div className="pt-1.5 border-t border-slate-800/80 flex items-center justify-between text-[10px] text-slate-400">
                  <span>총 {productTooltip.merchant.products?.length || 0}개 상품 등록됨</span>
                  <span className="text-emerald-400 font-medium">실시간 출하 정보</span>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('OOMS ErrorBoundary 포착 오류:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6">
              <div className="max-w-md w-full bg-slate-800 border border-rose-500/50 rounded-2xl p-6 shadow-2xl text-center space-y-4">
                <span className="text-4xl">⚠️</span>
                <h2 className="text-lg font-black text-rose-400">화면 렌더링 중 오류가 발생했습니다</h2>
                <p className="text-xs text-slate-300 leading-relaxed break-all bg-slate-950 p-3 rounded-xl font-mono text-left">
                  {this.state.error?.message || '알 수 없는 오류'}
                </p>
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      try { localStorage.removeItem('ooms_orders'); localStorage.removeItem('ooms_staging_orders'); } catch(e){}
                      window.location.reload();
                    }}
                    className="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer"
                  >
                    데이터 초기화 후 재시도
                  </button>
                  <button
                    onClick={() => window.location.reload()}
                    className="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-xs cursor-pointer"
                  >
                    새로고침
                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function initApp() {
      const rootElem = document.getElementById('root');
      if (rootElem) {
        try {
          ReactDOM.createRoot(rootElem).render(
            <ErrorBoundary>
              <MainApp />
            </ErrorBoundary>
          );
        } catch (err) {
          console.error('React 마운트 오류:', err);
          rootElem.innerHTML = '<div style="padding:40px;text-align:center;color:#e11d48;font-weight:bold;background:#fff;border:1px solid #fecdd3;border-radius:12px;margin:20px;">OOMS 콘솔 로딩 중 오류가 발생했습니다. 브라우저를 새로고침해주세요.</div>';
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
  <script>
    // 전역 휴대전화 번호 실시간 자동 하이픈 및 최대 13자 제한 포매팅 (동적 렌더링 입력창 완벽 지원)
    document.addEventListener('input', function(e) {
      var target = e.target;
      if (!target || target.tagName !== 'INPUT') return;
      var type = target.getAttribute('type') || '';
      var id = target.id || '';
      var name = target.name || '';
      var placeholder = target.placeholder || '';

      var isPhone = type === 'tel' ||
                    /phone|tel/i.test(id) ||
                    /phone|tel/i.test(name) ||
                    /010|전화|연락처|휴대폰/i.test(placeholder);

      if (isPhone) {
        target.setAttribute('maxlength', '13');
        var val = target.value.replace(/[^0-9]/g, '');
        if (val.length > 11) val = val.slice(0, 11);

        if (val.length >= 11) {
          target.value = val.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
        } else if (val.length >= 7) {
          target.value = val.replace(/(\d{3})(\d{3,4})(\d+)/, '$1-$2-$3');
        } else if (val.length >= 4) {
          target.value = val.replace(/(\d{3})(\d+)/, '$1-$2');
        } else {
          target.value = val;
        }
      }
    }, true);
  </script>
</body>
